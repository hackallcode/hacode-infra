galaxy_info:
  role_name: "common"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Holds collection-wide defaults (no tasks). Other roles depend on this
    one to inherit shared variables.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "defaults"
    - "shared"

dependencies: []
