# ===== member =====
nats_version: "2.15.2"
# This server's name and the address it listens on for clients and the cluster (e.g. its tailnet address; the unit
# orders after tailscaled.service so that address exists first - inert on hosts without tailscale).
nats_name: "{{ inventory_hostname }}"
nats_address: ""
# Addresses of every server of the cluster, this one included; the same list on all of them.
nats_peers: []
nats_cluster_name: "nats"
nats_client_port: 4222
nats_cluster_port: 6222
# Monitoring (healthz, varz, jsz) on localhost only.
nats_monitor_port: 8222
nats_data_dir: "/var/lib/nats"
nats_config_dir: "/etc/nats"

# How often servers ping each other and how many unanswered pings drop a route. A server that dies without
# closing its connections (power loss, a network cut) is noticed only after ping_interval * ping_max; the NATS
# default of two minutes leaves requests routed to it hanging that long, so keep this a few seconds.
nats_ping_interval: "2s"
nats_ping_max: 3

# JetStream limits of this server in bytes; streams fail writes beyond them.
nats_max_file_store: 2147483648
nats_max_memory_store: 67108864

# Deep-merged over the rendered config. Locked: server_name, listen, cluster, jetstream store_dir and tls - the
# server's identity, endpoints and certificates in pki/ are wired to them.
nats_config_extra: {}

# ===== tls =====
# TLS with client certificates for clients and routes. The CA key signs server certificates on the controller;
# server keys are made on the servers and never leave them. Clients on the same host may use the server's
# certificate (pki/server.crt, pki/server.key), which carries clientAuth too.
nats_ca_key: ""
nats_ca_cert: ""
nats_cert_days: 3650
