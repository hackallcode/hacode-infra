_telegram_relay_api: "https://api.cloudflare.com/client/v4/accounts/{{ telegram_relay_account_id }}/workers"
_telegram_relay_headers:
  Authorization: "Bearer {{ telegram_relay_cloudflare_token }}"

_telegram_relay_script: "{{ lookup('ansible.builtin.file', 'worker.mjs') }}"
_telegram_relay_metadata:
  main_module: "worker.js"
  compatibility_date: "{{ telegram_relay_compatibility_date }}"
  bindings:
    - {type: "plain_text", name: "BOT_IDS", text: "{{ telegram_relay_bot_ids | map('string') | list | to_json }}"}
# A tag names what was uploaded, so a rerun reads it back instead of uploading a new version each time.
_telegram_relay_tag: >-
  deploy-{{ (_telegram_relay_script ~ (_telegram_relay_metadata | to_json)) | hash('sha256') | truncate(16, true, '') }}
_telegram_relay_write: "{{ (_telegram_relay_call.method | default('GET')) != 'GET' }}"
