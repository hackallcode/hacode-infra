- name: "{{ _telegram_relay_call.name }}"
  ansible.builtin.uri:
    url: "{{ _telegram_relay_api }}{{ _telegram_relay_call.path }}"
    method: "{{ _telegram_relay_call.method | default('GET') }}"
    headers: "{{ _telegram_relay_headers }}"
    body_format: "{{ _telegram_relay_call.body_format | default(omit) }}"
    body: "{{ _telegram_relay_call.body | default(omit) }}"
    status_code: "{{ _telegram_relay_call.ok | default([200]) }}"
  register: "_telegram_relay_response"
  check_mode: false
  changed_when: "_telegram_relay_write and _telegram_relay_response.status != 404"
  failed_when: false
  no_log: true
  when: "not (_telegram_relay_write and ansible_check_mode)"

- name: "Show why Cloudflare refused: {{ _telegram_relay_call.name }}"
  ansible.builtin.assert:
    that: "_telegram_relay_response.status in _telegram_relay_call.ok | default([200])"
    fail_msg: >-
      {{ _telegram_relay_response.status }}
      {{ _telegram_relay_response.json.errors | default(_telegram_relay_response.msg) }}
    quiet: true
  when: "_telegram_relay_response is not skipped"

- name: "Would {{ _telegram_relay_call.name | lower }}"
  ansible.builtin.debug:
    msg: "{{ _telegram_relay_call.method }} {{ _telegram_relay_call.path }}"
  changed_when: true
  when: "_telegram_relay_write and ansible_check_mode"
