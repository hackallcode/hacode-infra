- name: "Validate telegram_relay settings"
  ansible.builtin.assert:
    that:
      - "telegram_relay_cloudflare_token | length > 0"
      - "telegram_relay_account_id | length > 0"
    fail_msg: "telegram_relay uninstall needs telegram_relay_cloudflare_token and telegram_relay_account_id"
    quiet: true

- name: "Read the hostnames the script serves"
  ansible.builtin.include_tasks: "_call.yml"
  vars:
    _telegram_relay_call:
      name: "Read the hostnames the script serves"
      path: "/domains?service={{ telegram_relay_name }}"

- name: "Detach them"
  ansible.builtin.include_tasks: "_call.yml"
  vars:
    _telegram_relay_call:
      name: "Detach {{ item.hostname }}"
      path: "/domains/{{ item.id }}"
      method: "DELETE"
  loop: "{{ _telegram_relay_response.json.result }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: "Delete the script"
  ansible.builtin.include_tasks: "_call.yml"
  vars:
    _telegram_relay_call:
      name: "Delete the script"
      path: "/scripts/{{ telegram_relay_name }}"
      method: "DELETE"
      ok: [200, 404]
