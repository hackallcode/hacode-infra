# Hosts that cannot reach api.telegram.org but reach Cloudflare call the Bot API through this Worker instead, with
# the Worker's URL as their API base.

# Cloudflare API token: Workers Scripts:Edit on the account (the legacy permission; Workers:Editor alone cannot
# upload) and Workers Routes:Edit on the zone of telegram_relay_hostname.
telegram_relay_cloudflare_token: ""
telegram_relay_account_id: ""
telegram_relay_zone_id: ""

# Name in telegram_relay_zone_id the Worker answers on; Cloudflare creates its DNS record and certificate.
telegram_relay_hostname: ""
telegram_relay_name: "telegram-relay"

# Numeric bot ids, the part of a token before `:`. Calls of any other bot get 404, so the relay is no open proxy.
telegram_relay_bot_ids: []

telegram_relay_compatibility_date: "2026-11-01"
