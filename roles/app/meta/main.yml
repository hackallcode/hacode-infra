galaxy_info:
  role_name: "app"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Deploy and manage an application on a remote host: rsync sources from the
    controller, dispatch to Docker compose / Node.js build / static, manage
    lifecycle (start/stop/restart/delete), open or close firewall ports based
    on whether public domains are configured, archive data dirs.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "deployment"
    - "docker"
    - "compose"
    - "nodejs"
    - "rsync"

dependencies:
  - role: "hacode.infra.common"
