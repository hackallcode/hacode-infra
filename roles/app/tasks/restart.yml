- ansible.builtin.import_tasks: "_validate.yml"

# `restart` keeps a container's config, environment included, so a changed
# `.env` or compose file reached the service only on a later `up`. Apply the
# config first: compose recreates what changed (env_file values count). The
# restart below still runs for the whole stack either way - files the upload
# changed under a bind mount aren't part of the config, and a service whose
# config didn't change would otherwise keep serving the old ones whenever
# another service in the same stack was recreated.
- name: "Apply docker compose config changes"
  tags: ["restart"]
  community.docker.docker_compose_v2:
    project_src: "{{ app_content_dir }}"
    project_name: "{{ app_project }}"
    state: "present"
    recreate: "auto"
    wait: "{{ docker_compose_wait | default(true) | bool }}"
    wait_timeout: "{{ docker_compose_wait_timeout | default(60) | int }}"
  when:
    - "app_type == 'docker'"
    - "not (app_disabled | bool)"
    - "(sources_changed | default(true)) or (force | default(false) | bool)"
    - "not ansible_check_mode"

- name: "Restart docker compose stack"
  tags: ["restart"]
  community.docker.docker_compose_v2:
    project_src: "{{ app_content_dir }}"
    project_name: "{{ app_project }}"
    state: "restarted"
    wait: "{{ docker_compose_wait | default(true) | bool }}"
    wait_timeout: "{{ docker_compose_wait_timeout | default(60) | int }}"
  when:
    - "app_type == 'docker'"
    - "not (app_disabled | bool)"
    - "(sources_changed | default(true)) or (force | default(false) | bool)"
    - "not ansible_check_mode"

- name: "Stop docker compose stack (app_disabled=true)"
  tags: ["restart"]
  community.docker.docker_compose_v2:
    project_src: "{{ app_content_dir }}"
    project_name: "{{ app_project }}"
    state: "stopped"
  when:
    - "app_type == 'docker'"
    - "app_disabled | bool"
    - "not ansible_check_mode"
