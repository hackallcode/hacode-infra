galaxy_info:
  role_name: "certificate"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Generate an internal self-signed CA and issue per-host certificates for
    an inventory; outputs PEM artifacts to a local directory.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "tls"
    - "pki"
    - "ca"

dependencies:
  - role: "hacode.infra.common"
