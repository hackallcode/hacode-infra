# List of certs to issue. Each entry:
#   - name:      CN / filename basename (required)
#     type:      "dns" | "ip"            — SAN prefix for the name itself
#     cert_type: "ownca" | "selfsigned"  — default "ownca"
#     san:       extra SAN entries (strings, already prefixed `DNS:`/`IP:`)
server_names:

# Logical name of the CA generated by the role; used as the filename
# basename for the CA cert/key (`ca.crt`, `ca.key`) and as the
# `Common Name` of the CA subject.
cert_ca_name: "ca"

# `O=` in the CA + issued cert subjects.
cert_subject_org: "Private"

# Local output directory for issued certificates / keys.
cert_dir: "{{ hacode_output_dir }}/certs"
cert_issued_dir: "{{ cert_dir }}/issued"

# Remote-side install paths. `cert_remote_anchor_dir`, `cert_remote_cert_dir`,
# `cert_remote_key_dir`, `cert_update_trust_cmd` are family-specific and
# loaded from `vars/{{ ansible_os_family }}.yml`.
cert_remote_ca_cert_path: "{{ cert_remote_anchor_dir }}/{{ cert_ca_name }}.crt"
cert_remote_key_path: "{{ cert_remote_key_dir }}/{{ cert_entry.name }}.key"
cert_remote_cert_path: "{{ cert_remote_cert_dir }}/{{ cert_entry.name }}.crt"

# Where the CA private key lives on the controller. Kept under
# `secrets/` (typically gitignored) so it isn't accidentally committed.
cert_ca_key_path: "{{ playbook_dir }}/secrets/{{ cert_ca_name }}.key"
# Scratch CSR path during CA bootstrap (deleted after the CA cert is signed).
cert_ca_csr_path: "/tmp/{{ cert_ca_name }}.csr"
# Public CA cert on the controller — distributed to hosts as anchor.
cert_ca_cert_path: "{{ cert_dir }}/{{ cert_ca_name }}.crt"

# Subject DN fragments for both CA and issued certs.
cert_subject_country: "RU"
cert_subject_locality: "Moscow"
cert_subject_ou: "IT"

# Per-entry paths derived from `cert_entry` (the current item in the
# `server_names` loop). Resolved at task time, not at role load.
cert_server_key_path: "{{ cert_issued_dir }}/{{ cert_entry.name }}.key"
cert_server_csr_path: "{{ cert_issued_dir }}/{{ cert_entry.name }}.csr"
cert_server_cert_path: "{{ cert_issued_dir }}/{{ cert_entry.name }}.crt"
cert_server_name: "{{ cert_entry.name }}"

# SAN list assembled for the cert: the name itself (DNS: or IP:
# depending on `type`), the inventory's `ansible_host` IP when it parses
# as IPv4 (lets clients verify the cert by IP even when they reached
# the host through DNS), and any explicit extras from `cert_entry.san`.
cert_server_san: >-
  {{ (
    [(cert_entry.get('type', 'dns') | upper) ~ ':' ~ cert_entry.name] +
    (['IP:' ~ ansible_host]
       if (ansible_host is defined
           and ansible_host is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'))
       else []) +
    cert_entry.get('san', [])
  ) | unique }}

# How the cert is signed:
#   ownca       — signed by the role's CA (default; chain-trusted).
#   selfsigned  — no chain; useful for ephemeral / dev workloads.
cert_server_type: "{{ cert_entry.get('cert_type', 'ownca') }}"

# PKCS#12 keystore bundle (cert + key) for Java consumers. Generated
# when `cert_keystore_password` is non-empty.
cert_keystore_path: "{{ cert_issued_dir }}/{{ cert_entry.name }}.keystore.p12"
cert_keystore_password:
