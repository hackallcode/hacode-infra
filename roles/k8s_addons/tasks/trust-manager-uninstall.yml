- name: "Remove trust Bundle"
  tags: ["trust-manager-uninstall"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "trust.cert-manager.io/v1alpha1"
    kind: "Bundle"
    name: "{{ k8s_addons_trust_manager_bundle_name }}"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Remove CA source ConfigMap"
  tags: ["trust-manager-uninstall"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "v1"
    kind: "ConfigMap"
    name: "{{ k8s_addons_trust_manager_ca_source_name }}"
    namespace: "{{ k8s_addons_trust_manager_namespace }}"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Uninstall trust-manager chart"
  tags: ["trust-manager-uninstall"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "trust-manager"
    release_namespace: "{{ k8s_addons_trust_manager_namespace }}"
    state: "absent"
    wait: true
  delegate_to: "localhost"
  run_once: true
  become: false
