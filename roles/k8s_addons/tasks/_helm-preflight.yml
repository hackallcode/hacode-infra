# Recover from a "pending-install" / "pending-upgrade" / "pending-rollback"
# helm release left over from an interrupted operation (Ctrl+C / SIGTERM
# during `helm --wait`, transient apiserver TLS blip mid-upgrade, etc.).
# Without this preflight, the next install errors with `another operation
# (install/upgrade/rollback) is in progress` and the role is wedged until
# an operator intervenes manually.
#
# Caller sets:
#   _helm_preflight_release_name      - Helm release name
#   _helm_preflight_release_namespace - release namespace
#
# Recovery rules:
#   pending-install (rev 1 never reached deployed):
#     `helm uninstall` - no prior revision to preserve; pre-delete hooks
#     have no cluster state to act on.
#   pending-upgrade / pending-rollback / uninstalling (has a prior
#   deployed revision):
#     `helm rollback` to the previous revision. NEVER uninstall: charts
#     with pre-delete hooks (Longhorn, cert-manager, postgres-operator,
#     ...) run cluster-wide cleanup logic in the hook and would destroy
#     the data the release was managing. `uninstalling` shows up when an
#     uninstall got killed mid-flight (e.g. operator killed a stuck
#     pre-delete Job); rollback brings the release back to deployed.

- name: "Preflight: status of {{ _helm_preflight_release_name }} helm release"
  kubernetes.core.helm_info:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "{{ _helm_preflight_release_name }}"
    release_namespace: "{{ _helm_preflight_release_namespace }}"
  register: "_helm_preflight_info"
  failed_when: false
  changed_when: false
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Uninstall stuck pending-install {{ _helm_preflight_release_name }} release"
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "{{ _helm_preflight_release_name }}"
    release_namespace: "{{ _helm_preflight_release_namespace }}"
    state: "absent"
  when:
    - "_helm_preflight_info.status is defined"
    - "(_helm_preflight_info.status.status | default('')) == 'pending-install'"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Rollback stuck pending-upgrade/rollback/uninstalling {{ _helm_preflight_release_name }} release"
  ansible.builtin.command:
    argv:
      - "helm"
      - "--kubeconfig={{ k8s_addons_kubeconfig }}"
      - "-n"
      - "{{ _helm_preflight_release_namespace }}"
      - "rollback"
      - "{{ _helm_preflight_release_name }}"
  when:
    - "_helm_preflight_info.status is defined"
    - >-
      (_helm_preflight_info.status.status | default(''))
      in ['pending-upgrade', 'pending-rollback', 'uninstalling']
  changed_when: true
  delegate_to: "localhost"
  run_once: true
  become: false
