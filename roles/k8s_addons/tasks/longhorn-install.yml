- name: "Add longhorn Helm repo"
  tags: ["longhorn-install"]
  kubernetes.core.helm_repository:
    name: "longhorn"
    repo_url: "https://charts.longhorn.io"
  check_mode: false
  delegate_to: "localhost"
  run_once: true
  become: false

- ansible.builtin.import_tasks: "longhorn-values.yml"

- ansible.builtin.import_tasks: "_helm-preflight.yml"
  tags: ["longhorn-install"]
  vars:
    _helm_preflight_release_name: "longhorn"
    _helm_preflight_release_namespace: "{{ k8s_addons_longhorn_namespace }}"

- name: "Install/upgrade longhorn chart"
  tags: ["longhorn-install"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "longhorn"
    chart_ref: "longhorn/longhorn"
    chart_version: "{{ k8s_addons_longhorn_chart_version }}"
    release_namespace: "{{ k8s_addons_longhorn_namespace }}"
    create_namespace: true
    wait: true
    atomic: true
    timeout: "{{ k8s_addons_longhorn_chart_timeout }}"
    values: "{{ _longhorn_helm_values }}"
  delegate_to: "localhost"
  run_once: true
  become: false
