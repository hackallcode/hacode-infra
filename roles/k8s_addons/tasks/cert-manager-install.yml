# cert-manager: PKI controller. Prerequisite for trust-manager (its webhook
# serving cert is a cert-manager Certificate/Issuer). Installs CRDs with the
# chart (crds.enabled) so no separate CRD apply step is needed.
- name: "Add jetstack Helm repo"
  tags: ["cert-manager-install"]
  kubernetes.core.helm_repository:
    name: "jetstack"
    repo_url: "https://charts.jetstack.io"
  # Adding a repo is a safe local op; run it in check mode too so the
  # subsequent `helm show chart` can resolve jetstack/cert-manager.
  check_mode: false
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Install/upgrade cert-manager chart"
  tags: ["cert-manager-install"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "cert-manager"
    chart_ref: "jetstack/cert-manager"
    chart_version: "{{ k8s_addons_cert_manager_chart_version | default(omit, true) }}"
    release_namespace: "{{ k8s_addons_cert_manager_namespace }}"
    create_namespace: true
    wait: true
    timeout: "{{ k8s_addons_cert_manager_chart_timeout }}"
    values: >-
      {{
        {'crds': {'enabled': true, 'keep': true}}
        | combine(k8s_addons_cert_manager_extra_values, recursive=true)
      }}
  delegate_to: "localhost"
  run_once: true
  become: false

# The managed-by label is what makes the removal below safe: it marks the
# issuers this role created, so an issuer some other tool put on the
# cluster is never a candidate. `apply` so that dropping a field from a
# spec (a solver, say) actually removes it instead of merging.
- name: "Apply cert-manager ClusterIssuers"
  tags: ["cert-manager-install"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "present"
    apply: true
    definition:
      apiVersion: "cert-manager.io/v1"
      kind: "ClusterIssuer"
      metadata:
        name: "{{ item.key }}"
        labels:
          app.kubernetes.io/managed-by: "hacode.infra"
      spec: "{{ item.value }}"
  loop: "{{ k8s_addons_cert_manager_cluster_issuers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "List the ClusterIssuers this role owns"
  tags: ["cert-manager-install"]
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    api_version: "cert-manager.io/v1"
    kind: "ClusterIssuer"
    label_selectors: ["app.kubernetes.io/managed-by=hacode.infra"]
  register: "_cert_manager_owned_issuers"
  changed_when: false
  delegate_to: "localhost"
  run_once: true
  become: false

# Dropping an entry from the dict has to mean the issuer goes. Otherwise it
# keeps signing: a `Certificate` still pointing at it renews happily, and
# the inventory no longer says where those certs come from.
- name: "Remove ClusterIssuers no longer listed"
  tags: ["cert-manager-install"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "cert-manager.io/v1"
    kind: "ClusterIssuer"
    name: "{{ item }}"
  loop: >-
    {{ _cert_manager_owned_issuers.resources
       | map(attribute='metadata.name') | list
       | difference(k8s_addons_cert_manager_cluster_issuers.keys() | list) }}
  delegate_to: "localhost"
  run_once: true
  become: false
