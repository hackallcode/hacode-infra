# cert-manager: PKI controller. Prerequisite for trust-manager (its webhook
# serving cert is a cert-manager Certificate/Issuer). Installs CRDs with the
# chart (crds.enabled) so no separate CRD apply step is needed.
- name: "Add jetstack Helm repo"
  tags: ["cert-manager-install"]
  kubernetes.core.helm_repository:
    name: "jetstack"
    repo_url: "https://charts.jetstack.io"
  # Adding a repo is a safe local op; run it in check mode too so the
  # subsequent `helm show chart` can resolve jetstack/cert-manager.
  check_mode: false
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Install/upgrade cert-manager chart"
  tags: ["cert-manager-install"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "cert-manager"
    chart_ref: "jetstack/cert-manager"
    chart_version: "{{ k8s_addons_cert_manager_chart_version | default(omit, true) }}"
    release_namespace: "{{ k8s_addons_cert_manager_namespace }}"
    create_namespace: true
    wait: true
    timeout: "{{ k8s_addons_cert_manager_chart_timeout }}"
    values: >-
      {{
        {'crds': {'enabled': true, 'keep': true}}
        | combine(k8s_addons_cert_manager_extra_values, recursive=true)
      }}
  delegate_to: "localhost"
  run_once: true
  become: false
