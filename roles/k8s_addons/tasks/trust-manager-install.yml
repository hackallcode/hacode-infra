# Installs trust-manager and publishes a corporate/internal CA into every
# namespace that opts in via a label. Flow:
#   1. helm install trust-manager (OCI chart) into the cert-manager namespace;
#   2. seed a source ConfigMap with the CA cert read from the controller;
#   3. create a Bundle that fans the CA out to namespaces matching the target
#      label, as a ConfigMap workloads can mount / add to their HTTP client.
- name: "Validate trust-manager CA source file is set"
  tags: ["trust-manager-install"]
  ansible.builtin.assert:
    that: "(k8s_addons_trust_manager_ca_source_file | string | length) > 0"
    fail_msg: >-
      Set `k8s_addons_trust_manager_ca_source_file` to the controller-side path
      of the CA cert (PEM) to publish via trust-manager.

- name: "Install/upgrade trust-manager chart"
  tags: ["trust-manager-install"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "trust-manager"
    chart_ref: "{{ k8s_addons_trust_manager_chart_ref }}"
    chart_version: "{{ k8s_addons_trust_manager_chart_version | default(omit, true) }}"
    release_namespace: "{{ k8s_addons_trust_manager_namespace }}"
    create_namespace: true
    wait: true
    timeout: "{{ k8s_addons_trust_manager_chart_timeout }}"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Seed CA source ConfigMap for trust-manager"
  tags: ["trust-manager-install"]
  # Lives in the chart's namespace, created by the helm install above; in check
  # mode that namespace doesn't really exist yet, so skip.
  when: "not ansible_check_mode"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "present"
    definition:
      apiVersion: "v1"
      kind: "ConfigMap"
      metadata:
        name: "{{ k8s_addons_trust_manager_ca_source_name }}"
        namespace: "{{ k8s_addons_trust_manager_namespace }}"
      data:
        ca.crt: "{{ lookup('file', k8s_addons_trust_manager_ca_source_file) }}"
  delegate_to: "localhost"
  run_once: true
  become: false

# The Bundle CRD is registered by the trust-manager chart; the controller may
# register it a beat after `helm --wait` returns. Poll before applying so the
# first run doesn't fail on a missing CRD.
- name: "Wait for trust-manager Bundle CRD"
  tags: ["trust-manager-install"]
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    api_version: "apiextensions.k8s.io/v1"
    kind: "CustomResourceDefinition"
    name: "bundles.trust.cert-manager.io"
  register: "_k8s_addons_trust_manager_crd"
  retries: 30
  delay: 5
  # Require the CRD to be Established, not merely present: a registered-but-not-
  # Established CRD isn't in the apiserver's discovery doc yet, so the Bundle
  # apply below would fail to resolve its REST mapping.
  until: >-
    (_k8s_addons_trust_manager_crd.resources | length) > 0 and
    (_k8s_addons_trust_manager_crd.resources[0].status.conditions
       | default([]) | selectattr('type', 'eq', 'Established')
       | selectattr('status', 'eq', 'True') | list | length) > 0
  # In check mode the chart isn't really installed, so its CRD never appears;
  # skip the CRD wait and the Bundle apply that depends on it.
  when: "not ansible_check_mode"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Create trust Bundle (fans CA out to labeled namespaces)"
  tags: ["trust-manager-install"]
  when: "not ansible_check_mode"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "present"
    definition:
      apiVersion: "trust.cert-manager.io/v1alpha1"
      kind: "Bundle"
      metadata:
        name: "{{ k8s_addons_trust_manager_bundle_name }}"
      spec:
        sources:
          - configMap:
              name: "{{ k8s_addons_trust_manager_ca_source_name }}"
              key: "ca.crt"
        target:
          configMap:
            key: "{{ k8s_addons_trust_manager_target_configmap_key }}"
          namespaceSelector:
            # Build the dict via an expression: a `{{ }}` in YAML mapping-KEY
            # position is NOT templated by Jinja (only values are), so an inline
            # `"{{ key_var }}": value` would publish the literal string as the
            # label name and the trust-manager webhook rejects it.
            matchLabels: >-
              {{ {k8s_addons_trust_manager_target_label_key:
                  k8s_addons_trust_manager_target_label_value} }}
  # The Bundle CRD is freshly registered; the python client's discovery cache
  # can lag a beat behind apiserver, so the first apply may fail to find the
  # REST mapping. Retry a handful of times before giving up.
  register: "_k8s_addons_trust_manager_bundle"
  retries: 10
  delay: 6
  until: "_k8s_addons_trust_manager_bundle is succeeded"
  delegate_to: "localhost"
  run_once: true
  become: false
