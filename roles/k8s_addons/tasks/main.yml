- ansible.builtin.import_tasks: "_validate.yml"

# Cilium runs first: cluster is NotReady until the CNI lands, so every
# addon below would fail to schedule.
- name: "Install Cilium"
  tags: ["cilium-install"]
  ansible.builtin.include_tasks: "cilium-install.yml"
  when: "k8s_addons_cilium_enabled | default(false) | bool"

# DNS server blocks: pods can resolve internal zones (e.g. *.k.int-net).
- name: "Apply CoreDNS custom server blocks"
  tags: ["coredns-custom-install"]
  ansible.builtin.include_tasks: "coredns-custom-install.yml"
  when: "k8s_addons_coredns_custom_enabled | default(false) | bool"

- name: "Install Longhorn"
  tags: ["longhorn-install"]
  ansible.builtin.include_tasks: "longhorn-install.yml"
  when: "k8s_addons_longhorn_enabled | default(false) | bool"

- name: "Install Headlamp"
  tags: ["headlamp-install"]
  ansible.builtin.include_tasks: "headlamp-install.yml"
  when: "k8s_addons_headlamp_enabled | default(false) | bool"

- name: "Install Ingress-NGINX"
  tags: ["ingress-nginx-install"]
  ansible.builtin.include_tasks: "ingress-nginx-install.yml"
  when: "k8s_addons_ingress_nginx_enabled | default(false) | bool"

- name: "Install Gateway Envoy"
  tags: ["gateway-envoy-install"]
  ansible.builtin.include_tasks: "gateway-envoy-install.yml"
  when: "k8s_addons_gateway_envoy_enabled | default(false) | bool"

# cert-manager: PKI; must precede trust-manager (its webhook cert is a
# cert-manager Certificate/Issuer).
- name: "Install cert-manager"
  tags: ["cert-manager-install"]
  ansible.builtin.include_tasks: "cert-manager-install.yml"
  when: "k8s_addons_cert_manager_enabled | default(false) | bool"

# trust-manager: publish corporate/internal CA into labeled namespaces.
- name: "Install trust-manager"
  tags: ["trust-manager-install"]
  ansible.builtin.include_tasks: "trust-manager-install.yml"
  when: "k8s_addons_trust_manager_enabled | default(false) | bool"
