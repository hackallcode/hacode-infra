# Cluster-touching tasks are gated on `_headlamp_release_info.status is
# defined`. Missing release skips cleanly; unreachable cluster surfaces
# as a soft-fail on helm_info and lands in the same skip — so
# `make ... uninstall` against a dead cluster won't hang. The token-file
# cleanup at the bottom is controller-local and always runs.

- name: "Check headlamp release status (probes cluster reachability too)"
  tags: ["headlamp-uninstall"]
  kubernetes.core.helm_info:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "headlamp"
    release_namespace: "{{ k8s_addons_headlamp_namespace }}"
  register: "_headlamp_release_info"
  failed_when: false
  changed_when: false
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Uninstall headlamp chart"
  tags: ["headlamp-uninstall"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "headlamp"
    release_namespace: "{{ k8s_addons_headlamp_namespace }}"
    state: "absent"
  when: "_headlamp_release_info.status is defined"
  delegate_to: "localhost"
  run_once: true
  become: false

# Delete the cluster-scoped ClusterRoleBinding explicitly - namespace
# deletion below only reaps namespaced resources, so the CRB would
# otherwise linger pointing at a missing ServiceAccount.
- name: "Delete admin ClusterRoleBinding"
  tags: ["headlamp-uninstall"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "rbac.authorization.k8s.io/v1"
    kind: "ClusterRoleBinding"
    name: "{{ k8s_addons_headlamp_admin_sa }}"
  when: "_headlamp_release_info.status is defined"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Delete headlamp namespace"
  tags: ["headlamp-uninstall"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "v1"
    kind: "Namespace"
    name: "{{ k8s_addons_headlamp_namespace }}"
  when: "_headlamp_release_info.status is defined"
  delegate_to: "localhost"
  run_once: true
  become: false

# Controller-local; always runs (file lives next to the kubeconfig,
# nothing in the cluster).
- name: "Remove saved admin token file from controller"
  tags: ["headlamp-uninstall"]
  ansible.builtin.file:
    path: "{{ k8s_addons_headlamp_token_file }}"
    state: "absent"
  delegate_to: "localhost"
  run_once: true
  become: false
