# Removes only the Helm release + namespace. Host packages
# (iscsi-initiator-utils / open-iscsi, nfs-utils / nfs-common) and the
# replica data on disk under `defaultDataPath` (default /var/lib/longhorn)
# are kept - both are cheap and may still be wanted by the operator.
#
# Cluster-touching tasks are gated on `_longhorn_release_info.status is
# defined`. Missing release skips cleanly; unreachable cluster surfaces
# as a soft-fail on helm_info and lands in the same skip — so
# `make ... uninstall` against a dead cluster won't hang.

- name: "Check longhorn release status (probes cluster reachability too)"
  tags: ["longhorn-uninstall"]
  kubernetes.core.helm_info:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "longhorn"
    release_namespace: "{{ k8s_addons_longhorn_namespace }}"
  register: "_longhorn_release_info"
  failed_when: false
  changed_when: false
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Uninstall longhorn chart"
  tags: ["longhorn-uninstall"]
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    name: "longhorn"
    release_namespace: "{{ k8s_addons_longhorn_namespace }}"
    state: "absent"
  when: "_longhorn_release_info.status is defined"
  delegate_to: "localhost"
  run_once: true
  become: false

- name: "Delete longhorn namespace"
  tags: ["longhorn-uninstall"]
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_addons_kubeconfig }}"
    state: "absent"
    api_version: "v1"
    kind: "Namespace"
    name: "{{ k8s_addons_longhorn_namespace }}"
  when: "_longhorn_release_info.status is defined"
  delegate_to: "localhost"
  run_once: true
  become: false
