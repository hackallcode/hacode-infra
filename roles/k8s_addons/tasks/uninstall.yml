# Uninstall entrypoint. Runs unconditionally so the user can tear an
# addon down without first re-asserting its `_enabled` flag.
#
# Tags use the `<addon>-uninstall` lifecycle suffix so that
# `--tags cilium` (or any addon name on its own) matches NOTHING — install
# and uninstall must be invoked explicitly. This is intentional after a
# real-world incident where `--tags cilium` unexpectedly tore down a live
# install because the same `cilium` tag fired in both lifecycles.

- name: "Validate kubeconfig is set for uninstall"
  tags: ["always"]
  ansible.builtin.assert:
    that: "(k8s_addons_kubeconfig | length) > 0"
    fail_msg: >-
      Set `k8s_addons_kubeconfig` (or define `k3s_cluster_name` in scope
      so the default resolves) to uninstall any addon.

# egress-proxy before Kyverno (its ClusterPolicy is a Kyverno resource).
- name: "Uninstall egress proxy"
  tags: ["egress-proxy-uninstall"]
  ansible.builtin.include_tasks: "egress-proxy-uninstall.yml"

- name: "Uninstall Kyverno"
  tags: ["kyverno-uninstall"]
  ansible.builtin.include_tasks: "kyverno-uninstall.yml"

- name: "Uninstall trust-manager"
  tags: ["trust-manager-uninstall"]
  ansible.builtin.include_tasks: "trust-manager-uninstall.yml"

# cert-manager after trust-manager (trust-manager depends on it).
- name: "Uninstall cert-manager"
  tags: ["cert-manager-uninstall"]
  ansible.builtin.include_tasks: "cert-manager-uninstall.yml"

- name: "Remove CoreDNS custom server blocks"
  tags: ["coredns-custom-uninstall"]
  ansible.builtin.include_tasks: "coredns-custom-uninstall.yml"

- name: "Uninstall Headlamp"
  tags: ["headlamp-uninstall"]
  ansible.builtin.include_tasks: "headlamp-uninstall.yml"

- name: "Uninstall Envoy Gateway"
  tags: ["envoy-gateway-uninstall"]
  ansible.builtin.include_tasks: "envoy-gateway-uninstall.yml"

- name: "Uninstall kube-state-metrics"
  tags: ["kube-state-metrics-uninstall"]
  ansible.builtin.include_tasks: "kube-state-metrics-uninstall.yml"

- name: "Uninstall Ingress-NGINX"
  tags: ["ingress-nginx-uninstall"]
  ansible.builtin.include_tasks: "ingress-nginx-uninstall.yml"

- name: "Uninstall Longhorn"
  tags: ["longhorn-uninstall"]
  ansible.builtin.include_tasks: "longhorn-uninstall.yml"

# Cilium last: anything above may need the CNI to talk to the apiserver
# while it's being torn down.
- name: "Uninstall Cilium"
  tags: ["cilium-uninstall"]
  ansible.builtin.include_tasks: "cilium-uninstall.yml"
