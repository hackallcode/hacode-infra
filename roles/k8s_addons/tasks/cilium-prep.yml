# Cilium leaves `OLD_CILIUM_*` chains in iptables when the agent shuts
# down uncleanly (kill -9, node crash, external `systemctl restart k3s`).
# The agent renames its live chains to `OLD_CILIUM_*` before installing
# fresh ones; if it didn't get the chance, the old chains persist across
# the next start and the agent ends up appending to a working masquerade
# chain that points at no-longer-existing rules. Symptom: pod→external
# times out while hostNetwork pod→external works.
#
# Flush + delete any orphan `OLD_CILIUM_*` chains before the agent starts.
# Idempotent (no-ops when nothing's stale), and safe to run as a host-prep
# step even on first install (just finds nothing).

# `iptables-save` walks every table, and the chains live in whichever one
# Cilium put them in - `OLD_CILIUM_PRE_nat` is in `nat`, not `filter`. The
# table has to travel with the chain name, or `-F` runs against `filter`
# and dies with "No chain/target/match by that name".
- name: "Probe for stale OLD_CILIUM_* iptables chains"
  tags: ["cilium-install"]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      iptables-save | awk '/^\*/ {t = substr($1, 2)} /^:OLD_CILIUM/ {print t, substr($1, 2)}'
    executable: "/bin/bash"
  register: "_cilium_orphan_chains"
  changed_when: false
  failed_when: false

- name: "Parse stale OLD_CILIUM entries into (table, chain) pairs"
  tags: ["cilium-install"]
  ansible.builtin.set_fact:
    _cilium_orphan_pairs: >-
      {{ _cilium_orphan_chains.stdout_lines | default([]) | map('split') | list }}

# A chain that something still jumps to cannot be deleted: iptables answers
# `CHAIN_DEL failed (Device or resource busy)` and the chain stays. Cilium
# leaves exactly that behind - the feeder rules in PREROUTING/POSTROUTING keep
# pointing at the renamed chains - so the jumps go first, then the flush, then
# the delete.
#
# All three steps live in one task, retried as a whole, because a running
# agent is editing the same tables: it can re-add a feeder between our delete
# and the `-X`, and it can remove a chain between our probe and the flush.
# Either way the retry re-reads the current state. A chain that is already
# gone is the outcome this task wants, so it counts as success.
#
# The rules are fed back through `xargs`, not a shell loop: a feeder rule
# carries `--comment "cilium-feeder: CILIUM_OUTPUT"`, and an unquoted
# expansion splits that comment into two arguments.
- name: "Unfeed, flush and delete stale OLD_CILIUM_* chains"
  tags: ["cilium-install"]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      table="{{ item.0 }}"; chain="{{ item.1 }}";
      iptables -t "$table" -L "$chain" -n >/dev/null 2>&1 || exit 0;
      rules=$(iptables-save -t "$table" | grep -E -- "^-A .* -j $chain( |$)" || true);
      [ -z "$rules" ] || printf '%s\n' "$rules" | sed 's/^-A/-D/' | xargs -r -L1 iptables -t "$table";
      iptables -t "$table" -F "$chain";
      iptables -t "$table" -X "$chain"
    executable: "/bin/bash"
  loop: "{{ _cilium_orphan_pairs }}"
  register: "_cilium_unfeed"
  retries: 5
  delay: 3
  until: "_cilium_unfeed is succeeded"
  changed_when: "_cilium_unfeed.rc == 0"
