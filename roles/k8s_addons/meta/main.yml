galaxy_info:
  role_name: "k8s_addons"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Install opinionated Kubernetes addons (Cilium CNI, Longhorn block
    storage, Headlamp, Ingress-NGINX) into an existing cluster via Helm
    and raw manifests. Each addon is gated by its own
    `k8s_addons_<name>_enabled` flag and lives in its own
    `tasks/<addon>-*.yml`.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "kubernetes"
    - "helm"
    - "addons"

dependencies:
  - role: "hacode.infra.common"
