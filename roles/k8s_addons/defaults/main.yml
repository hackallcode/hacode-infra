# ===== Cluster target =====
# Path to a kubeconfig on the controller. The role's helm/k8s calls all
# delegate to localhost and use this file. Auto-derives from the k3s role's
# kubeconfig vars when present, so dropping `k8s_addons` into the same
# inventory group as `hacode.infra.k3s` Just Works - including the case
# where the operator pinned a custom `k3s_kubeconfig_local_file` /
# `_local_dir` per cluster. For clusters provisioned by anything other
# than hacode.infra.k3s, set this explicitly per host / group.
k8s_addons_kubeconfig: >-
  {{
    ((k3s_kubeconfig_local_dir | default(hacode_kube_configs_dir))
     ~ '/'
     ~ (k3s_kubeconfig_local_file | default(k3s_cluster_name ~ '.yml')))
    if (k3s_cluster_name is defined and (k3s_cluster_name | string | length > 0))
    else ''
  }}

# ===== Cilium (CNI + NetworkPolicy) =====
# Replacement CNI for clusters that disable k3s's built-in flannel +
# kube-router (`--flannel-backend=none --disable-network-policy`). Brings
# the cluster much closer to DOKS / GKE / EKS defaults. Until this chart
# lands, the node sits NotReady and CoreDNS stays Pending - that's expected.
k8s_addons_cilium_enabled: false

# Pinned chart version. Repo: https://helm.cilium.io.
k8s_addons_cilium_chart_version: "1.16.5"

# Helm chart install timeout, passed as `--timeout`. Cilium's daemonset has
# to come up cluster-wide before `helm --wait` returns Ready, so allow some
# slack on cold installs.
k8s_addons_cilium_chart_timeout: "10m0s"

k8s_addons_cilium_namespace: "kube-system"

# Cilium operator replica count. Upstream default is 2 (HA), but a 1-node
# cluster can never schedule two operators on distinct nodes, so one stays
# Pending and `helm --wait` times out. Default to 1; bump to 2 for HA.
k8s_addons_cilium_operator_replicas: 1

# Pod CIDR Cilium hands out to nodes. Defaults to whatever k3s is using
# (so pod IPs land inside the range firewalld trusts); falls back to
# k3s's own default when the var isn't in scope.
k8s_addons_cilium_pod_cidr: "{{ k3s_cluster_cidr | default('10.42.0.0/16') }}"
k8s_addons_cilium_pod_cidr_mask_size: 24

# kube-proxy replacement. DOKS keeps stock kube-proxy; default "false"
# matches. Set to "true" together with `--disable-kube-proxy` in
# `k3s_server_args` for the Cilium-only datapath.
#
# Cilium >=1.16 expects the *string* "true"/"false" here, not a bool.
k8s_addons_cilium_kube_proxy_replacement: "false"

# Apiserver endpoint used by Cilium when it replaces kube-proxy.
k8s_addons_cilium_k8s_service_host: ""
k8s_addons_cilium_k8s_service_port: 6443

# Don't tear down other CNI configs k3s may have written (e.g. leftover
# flannel `10-flannel.conflist` if k3s was reinstalled without wiping
# /etc/cni/net.d). Set `true` for a strict single-CNI environment.
k8s_addons_cilium_cni_exclusive: false

# Interfaces Cilium attaches BPF programs to for native routing /
# encapsulation. Empty (default) lets Cilium auto-detect via the route
# table. Pin to a specific NIC (e.g. "eth0") when the node has multiple
# public interfaces and the auto-pick lands on the wrong one — DigitalOcean
# droplets with a floating IP + a separate node-IP NIC are a known case.
# Accepts a comma-separated list or a glob (e.g. "eth+" for all eth*).
k8s_addons_cilium_devices: ""

# Interface(s) used as the SNAT source for pod→external traffic. Empty
# lets Cilium derive from `_devices` / the default route. Pin to the
# egress NIC (e.g. "eth0") when pod-to-internet times out because pod IPs
# leak out unmasqueraded — typical symptom on multi-NIC nodes. Note that
# self-hosted k3s on systemd-restart can transiently flush the iptables
# masquerade chain; Cilium re-installs it on the next agent reconcile
# loop, but `kubectl -n kube-system rollout restart ds/cilium` is the
# fast manual recovery.
k8s_addons_cilium_egress_masquerade_interfaces: ""

# Extra values merged on top of the role's defaults (deep-merge, user wins
# on conflicts). Use to enable Hubble, BGP, ClusterMesh, etc.
k8s_addons_cilium_extra_values: {}

# ===== Longhorn (block storage / CSI) =====
# Distributed block storage with iSCSI. Use it when k3s is installed with
# `--disable=local-storage` (DOKS-style) and the cluster still needs a
# working default StorageClass. Longhorn replicates volumes across nodes;
# on a single-node cluster it stores locally with no replication.
#
# Host requirements (iscsid + open-iscsi/iscsi-initiator-utils) are
# installed by `tasks/host-prep.yml` -> `tasks/longhorn-prep.yml` from a
# separate play that targets every cluster node, not just the server.
k8s_addons_longhorn_enabled: false

# Pinned chart version. Repo: https://charts.longhorn.io.
k8s_addons_longhorn_chart_version: "1.7.2"

# Helm chart install timeout. Longhorn rolls out its manager DaemonSet,
# CSI driver, and engine images cluster-wide before `helm --wait` returns
# Ready, so the cold-install path needs noticeable slack.
k8s_addons_longhorn_chart_timeout: "10m0s"

k8s_addons_longhorn_namespace: "longhorn-system"

# Replica count for the default StorageClass + global default. Upstream
# chart default is 3 (HA across nodes); on a single-node cluster PVCs stay
# Pending forever waiting for distinct nodes. Bump to 3 once you have HA.
k8s_addons_longhorn_replica_count: 1

# Whether Longhorn's StorageClass is marked as the cluster default. With
# k3s --disable=local-storage there's no other default, so PVCs without an
# explicit `storageClassName` need this to bind.
k8s_addons_longhorn_default_storage_class: true

# Opt-in: install nfs-utils / nfs-common on every cluster node so Longhorn
# can serve ReadWriteMany volumes via its internal NFS provisioner.
k8s_addons_longhorn_install_nfs: false

# Extra values merged on top of the role's defaults (deep-merge, user wins
# on conflicts).
k8s_addons_longhorn_extra_values: {}

# ===== Headlamp (Kubernetes web UI) =====
# Successor to the now-archived `kubernetes-dashboard`; CNCF/kubernetes-sigs
# project, actively maintained. Per-cluster opt-in.
k8s_addons_headlamp_enabled: false

# Pinned chart version. Repo: https://kubernetes-sigs.github.io/headlamp/.
k8s_addons_headlamp_chart_version: "0.42.0"

# Helm chart install timeout, passed as `--timeout`. Format follows Go's
# time.ParseDuration ("10m0s", "1h").
k8s_addons_headlamp_chart_timeout: "5m0s"

k8s_addons_headlamp_namespace: "headlamp"

# Fixed NodePort for the Service. Set to expose Headlamp directly on every
# node (port must be within `--service-node-port-range`, default
# 30000-32767). Leave empty to keep the chart default (`ClusterIP`) and
# route through an Ingress instead. The chart serves **plain HTTP** on
# container port 4466; the role maps NodePort → service port 80 → 4466,
# terminate TLS upstream if you need https.
k8s_addons_headlamp_node_port: ""

# Headlamp Ingress shortcut. Set `_host` to the FQDN the chart should serve
# on; the role builds the Ingress resource off it. Reach for
# `_extra_values.ingress` only when this two-knob shape isn't enough
# (multiple hosts, TLS secrets, annotations, exact-match paths, etc.).
k8s_addons_headlamp_ingress_enabled: false
k8s_addons_headlamp_ingress_class_name: "nginx"
k8s_addons_headlamp_ingress_host: ""
k8s_addons_headlamp_ingress_path: "/"

# Admin ServiceAccount. The role creates a long-lived
# `kubernetes.io/service-account-token` Secret bound to cluster-admin and
# saves the decoded bearer token to `k8s_addons_headlamp_token_file`
# (mode 0600), which by default lands next to the kubeconfig - e.g.
# kubeconfig `<dir>/prod.yml` → token `<dir>/prod-headlamp-token.txt`.
k8s_addons_headlamp_admin_sa: "headlamp-admin"

# Controller-side path where the headlamp admin bearer token is saved.
# Derives from the kubeconfig basename so the cluster identifier stays
# visible in the filename without introducing a separate `cluster_name`
# variable. Override to relocate the token elsewhere.
k8s_addons_headlamp_token_file: >-
  {{ k8s_addons_kubeconfig | dirname }}/{{
    k8s_addons_kubeconfig | basename | regex_replace('\.ya?ml$', '')
  }}-headlamp-token.txt

# Extra values merged on top of the role's NodePort defaults
# (deep-merge, user wins on conflicts). Use to enable OIDC, plugins,
# resource limits, etc.
k8s_addons_headlamp_extra_values: {}

# ===== Ingress-NGINX (HTTP/L7 ingress controller) =====
# Helm chart from kubernetes/ingress-nginx. Service type is forced to
# `NodePort` (chart default is `LoadBalancer`, which silently stays in
# `<pending>` on baremetal / on-prem clusters with no cloud LB controller).
# Per-cluster opt-in.
k8s_addons_ingress_nginx_enabled: false

# Pinned chart version. Repo: https://kubernetes.github.io/ingress-nginx.
# Chart version tracks the controller image: chart `4.x.y` ships controller
# `1.x.y`.
k8s_addons_ingress_nginx_chart_version: "4.15.1"

# Helm chart install timeout, passed as `--timeout`. Format follows Go's
# time.ParseDuration ("10m0s", "1h").
k8s_addons_ingress_nginx_chart_timeout: "5m0s"

k8s_addons_ingress_nginx_namespace: "ingress-nginx"

# Fixed NodePorts for the controller's external HTTP/HTTPS listeners.
# Leave empty (`""`) for auto-assignment from the cluster's NodePort range
# (default 30000-32767). Set when an upstream proxy / external nginx needs
# deterministic targets.
k8s_addons_ingress_nginx_http_node_port: ""
k8s_addons_ingress_nginx_https_node_port: ""

# Extra values merged on top of the role's NodePort defaults
# (deep-merge, user wins on conflicts). Use to tune resources, enable
# metrics, switch IngressClass name, etc.
k8s_addons_ingress_nginx_extra_values: {}

# ===== kube-state-metrics (Kubernetes object-state metrics) =====
# Installs kube-state-metrics so an external Prometheus can scrape
# Kubernetes object state (Deployments, Pods, Nodes, PVCs, etc.). The role
# also creates a scoped ServiceAccount token for API-server proxy scraping:
# kubelet/cAdvisor via nodes/proxy and kube-state-metrics via services/proxy.
k8s_addons_kube_state_metrics_enabled: false

# Pinned chart version. Repo: https://prometheus-community.github.io/helm-charts.
k8s_addons_kube_state_metrics_chart_version: "7.5.1"

# Helm chart install timeout, passed as `--timeout`.
k8s_addons_kube_state_metrics_chart_timeout: "5m0s"

k8s_addons_kube_state_metrics_namespace: "kube-system"

# ServiceAccount used by an external Prometheus to perform Kubernetes
# service discovery and scrape metrics through the API server proxy.
k8s_addons_kube_state_metrics_prometheus_sa: "kube-state-metrics-prometheus-scrape"

# Controller-side files written from the ServiceAccount token Secret. The
# default names derive from the kubeconfig basename so multiple clusters can
# coexist in the same output directory without clobbering each other.
k8s_addons_kube_state_metrics_prometheus_token_file: >-
  {{ k8s_addons_kubeconfig | dirname }}/{{
    k8s_addons_kubeconfig | basename | regex_replace('\.ya?ml$', '')
  }}-prometheus-token.txt
k8s_addons_kube_state_metrics_prometheus_ca_file: >-
  {{ k8s_addons_kubeconfig | dirname }}/{{
    k8s_addons_kubeconfig | basename | regex_replace('\.ya?ml$', '')
  }}-prometheus-ca.crt

# Extra Helm values deep-merged over the chart defaults (user wins). Use to
# set kube-state-metrics resources, collectors, metric allow/deny lists, etc.
k8s_addons_kube_state_metrics_extra_values: {}

# ===== Envoy Gateway (Gateway API controller) =====
# The upstream Envoy Gateway product (gateway.envoyproxy.io): a dynamic
# Gateway API controller that watches GatewayClass/Gateway/HTTPRoute and
# provisions the Envoy data-plane itself. The role installs the official
# chart (control plane + Gateway API CRDs) and then reconciles a
# GatewayClass + Gateway so a data-plane comes up ready for HTTPRoutes.
# Routing policy stays in the workload charts (HTTPRoute/*Policy), not here.
k8s_addons_envoy_gateway_enabled: false

# Official OCI chart (control plane + bundled Gateway API + Envoy Gateway
# CRDs). Pinned so installs are reproducible; bump intentionally. The chart
# version tracks the Envoy Gateway app version 1:1.
k8s_addons_envoy_gateway_chart_ref: "oci://docker.io/envoyproxy/gateway-helm"
k8s_addons_envoy_gateway_chart_version: "v1.8.2"
k8s_addons_envoy_gateway_chart_timeout: "5m0s"
k8s_addons_envoy_gateway_namespace: "envoy-gateway-system"

# GatewayClass the controller owns. Its controllerName MUST be the fixed
# Envoy Gateway string below (the chart's controller only reconciles
# GatewayClasses carrying exactly this value); kept configurable only for
# the name, not the controllerName.
k8s_addons_envoy_gateway_class_name: "envoy-gateway"
k8s_addons_envoy_gateway_controller_name: "gateway.envoyproxy.io/gatewayclass-controller"

# The Gateway the role reconciles against the class above. Its namespace is
# where the controller provisions the Envoy data-plane Deployment/Service.
k8s_addons_envoy_gateway_gateway_name: "eg"
k8s_addons_envoy_gateway_gateway_namespace: "envoy-gateway-system"

# Gateway listeners. Default is a single plain-HTTP listener on :80 that
# accepts HTTPRoutes from every namespace, so workload charts in any
# namespace can attach by ParentRef without editing this role. Override the
# whole list to add an HTTPS/TLS listener, restrict `allowedRoutes`, etc.
# `allowedRoutes.namespaces.from: All` is what makes the shared-Gateway,
# route-per-namespace pattern work.
k8s_addons_envoy_gateway_listeners:
  - name: "http"
    port: 80
    protocol: "HTTP"
    allowedRoutes:
      namespaces:
        from: "All"

# Envoy data-plane Service type. The chart provisions a LoadBalancer by
# default, which stays <pending> on a baremetal cluster with no cloud LB;
# NodePort matches how ingress-nginx/contour are exposed here so an upstream
# proxy can target it directly. Applied via an EnvoyProxy resource attached
# to the GatewayClass parametersRef.
k8s_addons_envoy_gateway_service_type: "NodePort"
# Fixed NodePorts for the data-plane Service. Leave empty (`{}`) to let
# Kubernetes allocate from the service-node-port range; set when an upstream
# proxy needs a stable target across reprovisions. Only listeners present on
# the Gateway get a port; names must match a listener name above.
k8s_addons_envoy_gateway_node_ports: {}
# externalTrafficPolicy for the data-plane Service. "Cluster" (the default
# here) lets any node forward to the Envoy pod, which is what a single
# upstream proxy hitting one NodePort target needs. "Local" only answers on
# nodes running an Envoy pod, so an upstream proxy aimed at a pod-less node
# hangs; keep Cluster unless you front the NodePort with a per-node LB.
k8s_addons_envoy_gateway_service_external_traffic_policy: "Cluster"

# Extra Helm values deep-merged over the role's defaults (user wins on key
# conflicts). Use to tune the control-plane `deployment.envoyGateway`
# resources, enable metrics, set the log level, etc. The role does not pin
# opinionated chart values today, so this is the sole Helm customization
# point.
k8s_addons_envoy_gateway_extra_values: {}

# Extra fields deep-merged into the provisioned data-plane's EnvoyProxy
# `spec.provider.kubernetes` (user wins). Use to pin the Envoy Deployment's
# `envoyDeployment.pod`/`.container` resources, replicas, tolerations, etc.
# The role sets `envoyService.type`, `externalTrafficPolicy` (and nodePorts
# when set) from the variables above; a matching key here wins on merge.
k8s_addons_envoy_gateway_proxy_extra_spec: {}

# ===== CoreDNS custom server blocks =====
# Writes a `coredns-custom` ConfigMap in kube-system. k3s/CoreDNS auto-imports
# it (import plugin ships with k3s), so extra zones load without a restart.
# Per-cluster opt-in.
k8s_addons_coredns_custom_enabled: false

# List of server blocks. Each item:
#   - name: "k-int-net"      # ConfigMap data key prefix (-> `<name>.server`)
#     zone: "k.int-net:53"   # CoreDNS zone the block serves
#     forward: "10.0.1.10"   # upstream resolver(s); string or list of IPs
#     cache: 30              # optional, seconds (default 30)
k8s_addons_coredns_custom_servers: []

# ===== trust-manager (publish a corporate/internal CA) =====
# Installs trust-manager and fans a CA cert out to namespaces that carry the
# target label, as a ConfigMap workloads can trust. Per-cluster opt-in.
k8s_addons_trust_manager_enabled: false

# OCI chart reference. Leave chart_version empty to track the chart's latest;
# pin it once a known-good version is chosen.
k8s_addons_trust_manager_chart_ref: "oci://quay.io/jetstack/charts/trust-manager"
k8s_addons_trust_manager_chart_version: ""
k8s_addons_trust_manager_chart_timeout: "5m0s"
k8s_addons_trust_manager_namespace: "cert-manager"

# REQUIRED when enabled: controller-side path to the CA cert (PEM) to publish.
k8s_addons_trust_manager_ca_source_file: ""
# Name of the source ConfigMap (in `_namespace`) seeded with the CA cert.
k8s_addons_trust_manager_ca_source_name: "cute-ca-source"

# Bundle name and the namespace label that opts a namespace into the CA.
# trust-manager then writes a ConfigMap (key `_target_configmap_key`) into each
# matching namespace with the CA bundle.
k8s_addons_trust_manager_bundle_name: "cute-ca"
k8s_addons_trust_manager_target_label_key: "cute-ca"
k8s_addons_trust_manager_target_label_value: "enabled"
k8s_addons_trust_manager_target_configmap_key: "ca.crt"

# ===== cert-manager (PKI; prerequisite for trust-manager) =====
# trust-manager's webhook serving cert is a cert-manager Certificate/Issuer, so
# cert-manager must be present before trust-manager. Per-cluster opt-in.
k8s_addons_cert_manager_enabled: false
# Leave chart_version empty to track latest; pin once a known-good version chosen.
k8s_addons_cert_manager_chart_version: ""
k8s_addons_cert_manager_chart_timeout: "5m0s"
k8s_addons_cert_manager_namespace: "cert-manager"
# Extra helm values (deep-merged over {crds: {enabled, keep}}).
k8s_addons_cert_manager_extra_values: {}
