- name: "Get backup name for {{ db_name }}"
  tags: ["backup"]
  ansible.builtin.set_fact:
    backup_name: "{{ hacode_backup_stamp }}_{{ db_name }}.sql.gz"

# Dumped inside the container: the host's client (mysql-8 `mysqldump` on
# EL8/9, which community.mysql refuses for a MariaDB server, or none at
# all) doesn't have to match the server. The password never leaves the
# container's secret file.
- name: "Dump database {{ db_name }}"
  tags: ["backup"]
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      docker exec {{ maria_db_dest_name | quote }} sh -c
      'MYSQL_PWD="$(cat /run/secrets/mariadb_root_password)" exec
      "$(command -v mariadb-dump || command -v mysqldump)" -uroot
      --single-transaction --routines --triggers --events "$1"' sh {{ db_name | quote }}
      | gzip > {{ (maria_db_backup_remote_dir ~ '/' ~ backup_name) | quote }}
    executable: "/bin/bash"
  changed_when: true

- name: "Move the dump of {{ db_name }} to the controller"
  tags: ["backup"]
  ansible.builtin.include_role:
    name: "hacode.infra.common"
    tasks_from: "pull"
    apply:
      tags: ["backup"]
  vars:
    hacode_pull_src: "{{ maria_db_backup_remote_dir }}/{{ backup_name }}"
    hacode_pull_dest_dir: "{{ maria_db_backup_local_dir }}"
