- name: "Validate etcd settings"
  ansible.builtin.assert:
    that:
      - "etcd_address | length > 0"
      - "etcd_name in (etcd_members | map(attribute='name'))"
      - "etcd_ca_key | length > 0 and etcd_ca_cert | length > 0"
    fail_msg: "etcd needs etcd_address, etcd_members with this etcd_name, etcd_ca_key and etcd_ca_cert"
    quiet: true

- name: "Create the etcd user"
  ansible.builtin.user:
    name: "etcd"
    system: true
    shell: "/sbin/nologin"
    home: "{{ etcd_data_dir }}"
    create_home: false

- name: "Create etcd dirs"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ etcd_data_dir }}", owner: "etcd", mode: "0700"}
    - {path: "{{ etcd_config_dir }}", owner: "root", mode: "0755"}
    - {path: "{{ etcd_config_dir }}/pki", owner: "etcd", mode: "0750"}
    - {path: "/opt/etcd-v{{ etcd_version }}", owner: "root", mode: "0755"}

- name: "Check for the unpacked release"
  ansible.builtin.stat:
    path: "/opt/etcd-v{{ etcd_version }}/etcd"
  register: "_etcd_unpacked"

- name: "Download etcd, checked against the release checksums"
  ansible.builtin.get_url:
    url: "{{ _etcd_release }}/etcd-v{{ etcd_version }}-linux-{{ _etcd_arch }}.tar.gz"
    dest: "/opt/etcd-v{{ etcd_version }}/release.tar.gz"
    checksum: "sha256:{{ _etcd_release }}/SHA256SUMS"
    mode: "0644"
    timeout: 60
  when: "not _etcd_unpacked.stat.exists"

- name: "Unpack etcd"
  ansible.builtin.unarchive:
    src: "/opt/etcd-v{{ etcd_version }}/release.tar.gz"
    dest: "/opt/etcd-v{{ etcd_version }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "/opt/etcd-v{{ etcd_version }}/etcd"

- name: "Link etcd binaries"
  ansible.builtin.file:
    src: "/opt/etcd-v{{ etcd_version }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: "link"
    force: true
  loop: ["etcd", "etcdctl", "etcdutl"]
  notify: "Restart etcd"

- name: "Write the CA certificate"
  ansible.builtin.copy:
    content: "{{ etcd_ca_cert | trim }}\n"
    dest: "{{ etcd_config_dir }}/pki/ca.crt"
    owner: "etcd"
    group: "etcd"
    mode: "0644"
  notify: "Restart etcd"

- name: "Make this member's key"
  community.crypto.openssl_privatekey:
    path: "{{ etcd_config_dir }}/pki/member.key"
    type: "ECC"
    curve: "secp256r1"
    owner: "etcd"
    group: "etcd"
    mode: "0600"

- name: "Make this member's certificate request"
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ etcd_config_dir }}/pki/member.key"
    common_name: "{{ etcd_name }}"
    subject_alt_name: ["DNS:{{ etcd_name }}", "IP:{{ etcd_address }}", "IP:127.0.0.1"]
    extended_key_usage: ["serverAuth", "clientAuth"]
  register: "_etcd_csr"
  changed_when: false

- name: "Read the current member certificate"
  ansible.builtin.slurp:
    src: "{{ etcd_config_dir }}/pki/member.crt"
  register: "_etcd_cert_current"
  failed_when: false

- name: "Sign the member certificate with the CA"
  community.crypto.x509_certificate_pipe:
    content: "{{ (_etcd_cert_current.content | b64decode) if _etcd_cert_current.content is defined else omit }}"
    csr_content: "{{ _etcd_csr.csr }}"
    provider: "ownca"
    ownca_content: "{{ etcd_ca_cert }}"
    ownca_privatekey_content: "{{ etcd_ca_key }}"
    ownca_not_after: "+{{ etcd_cert_days }}d"
  delegate_to: "localhost"
  become: false
  register: "_etcd_cert"
  no_log: true

- name: "Write the member certificate"
  ansible.builtin.copy:
    content: "{{ _etcd_cert.certificate }}"
    dest: "{{ etcd_config_dir }}/pki/member.crt"
    owner: "etcd"
    group: "etcd"
    mode: "0644"
  notify: "Restart etcd"

- name: "Render the etcd config"
  ansible.builtin.template:
    src: "etcd.conf.yml.j2"
    dest: "{{ etcd_config_dir }}/etcd.conf.yml"
    owner: "root"
    group: "etcd"
    mode: "0640"
  notify: "Restart etcd"

- name: "Install etcdctl for this member"
  ansible.builtin.template:
    src: "etcdctl.sh.j2"
    dest: "/usr/local/sbin/etcdctl-local"
    owner: "root"
    group: "root"
    mode: "0750"

- name: "Install the etcd unit"
  ansible.builtin.template:
    src: "etcd.service.j2"
    dest: "/etc/systemd/system/etcd.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart etcd"

- name: "Install maintenance timers"
  vars:
    _jobs:
      - what: "defrag"
        command: "/usr/local/sbin/etcdctl-local defrag"
        on_calendar: "{{ etcd_defrag_on_calendar }}"
      - what: "backup"
        command: >-
          /bin/sh -c 'mkdir -p {{ etcd_backup_dir }} &&
          /usr/local/sbin/etcdctl-local snapshot save {{ etcd_backup_dir }}/etcd-$(date +%%Y%%m%%d).db &&
          find {{ etcd_backup_dir }} -name "etcd-*.db" -mtime +{{ etcd_backup_keep }} -delete'
        on_calendar: "daily"
  block:
    - name: "Render maintenance units"
      ansible.builtin.template:
        src: "etcd-maintenance.{{ item.1 }}.j2"
        dest: "/etc/systemd/system/etcd-{{ item.0.what }}.{{ item.1 }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop: "{{ _jobs | product(['service', 'timer']) | list }}"
      loop_control:
        label: "etcd-{{ item.0.what }}.{{ item.1 }}"
      vars:
        job: "{{ item.0 }}"

    - name: "Enable maintenance timers"
      ansible.builtin.systemd:
        name: "etcd-{{ item.what }}.timer"
        enabled: true
        state: "started"
        daemon_reload: true
      loop: "{{ _jobs }}"
      loop_control:
        label: "etcd-{{ item.what }}.timer"
      ignore_errors: "{{ ansible_check_mode }}"

- name: "Enable etcd"
  ansible.builtin.systemd:
    name: "etcd"
    enabled: true
    state: "started"
    daemon_reload: true
  when: "not ansible_check_mode"

- name: "Apply a pending etcd restart"
  ansible.builtin.meta: "flush_handlers"

- name: "Wait for this member to be healthy"
  ansible.builtin.command:
    argv: ["/usr/local/sbin/etcdctl-local", "endpoint", "health"]
  register: "_etcd_health"
  until: "_etcd_health.rc == 0"
  retries: 30
  delay: 5
  changed_when: false
  when: "not ansible_check_mode"
