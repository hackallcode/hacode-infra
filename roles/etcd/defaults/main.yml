etcd_version: "3.7.3"
# This member's name and the address it listens and advertises on (e.g. its tailnet address).
etcd_name: "{{ inventory_hostname }}"
etcd_address: ""
# Every member of the cluster: [{name, address}]; the same list on all of them.
etcd_members: []
etcd_client_port: 2379
etcd_peer_port: 2380
etcd_cluster_token: "etcd"
etcd_data_dir: "/var/lib/etcd"
etcd_config_dir: "/etc/etcd"

# TLS for clients and peers, both with client certificates. The CA key signs member certificates on the controller;
# member keys are made on the members and never leave them.
etcd_ca_key: ""
etcd_ca_cert: ""
etcd_cert_days: 3650

# Raft timing: raise both on links with high round trips (heartbeat ~ RTT, election ~ 10 heartbeats).
etcd_heartbeat_interval: 100
etcd_election_timeout: 1000
etcd_snapshot_count: 10000
etcd_quota_backend_bytes: 2147483648
etcd_auto_compaction_retention: "1h"

# Weekly defragmentation of this member and a daily snapshot kept etcd_backup_keep days; "" turns the backup off.
etcd_defrag_on_calendar: "Sun *-*-* 04:00:00"
etcd_backup_dir: "/var/backups/etcd"
etcd_backup_keep: 7
