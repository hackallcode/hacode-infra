- name: "Validate k3s_role"
  ansible.builtin.assert:
    that:
      - "k3s_role in ['server', 'agent']"
    fail_msg: >-
      k3s_role must be either 'server' or 'agent' (got: {{ k3s_role | default('<unset>') }}).
      Set it in inventory/group_vars, or call a specific tasks_from entrypoint directly.

- ansible.builtin.import_tasks: "install-server.yml"
  when: "k3s_role == 'server'"

- ansible.builtin.import_tasks: "install-agent.yml"
  when: "k3s_role == 'agent'"
