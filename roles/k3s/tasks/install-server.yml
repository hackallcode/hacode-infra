- name: "Assert k3s_token is set"
  tags: ["always"]
  ansible.builtin.assert:
    that: "k3s_token | length > 0"
    fail_msg: "k3s_token must be set in inventory"

- ansible.builtin.import_tasks: "preflight.yml"

- name: "Resolve cluster peers (hosts in k3s_server with same k3s_cluster_name)"
  tags: ["always"]
  ansible.builtin.set_fact:
    k3s_cluster_peers: >-
      {{ groups['k3s_server']
         | map('extract', hostvars)
         | selectattr('k3s_cluster_name', 'defined')
         | selectattr('k3s_cluster_name', 'equalto', k3s_cluster_name)
         | map(attribute='inventory_hostname')
         | list }}

- name: "Resolve k3s primary (first peer in this cluster)"
  tags: ["always"]
  ansible.builtin.set_fact:
    k3s_is_primary: "{{ inventory_hostname == k3s_cluster_peers[0] }}"
    k3s_primary_url: "https://{{ hostvars[k3s_cluster_peers[0]].ansible_host }}:6443"

- name: "Open k3s server ports in firewall (RHEL only)"
  tags: ["firewall"]
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: "enabled"
  loop: "{{ k3s_server_ports }}"
  when: "ansible_os_family == 'RedHat'"

- name: "Trust k3s pod/service CIDRs in firewalld (RHEL only)"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "trusted"
    source: "{{ item }}"
    permanent: true
    immediate: true
    state: "enabled"
  loop: "{{ k3s_trusted_cidrs }}"
  when:
    - "ansible_os_family == 'RedHat'"
    - "k3s_trusted_cidrs | length > 0"

- name: "Ensure k3s config directory"
  tags: ["install"]
  ansible.builtin.file:
    path: "/etc/rancher/k3s"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0700"

- name: "Write k3s server config (apiserver tls-san for public IP)"
  tags: ["install"]
  ansible.builtin.copy:
    content: "{{ {'tls-san': ([ansible_host] + (k3s_tls_san_extra | default([])))} | to_nice_yaml }}"
    dest: "/etc/rancher/k3s/config.yaml"
    owner: "root"
    group: "root"
    mode: "0600"
  register: "k3s_config"

- name: "Check if cached apiserver cert exists"
  tags: ["install"]
  ansible.builtin.stat:
    path: "/var/lib/rancher/k3s/server/tls/serving-kube-apiserver.crt"
  register: "k3s_apiserver_cert"

- name: "Drop cached apiserver cert/key (force regen with new SAN)"
  tags: ["install"]
  ansible.builtin.file:
    path: "/var/lib/rancher/k3s/server/tls/serving-kube-apiserver.{{ item }}"
    state: "absent"
  loop: ["crt", "key"]
  when:
    - "k3s_apiserver_cert.stat.exists"
    - "k3s_config is changed or (force | default(false) | bool)"

- name: "Download k3s install script"
  tags: ["install"]
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: "/usr/local/bin/k3s-install.sh"
    mode: "0755"

- name: "Compile server role-derived args (node-ip, advertise-address)"
  tags: ["install"]
  vars:
    _ip: >-
      {{
        ['--node-ip=' + k3s_node_ip, '--advertise-address=' + k3s_node_ip]
        if (k3s_node_ip | default('') | length > 0)
        else []
      }}
  ansible.builtin.set_fact:
    k3s_server_role_args: "{{ _ip | join(' ') }}"

- name: "Run k3s installer (primary server, --cluster-init)"
  tags: ["install"]
  ansible.builtin.command: "/usr/local/bin/k3s-install.sh"
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --cluster-init {{ k3s_server_role_args }} {{ k3s_server_args | join(' ') }}"
  args:
    creates: "/etc/systemd/system/k3s.service"
  when: "k3s_is_primary"

- name: "Run k3s installer (joining server)"
  tags: ["install"]
  ansible.builtin.command: "/usr/local/bin/k3s-install.sh"
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server --server {{ k3s_primary_url }}
      {{ k3s_server_role_args }} {{ k3s_server_args | join(' ') }}
  args:
    creates: "/etc/systemd/system/k3s.service"
  when: "not k3s_is_primary"

- name: "Enable and start k3s service"
  tags: ["install"]
  ansible.builtin.systemd:
    name: "k3s"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Restart k3s to apply new tls-san"
  tags: ["install"]
  ansible.builtin.systemd:
    name: "k3s"
    state: "restarted"
  when:
    - "k3s_apiserver_cert.stat.exists"
    - "k3s_config is changed or (force | default(false) | bool)"

- name: "Wait for kubeconfig file to appear"
  tags: ["install", "kubeconfig"]
  ansible.builtin.wait_for:
    path: "/etc/rancher/k3s/k3s.yaml"
    timeout: 120
  when: "k3s_is_primary"

- name: "Read kubeconfig from primary server"
  tags: ["install", "kubeconfig"]
  ansible.builtin.slurp:
    src: "/etc/rancher/k3s/k3s.yaml"
  register: "k3s_kubeconfig_raw"
  when: "k3s_is_primary"

- name: "Ensure local kubeconfig directory exists"
  tags: ["install", "kubeconfig"]
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local_dir }}"
    state: "directory"
    mode: "0700"
  delegate_to: "localhost"
  become: false
  when: "k3s_is_primary"

- name: "Check for existing local kubeconfig"
  tags: ["install", "kubeconfig"]
  ansible.builtin.stat:
    path: "{{ k3s_kubeconfig_local_dir }}/{{ k3s_kubeconfig_local_file }}"
  register: "k3s_existing_kubeconfig_stat"
  delegate_to: "localhost"
  become: false
  when: "k3s_is_primary"

- name: "Read existing local kubeconfig"
  tags: ["install", "kubeconfig"]
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_local_dir }}/{{ k3s_kubeconfig_local_file }}"
  register: "k3s_existing_kubeconfig"
  delegate_to: "localhost"
  become: false
  when:
    - "k3s_is_primary"
    - "k3s_existing_kubeconfig_stat.stat.exists | default(false)"

- name: "Save kubeconfig locally (merge cluster/user/context into existing file)"
  tags: ["install", "kubeconfig"]
  vars:
    _existing: >-
      {{ (k3s_existing_kubeconfig.content | b64decode | from_yaml)
         if (k3s_existing_kubeconfig.content is defined)
         else {} }}
    _kc_in: "{{ k3s_kubeconfig_raw.content | b64decode | from_yaml }}"
    _server: "https://{{ ansible_host }}:6443"
    _new_cluster:
      name: "{{ k3s_cluster_name }}"
      cluster: "{{ _kc_in.clusters[0].cluster | combine({'server': _server}) }}"
    _new_user:
      name: "{{ k3s_user_name }}"
      user: "{{ _kc_in.users[0].user }}"
    _new_context:
      name: "{{ k3s_context_name }}"
      context: >-
        {{ {'cluster': k3s_cluster_name, 'user': k3s_user_name}
           | combine({'namespace': k3s_namespace} if (k3s_namespace | length > 0) else {}) }}
    _clusters: >-
      {{ (_existing.clusters | default([]) | rejectattr('name', 'equalto', k3s_cluster_name) | list)
         + [_new_cluster] }}
    _users: >-
      {{ (_existing.users | default([]) | rejectattr('name', 'equalto', k3s_user_name) | list)
         + [_new_user] }}
    _contexts: >-
      {{ (_existing.contexts | default([]) | rejectattr('name', 'equalto', k3s_context_name) | list)
         + [_new_context] }}
    _kubeconfig:
      apiVersion: "v1"
      kind: "Config"
      preferences: "{{ _existing.preferences | default({}) }}"
      clusters: "{{ _clusters }}"
      users: "{{ _users }}"
      contexts: "{{ _contexts }}"
      current-context: "{{ _existing['current-context'] | default(k3s_context_name) }}"
  ansible.builtin.copy:
    content: "{{ _kubeconfig | to_nice_yaml(indent=2) }}"
    dest: "{{ k3s_kubeconfig_local_dir }}/{{ k3s_kubeconfig_local_file }}"
    mode: "0600"
  delegate_to: "localhost"
  become: false
  when: "k3s_is_primary"

# kubelet refuses to self-assign labels/taints in the kubernetes.io / k8s.io
# namespaces (NodeRestriction-style hard-check at kubelet startup). Apply
# them via API instead, after the node has registered. k3s ships a kubectl
# subcommand that uses /etc/rancher/k3s/k3s.yaml automatically.
- name: "Resolve labels/taints to apply on this node"
  tags: ["install", "labels", "taints"]
  vars:
    _user_labels: "{{ k3s_node_labels.items() | map('join', '=') | list }}"
    _cp_taint: >-
      {{
        ['node-role.kubernetes.io/control-plane=true:' + k3s_control_plane_taint]
        if (k3s_control_plane_taint | length > 0)
        else []
      }}
  ansible.builtin.set_fact:
    k3s_apply_labels: "{{ _user_labels }}"
    k3s_apply_taints: "{{ _cp_taint + k3s_node_taints }}"
    k3s_node_kubectl_name: "{{ ansible_hostname | lower }}"

- name: "Wait for this server node to register in the cluster"
  tags: ["install", "labels", "taints"]
  ansible.builtin.command:
    argv:
      - "/usr/local/bin/k3s"
      - "kubectl"
      - "get"
      - "node"
      - "{{ k3s_node_kubectl_name }}"
  register: "k3s_node_check"
  changed_when: false
  retries: 30
  delay: 4
  until: "k3s_node_check.rc == 0"
  when: "(k3s_apply_labels | length > 0) or (k3s_apply_taints | length > 0)"

- name: "Apply node labels via k3s kubectl"
  tags: ["install", "labels"]
  ansible.builtin.command:
    argv:
      - "/usr/local/bin/k3s"
      - "kubectl"
      - "label"
      - "node"
      - "{{ k3s_node_kubectl_name }}"
      - "{{ item }}"
      - "--overwrite"
  loop: "{{ k3s_apply_labels }}"
  register: "k3s_label_res"
  changed_when: "'labeled' in (k3s_label_res.stdout | default(''))"

- name: "Apply node taints via k3s kubectl"
  tags: ["install", "taints"]
  ansible.builtin.command:
    argv:
      - "/usr/local/bin/k3s"
      - "kubectl"
      - "taint"
      - "node"
      - "{{ k3s_node_kubectl_name }}"
      - "{{ item }}"
      - "--overwrite"
  loop: "{{ k3s_apply_taints }}"
  register: "k3s_taint_res"
  changed_when: "'tainted' in (k3s_taint_res.stdout | default(''))"
