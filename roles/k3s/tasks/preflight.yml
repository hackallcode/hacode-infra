- name: "Gather minimal facts (role branches on ansible_os_family)"
  tags: ["always"]
  ansible.builtin.setup:
    gather_subset: "min"
  when: "ansible_facts.os_family is not defined"

- name: "Check whether curl is already on PATH"
  tags: ["install"]
  ansible.builtin.shell:
    cmd: "command -v curl"
    executable: "/bin/bash"
  register: "k3s_curl_check"
  changed_when: false
  failed_when: false

- name: "Install curl (Debian) if missing"
  tags: ["install"]
  ansible.builtin.apt:
    name: "curl"
    state: "present"
    update_cache: true
    cache_valid_time: 3600
  when:
    - "k3s_curl_check.rc != 0"
    - "ansible_os_family == 'Debian'"

- name: "Install curl (RHEL) if missing; allow erasing curl-minimal"
  tags: ["install"]
  ansible.builtin.command: "dnf install -y --allowerasing curl"
  register: "k3s_curl_install_rhel"
  changed_when: >-
    'Installed:' in k3s_curl_install_rhel.stdout
    or 'Upgraded:' in k3s_curl_install_rhel.stdout
    or 'Replaced:' in k3s_curl_install_rhel.stdout
  when:
    - "k3s_curl_check.rc != 0"
    - "ansible_os_family == 'RedHat'"

- name: "Ensure systemd-modules-load drop-in directory exists"
  tags: ["install"]
  ansible.builtin.file:
    path: "{{ k3s_modules_load_file | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  when: "k3s_kernel_modules | length > 0"

- name: "Persist k3s kernel modules across reboots"
  tags: ["install"]
  ansible.builtin.copy:
    dest: "{{ k3s_modules_load_file }}"
    owner: "root"
    group: "root"
    mode: "0644"
    content: "{{ k3s_kernel_modules | join('\n') }}\n"
  when: "k3s_kernel_modules | length > 0"

- name: "Load k3s kernel modules"
  tags: ["install"]
  community.general.modprobe:
    name: "{{ item }}"
    state: "present"
  loop: "{{ k3s_kernel_modules }}"
  when: "k3s_kernel_modules | length > 0"

- name: "Apply k3s sysctls"
  tags: ["install"]
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: "present"
    reload: true
  loop: "{{ k3s_sysctls | dict2items }}"
  when: "k3s_sysctls | length > 0"

# k3s passes `k3s_node_ip` to etcd as `--listen-peer-urls=https://<ip>:2380`;
# if the address isn't on a local interface, etcd dies with "bind: cannot
# assign requested address" during systemctl start. This is the common
# cloud-droplet case where `ansible_host` is a floating / NAT'd public IP
# (DO droplets, AWS EIPs, GCP external IPs) routed externally to a host
# whose local NIC has a private address. Probe up-front and silently fall
# back to k3s auto-detection so the default `k3s_node_ip: {{ ansible_host }}`
# Just Works for both bare metal and cloud.
- name: "Probe local interfaces for k3s_node_ip"
  tags: ["install"]
  ansible.builtin.shell:
    cmd: "set -o pipefail; ip -o -4 addr show | awk '{print $4}' | cut -d/ -f1 | grep -Fxq -- '{{ k3s_node_ip }}'"
    executable: "/bin/bash"
  register: "k3s_node_ip_check"
  changed_when: false
  failed_when: false
  when: "k3s_node_ip | default('') | length > 0"

- name: "Fall back to k3s auto-detect when k3s_node_ip is not on a local NIC"
  tags: ["install"]
  ansible.builtin.set_fact:
    k3s_node_ip: ""
  when:
    - "k3s_node_ip | default('') | length > 0"
    - "k3s_node_ip_check.rc | default(0) != 0"

# XFS project quotas on /
# ----------------------
# kubelet's `LocalStorageCapacityIsolation` and Longhorn's replica volumes
# both need /etc/fstab-style `prjquota` on the root mount. Enabling it
# requires adding `rootflags=pquota` to the kernel cmdline (grubby / grub
# config) and rebooting — the running mount only picks up the flag on
# fresh boot. Detect the gap, fix the bootloader, reboot if the operator
# allows it. No-op on non-xfs roots or in docker containers (molecule).
- name: "Detect root filesystem type and mount options"
  tags: ["install"]
  ansible.builtin.command:
    argv: ["findmnt", "-no", "FSTYPE,OPTIONS", "/"]
  register: "k3s_root_mount"
  changed_when: false
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"

- name: "Resolve XFS prjquota state from findmnt"
  tags: ["install"]
  vars:
    _fields: "{{ (k3s_root_mount.stdout | default('')).split() }}"
  ansible.builtin.set_fact:
    k3s_root_is_xfs: "{{ (_fields[0] | default('')) == 'xfs' }}"
    k3s_root_has_prjquota: "{{ 'prjquota' in (_fields[1] | default('')) }}"
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"

- name: "Add rootflags=pquota to GRUB (RHEL family — grubby)"
  tags: ["install"]
  ansible.builtin.command:
    argv: ["grubby", "--update-kernel=ALL", "--args=rootflags=pquota"]
  register: "k3s_grubby_pquota"
  changed_when: true  # grubby has no quiet "no change" rc; treat as changed
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "k3s_root_is_xfs | default(false) | bool"
    - "not (k3s_root_has_prjquota | default(false) | bool)"
    - "ansible_os_family == 'RedHat'"

- name: "Add rootflags=pquota to GRUB_CMDLINE_LINUX (Debian family)"
  tags: ["install"]
  # Negative-lookahead regex so the replace is a no-op if `rootflags=pquota`
  # is already in the line — idempotent across re-runs.
  ansible.builtin.replace:
    path: "/etc/default/grub"
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!.*rootflags=pquota)(.*)"$'
    replace: '\1\2 rootflags=pquota"'
    backup: true
  register: "k3s_grub_cmdline"
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "k3s_root_is_xfs | default(false) | bool"
    - "not (k3s_root_has_prjquota | default(false) | bool)"
    - "ansible_os_family == 'Debian'"

- name: "Refresh GRUB config (Debian family)"
  tags: ["install"]
  ansible.builtin.command:
    argv: ["update-grub"]
  changed_when: true  # only runs when GRUB_CMDLINE_LINUX was just rewritten above
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "ansible_os_family == 'Debian'"
    - "(k3s_grub_cmdline | default({})) is changed"

- name: "Reboot to apply rootflags=pquota"
  tags: ["install"]
  ansible.builtin.reboot:
    reboot_timeout: 600
    msg: "Rebooting to apply XFS rootflags=pquota for kubelet/Longhorn quotas"
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "k3s_root_is_xfs | default(false) | bool"
    - "not (k3s_root_has_prjquota | default(false) | bool)"
    - "machine_reboot_enabled | default(true) | bool"

- name: "Re-detect root mount options after potential reboot"
  tags: ["install"]
  ansible.builtin.command:
    argv: ["findmnt", "-no", "OPTIONS", "/"]
  register: "k3s_root_opts_after"
  changed_when: false
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "k3s_root_is_xfs | default(false) | bool"

- name: "Assert XFS prjquota is active on /"
  tags: ["install"]
  ansible.builtin.assert:
    that: "'prjquota' in (k3s_root_opts_after.stdout | default(''))"
    fail_msg: >-
      Root XFS filesystem is missing the `prjquota` mount option even
      after adding `rootflags=pquota` to GRUB. Either the host wasn't
      rebooted (machine_reboot_enabled is false — reboot manually and
      re-run) or the bootloader config didn't pick up the new cmdline
      (inspect `grubby --info=ALL` / `/proc/cmdline`).
  when:
    - "k3s_xfs_prjquota_enabled | default(true) | bool"
    - "ansible_virtualization_type | default('') != 'docker'"
    - "k3s_root_is_xfs | default(false) | bool"
    - "machine_reboot_enabled | default(true) | bool"
