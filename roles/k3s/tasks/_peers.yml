- name: "Resolve cluster peers (hosts in k3s_server with same k3s_cluster_name)"
  tags: ["always"]
  ansible.builtin.set_fact:
    k3s_cluster_peers: >-
      {{ groups['k3s_server']
         | map('extract', hostvars)
         | selectattr('k3s_cluster_name', 'defined')
         | selectattr('k3s_cluster_name', 'equalto', k3s_cluster_name)
         | map(attribute='inventory_hostname')
         | list }}

- name: "Resolve k3s primary (first peer in this cluster)"
  tags: ["always"]
  ansible.builtin.set_fact:
    k3s_is_primary: "{{ inventory_hostname == k3s_cluster_peers[0] }}"
    k3s_primary_url: "https://{{ hostvars[k3s_cluster_peers[0]].ansible_host }}:6443"
