- ansible.builtin.import_tasks: "_peers.yml"

- name: "Close the node to the scheduler"
  tags: ["drain"]
  ansible.builtin.command: "k3s kubectl cordon {{ k3s_node_name }}"
  delegate_to: "{{ k3s_cluster_peers[0] }}"
  become: true
  changed_when: true

- name: "Move the pods off the node"
  tags: ["drain"]
  ansible.builtin.command: >-
    k3s kubectl drain {{ k3s_node_name }}
    {{ k3s_drain_args | join(' ') }} --timeout={{ k3s_drain_timeout }}
  delegate_to: "{{ k3s_cluster_peers[0] }}"
  become: true
  changed_when: true
