- name: "Check whether headscale runs here"
  community.docker.docker_container_info:
    name: "headscale"
  register: "_failover_container"
  check_mode: false

- name: "Hand over"
  when: "_failover_container.container.State.Running | default(false)"
  vars:
    _to: "{{ hostvars[headscale_failover_to] }}"
  block:
    - name: "Request the switch"
      ansible.builtin.command:
        argv:
          - "/usr/local/sbin/etcdctl-local"
          - "put"
          - "{{ headscale_failover_prefix }}/desired"
          - "{{ {'name': _to.headscale_failover_name, 'at': now(fmt='%s') | int} | to_json }}"
      changed_when: true

    - name: "Wait for the other server to serve"
      community.docker.docker_container_info:
        name: "headscale"
      delegate_to: "{{ headscale_failover_to }}"
      register: "_failover_target"
      until: "_failover_target.container.State.Running | default(false)"
      retries: 30
      delay: 2

    - name: "Wait for the target panel to be ready"
      community.docker.docker_container_info:
        name: "headplane"
      delegate_to: "{{ headscale_failover_to }}"
      register: "_failover_panel"
      until: >-
        (_failover_panel.container.State.Running | default(false))
        and (_failover_panel.container.State.Health.Status | default('healthy')) == 'healthy'
      retries: 60
      delay: 2
      when: "headscale_failover_headplane_dir | length > 0"

    - name: "Wait for the server name to follow"
      ansible.builtin.command:
        argv: ["getent", "ahosts", "{{ headscale_failover_server_name }}"]
      delegate_to: "{{ item }}"
      loop: ["{{ inventory_hostname }}", "{{ headscale_failover_to }}"]
      register: "_failover_dns"
      until: >-
        (_failover_dns.stdout_lines | map('split') | map('first') | list | first)
        == _to.headscale_failover_self_ip
      retries: 60
      delay: 5
      changed_when: false
