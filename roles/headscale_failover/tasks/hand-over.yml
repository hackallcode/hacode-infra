- name: "Check whether headscale runs here"
  ansible.builtin.command:
    argv: ["docker", "ps", "-q", "--filter", "name=^headscale$", "--filter", "status=running"]
  register: "_failover_running"
  changed_when: false
  check_mode: false

- name: "Hand over"
  when: "_failover_running.stdout | length > 0"
  vars:
    _to: "{{ hostvars[headscale_failover_to] }}"
  block:
    - name: "Request the switch"
      ansible.builtin.command:
        argv:
          - "/usr/local/sbin/etcdctl-local"
          - "put"
          - "{{ headscale_failover_prefix }}/desired"
          - "{{ {'name': _to.headscale_failover_name, 'at': now(fmt='%s') | int} | to_json }}"
      changed_when: true

    - name: "Wait for the other server to serve"
      ansible.builtin.command:
        argv: ["docker", "ps", "-q", "--filter", "name=^headscale$", "--filter", "status=running"]
      delegate_to: "{{ headscale_failover_to }}"
      register: "_failover_target"
      until: "_failover_target.stdout | length > 0"
      retries: 30
      delay: 2
      changed_when: false

    - name: "Wait for the server name to follow"
      ansible.builtin.command:
        argv: ["getent", "ahosts", "{{ headscale_failover_server_name }}"]
      delegate_to: "{{ item }}"
      loop: ["{{ inventory_hostname }}", "{{ headscale_failover_to }}"]
      register: "_failover_dns"
      until: >-
        (_failover_dns.stdout_lines | map('split') | map('first') | list | first)
        == _to.headscale_failover_self_ip
      retries: 60
      delay: 5
      changed_when: false
