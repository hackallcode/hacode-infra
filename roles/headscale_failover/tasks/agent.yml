- name: "Install the agent"
  ansible.builtin.copy:
    src: "headscale-failover.py"
    dest: "/usr/local/bin/headscale-failover"
    owner: "root"
    group: "root"
    mode: "0755"
  notify: "Restart headscale-failover"

- name: "Create agent dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0700"
  loop: ["{{ headscale_failover_dir }}", "{{ headscale_failover_state_dir }}"]

- name: "Write agent secrets"
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ headscale_failover_dir }}/{{ item.file }}"
    owner: "root"
    group: "root"
    mode: "0600"
  loop:
    - {file: "token", value: "{{ headscale_failover_cloudflare_token }}"}
    - {file: "api_token", value: "{{ headscale_failover_api_token }}"}
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  notify: "Restart headscale-failover"

- name: "Write the agent config"
  ansible.builtin.template:
    src: "config.json.j2"
    dest: "{{ headscale_failover_dir }}/config.json"
    owner: "root"
    group: "root"
    mode: "0600"
  notify: "Restart headscale-failover"

- name: "Install the agent unit"
  ansible.builtin.template:
    src: "headscale-failover.service.j2"
    dest: "/etc/systemd/system/headscale-failover.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart headscale-failover"

- name: "Enable the agent"
  ansible.builtin.systemd:
    name: "headscale-failover.service"
    enabled: true
    state: "started"
    daemon_reload: true
  when: "not ansible_check_mode"
