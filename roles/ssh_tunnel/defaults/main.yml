# List of SSH tunnels to manage as systemd units. Each entry produces a
# `<name>.service` running `ssh -N` with the requested port forwards. At
# least one forward should be given for the tunnel to do anything useful.
#
# Entry schema:
#   - name:          systemd unit base name (no `.service` suffix)
#     remote_user:   user on the remote host
#     remote_host:   destination (hostname or IP)
#     user:          local account the unit runs ssh as, optional ("root" by
#                    default). Its home holds `.ssh/known_hosts`; a non-root
#                    user must already exist (it is looked up, not created)
#     identity_file: private key ssh uses, optional: an absolute path or one
#                    relative to the user's home (".ssh/id_ed25519"). Adds
#                    `IdentitiesOnly=yes`. Omitted -> ssh's own default keys
#     forward_port:  shorthand for a SOCKS proxy on 0.0.0.0:<port> (-D), optional
#     reverse_port:  shorthand for a SOCKS proxy on the remote's 0.0.0.0:<port>
#                    (-R <port> without a target), optional
#     forwards:      explicit forwards, optional ([] by default). Each item:
#       type:          "local" (-L), "remote" (-R) or "dynamic" (-D)
#       bind_address:  address the listening side binds, optional. Omitted
#                      -> ssh's own default: loopback, and for "remote" the
#                      server's `GatewayPorts` decides. IPv6 in brackets.
#       bind_port:     port the listening side binds
#       host, port:    where connections are sent. Required for "local";
#                      optional pair for "remote" (omitted -> a SOCKS proxy on
#                      the remote); not allowed for "dynamic".
#
# Reach for `forwards` in new entries: it says the same thing as either
# shorthand and more (`forward_port: N` is `{type: dynamic, bind_address:
# "0.0.0.0", bind_port: N}`). The shorthands stay for the units already
# deployed — they keep their historical 0.0.0.0 bind and render before
# `forwards`, so an existing entry produces the same unit as before and
# its tunnel is not restarted.
ssh_tunnels: []
