galaxy_info:
  role_name: "ssh_tunnel"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Manage persistent SSH tunnels as systemd units. Each entry in
    `ssh_tunnels` becomes a `<name>.service` unit running
    `ssh -N [-D forward_port] [-R reverse_port] <user>@<host>` under
    root, restarted on failure.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "networking"
    - "ssh"
    - "tunnel"
    - "systemd"

dependencies: []
