- name: "Validate tunnel entries (name has no shell-meta / path-traversal)"
  ansible.builtin.assert:
    that:
      - "tunnel.name is match('^[A-Za-z0-9_.-]+$')"
      - "tunnel.remote_user is defined and (tunnel.remote_user | string | length > 0)"
      - "tunnel.remote_host is defined and (tunnel.remote_host | string | length > 0)"
      - >-
        (tunnel.forward_port is not defined)
        or ((tunnel.forward_port | int) >= 1 and (tunnel.forward_port | int) <= 65535)
      - >-
        (tunnel.reverse_port is not defined)
        or ((tunnel.reverse_port | int) >= 1 and (tunnel.reverse_port | int) <= 65535)
      - "tunnel.forwards is not defined or (tunnel.forwards is sequence and tunnel.forwards is not string)"
    fail_msg: >-
      Invalid ssh_tunnels entry {{ tunnel }}. `name` must match [A-Za-z0-9_.-]+,
      `remote_user`/`remote_host` must be non-empty, ports (if set) must be
      1..65535, `forwards` (if set) must be a list.
  loop: "{{ ssh_tunnels }}"
  loop_control:
    loop_var: "tunnel"
    label: "{{ tunnel.name | default('(unnamed)') }}"

# Every value lands unquoted on the unit's ExecStart line, so addresses are
# held to a hostname / IPv4 / bracketed-IPv6 / `*` alphabet.
- name: "Validate explicit forwards"
  ansible.builtin.assert:
    that:
      - "fwd.type is defined and fwd.type in ['local', 'remote', 'dynamic']"
      - "(fwd.bind_port | default(0) | int) >= 1 and (fwd.bind_port | int) <= 65535"
      - >-
        fwd.bind_address is not defined
        or (fwd.bind_address | string) is match('^([A-Za-z0-9_.-]+|\\[[0-9A-Fa-f:.]+\\]|\\*)$')
      - "(fwd.host is defined) == (fwd.port is defined)"
      - "fwd.type != 'local' or fwd.host is defined"
      - "fwd.type != 'dynamic' or fwd.host is not defined"
      - >-
        fwd.host is not defined
        or (fwd.host | string) is match('^([A-Za-z0-9_.-]+|\\[[0-9A-Fa-f:.]+\\])$')
      - "fwd.port is not defined or ((fwd.port | int) >= 1 and (fwd.port | int) <= 65535)"
    fail_msg: >-
      Invalid forward {{ fwd }} in tunnel {{ item.0.name }}. `type` is
      local|remote|dynamic, `bind_port` and `port` are 1..65535, `host` and
      `port` come together (required for local, not allowed for dynamic),
      addresses are a hostname, an IPv4, a bracketed IPv6 or `*` (bind only).
    quiet: true
  loop: "{{ ssh_tunnels | subelements('forwards', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.type | default('?') }} {{ item.1.bind_port | default('?') }}"
  vars:
    fwd: "{{ item.1 }}"

# StrictHostKeyChecking=accept-new (TOFU) — host keys aren't known at
# deploy time. First connect vulnerable to MITM; pre-seed known_hosts
# manually if that's not acceptable.

- name: "Generate ssh-tunnel services"
  ansible.builtin.template:
    src: "ssh-tunnel.service.j2"
    dest: "/etc/systemd/system/{{ tunnel.name }}.service"
    owner: "root"
    group: "root"
    mode: "0644"
  register: "ssh_tunnel_units"
  loop: "{{ ssh_tunnels }}"
  loop_control:
    loop_var: "tunnel"
    label: "{{ tunnel.name }}"
  notify: "Reload systemd"

- name: "Flush handlers to apply systemd reload before (re)starting units"
  ansible.builtin.meta: "flush_handlers"

- name: "Enable and (re)start ssh-tunnel services"
  ansible.builtin.systemd:
    name: "{{ item.tunnel.name }}"
    enabled: true
    state: "{{ 'restarted' if (item.changed or (force | default(false) | bool)) else 'started' }}"
  loop: "{{ ssh_tunnel_units.results }}"
  loop_control:
    label: "{{ item.tunnel.name }}"
  # In check mode a new unit was never written, so systemd can't find it;
  # the (re)start is implied by the template change reported above.
  when: "not (ansible_check_mode and item.changed)"
