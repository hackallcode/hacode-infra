# A Worker that relays calls to one upstream, served on a hostname of a Cloudflare zone, for hosts that reach
# Cloudflare but not the upstream. The tasks call the Cloudflare API only, so run the role on the controller.

# Cloudflare API token: Workers Scripts:Edit on the account (the legacy permission; Workers:Editor alone cannot
# upload) and Workers Routes:Edit on the zone of cloudflare_worker_hostname.
cloudflare_worker_token: ""
cloudflare_worker_account_id: ""
cloudflare_worker_zone_id: ""

# Name in cloudflare_worker_zone_id the Worker answers on; Cloudflare creates its DNS record and certificate.
cloudflare_worker_hostname: ""
cloudflare_worker_name: ""

# What the Worker relays; a path outside it gets 404, so the Worker is no open proxy:
#   relay    -> paths under cloudflare_worker_paths to cloudflare_worker_upstream
#   telegram -> the Bot API calls and file downloads of cloudflare_worker_telegram_bot_ids to api.telegram.org
cloudflare_worker_mode: "relay"

# relay: the upstream origin, scheme and host without a path, and the path prefixes passed to it ("/" for all).
cloudflare_worker_upstream: ""
cloudflare_worker_paths: []

# telegram: numeric bot ids, the part of a token before `:`.
cloudflare_worker_telegram_bot_ids: []

cloudflare_worker_compatibility_date: "2026-11-01"
