# Major Node.js version installed via NodeSource (e.g. "20", "22").
node_js_version: "12"

# Build command run inside the build container against the project's
# synced sources.
node_js_build_command: ["npm", "run", "build"]

# Host-side npm cache mounted into the build container as /root/.npm so
# `npm ci` reuses downloaded tarballs across runs.
node_js_npm_cache_dir: "/var/cache/npm-build"

# Persistent node_modules dir per project, mounted at
# /usr/src/app/node_modules. Lets the build skip `npm ci` when
# package-lock.json hasn't changed since the last install (tracked via a
# sha256 stamp).
node_js_node_modules_dir: "/var/cache/npm-build/{{ app_project }}-node-modules"
