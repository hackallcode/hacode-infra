- tags: ["app-configure"]
  when: "app_domains | length > 0"
  block:
    - name: "Gather os_family for nginx user/group resolution"
      ansible.builtin.setup:
        filter: ["ansible_os_family"]
      when: "ansible_os_family is not defined"

    - name: "Load OS-family vars (nginx_user/nginx_group)"
      ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

    - name: "Create a directory for nginx logs (outside app_content_dir to avoid HTTP exposure + sync delete)"
      ansible.builtin.file:
        path: "/var/log/{{ app_project }}/nginx"
        state: "directory"
        recurse: true
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "u=rwX,g=rX,o="

    - name: "Add a user to a password file"
      community.general.htpasswd:
        path: "/etc/nginx/conf.d/{{ app_domains[0] }}.users"
        name: "{{ item[0] }}"
        password: "{{ item[1] }}"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "u=rw,g=r,o="
      loop: "{{ basic_users.items() }}"
      loop_control:
        label: "/etc/nginx/conf.d/{{ app_domains[0] }}.users - {{ item[0] }}"
      register: "users_config"

    - name: "Upload config"
      ansible.builtin.copy:
        src: "../configs/nginx/{{ hostname }}/{{ app_domains[0] }}.conf"
        dest: "/etc/nginx/conf.d/"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: "u=rw,g=r,o="
      register: "nginx_config"

    - name: "Reload nginx if config changed"
      ansible.builtin.include_tasks:
        file: "reload.yml"
        apply:
          tags: ["app-configure"]
      when: "users_config is changed or nginx_config is changed or (force | default(false) | bool)"
