galaxy_info:
  role_name: "nginx"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Install nginx and render per-app vhost configs with optional
    Let's Encrypt, PHP-FPM, redirects, basic auth and static aliases.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "nginx"
    - "web"
    - "tls"
    - "https"

dependencies:
  - role: "hacode.infra.common"
