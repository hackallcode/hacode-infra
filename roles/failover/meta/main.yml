galaxy_info:
  role_name: "failover"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: "Run the failover agent: one leader per service over NATS JetStream, SQLite replicated as snapshots in NATS KV."
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bookworm", "trixie"]
  galaxy_tags:
    - "failover"
    - "nats"

dependencies:
  - role: "hacode.infra.common"
