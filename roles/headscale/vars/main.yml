_headscale_config:
  server_url: "{{ headscale_server_url }}"
  listen_addr: "{{ headscale_listen_addr }}"
  metrics_listen_addr: "{{ headscale_metrics_listen_addr }}"
  grpc_listen_addr: "127.0.0.1:50443"
  grpc_allow_insecure: false
  noise:
    private_key_path: >-
      {{ '/etc/headscale/noise_private.key' if headscale_noise_private_key
         else '/var/lib/headscale/noise_private.key' }}
  prefixes:
    v4: "100.64.0.0/10"
    v6: "fd7a:115c:a1e0::/48"
    allocation: "sequential"
  derp:
    server:
      enabled: "{{ headscale_derp_server_enabled | bool }}"
      region_code: "{{ headscale_derp_region_code }}"
      region_name: "{{ headscale_derp_region_name }}"
      verify_clients: true
      stun_listen_addr: "0.0.0.0:{{ headscale_derp_stun_port }}"
      private_key_path: "/var/lib/headscale/derp_server_private.key"
      automatically_add_embedded_derp_region: true
    urls: "{{ headscale_derp_urls }}"
    paths: "{{ ['/etc/headscale/derp.yml'] if headscale_derp_regions else [] }}"
    auto_update_enabled: false
  disable_check_updates: true
  node:
    expiry: 0
  database:
    type: "sqlite"
    sqlite:
      path: "/var/lib/headscale/db.sqlite"
      write_ahead_log: true
      wal_autocheckpoint: 1000
  tls_cert_path: ""
  tls_key_path: ""
  log:
    level: "info"
    format: "text"
  policy:
    mode: "{{ 'database' if headscale_initial_policy else 'file' }}"
    path: "{{ '/etc/headscale/policy.json' if headscale_policy else '' }}"
  dns:
    magic_dns: "{{ headscale_base_domain | length > 0 }}"
    base_domain: "{{ headscale_base_domain }}"
    override_local_dns: false
    nameservers:
      global: []
      split: {}
    search_domains: []
    extra_records: []
  unix_socket: "/var/run/headscale/headscale.sock"
  unix_socket_permission: "0770"
  logtail:
    enabled: false
  taildrop:
    enabled: true

_headscale_exec: "docker exec headscale headscale"
