# The archive holds the keys, not their dir: create it 0700 first.
- name: "Create a directory for WireGuard keys"
  tags: ["restore"]
  ansible.builtin.file:
    path: "/etc/wireguard/keys"
    state: "directory"
    mode: "0700"

- name: "Restore WireGuard keys"
  tags: ["restore"]
  ansible.builtin.include_role:
    name: "hacode.infra.common"
    tasks_from: "restore"
    apply:
      tags: ["restore"]
  vars:
    hacode_backup_paths: ["/etc/wireguard/keys"]
    hacode_backup_name: "{{ inventory_hostname }}"
    hacode_backup_local_dir: "{{ wg_backup_local_dir }}"
