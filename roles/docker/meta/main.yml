galaxy_info:
  role_name: "docker"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Install Docker Engine, CLI, containerd and compose plugin on
    Debian/Ubuntu/RHEL hosts; configure kernel modules and sysctls.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Ubuntu"
      versions: ["jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "docker"
    - "containers"
    - "compose"

dependencies: []
