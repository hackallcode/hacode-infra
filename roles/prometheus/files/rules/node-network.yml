      - alert: "NodeHighNumberConntrackEntriesUsed"
        expr: "(node_nf_conntrack_entries / node_nf_conntrack_entries_limit) > 0.75"
        labels:
          severity: "warning"
          category: "network"
        annotations:
          summary: 'The conntrack table is getting full.'
          description: '{{ $labels.instance_name }} uses {{ $value | humanizePercentage }} of its conntrack entries.'
