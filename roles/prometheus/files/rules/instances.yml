groups:
  - name: "instances"
    rules:
      - alert: "InstanceDown"
        # A headscale_failover standby keeps headscale stopped, so its scrape target is down by design.
        expr: 'up == 0 unless on(job, instance_name) (up{job="headscale"} and on(instance_name) headscale_failover_serving == 0)'
        for: "1m"
        labels:
          severity: "critical"
        annotations:
          summary: 'Instance {{ $labels.instance_name }} down'
          description: '{{ $labels.instance_name }} of job {{ $labels.job }} has been down for more than 1 minute.'
