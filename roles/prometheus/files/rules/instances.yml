groups:
  - name: "instances"
    rules:
      - alert: "InstanceDown"
        # A failover standby keeps headscale stopped, so its scrape target is down by design.
        expr: 'up == 0 unless on(job, instance_name) (up{job="headscale"} and on(instance_name) failover_leader{service="headscale"} == 0)'
        for: "1m"
        labels:
          severity: "critical"
          category: "host"
        annotations:
          summary: "Instance down."
          description: "{{ $labels.job }} on {{ $labels.instance_name }} does not answer."
