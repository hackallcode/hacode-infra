groups:
  - name: "nats"
    rules:
      - alert: "NatsDown"
        expr: "nats_up == 0"
        for: "1m"
        labels:
          severity: "critical"
          category: "services"
        annotations:
          summary: "A NATS server is down or has no JetStream."
          description: "NATS on {{ $labels.instance_name }} is down or has no JetStream: see `journalctl -u nats` there."

      - alert: "NatsRouteMissing"
        expr: "nats_routes < nats_routes_expected"
        for: "2m"
        keep_firing_for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS server lost a route to a peer."
          description: >-
            NATS on {{ $labels.instance_name }} has routes to {{ $value }} of its
            {{ with printf `nats_routes_expected{instance_name="%s"}` $labels.instance_name | query }}{{ . | first | value }}{{ end }}
            peers: with none left it drops out of the cluster.

      - alert: "NatsJetStreamBehind"
        expr: "nats_jetstream_current == 0"
        for: "2m"
        keep_firing_for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS server is out of sync with the JetStream cluster."
          description: >-
            NATS on {{ $labels.instance_name }} does not reach the JetStream cluster leader or lags it: see
            `/healthz?details=true` on its monitoring port.

      - alert: "NatsStreamBehind"
        expr: "nats_stream_current == 0"
        for: "5m"
        keep_firing_for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS stream copy is behind."
          description: >-
            The {{ $labels.stream }} copy on {{ $labels.instance_name }} has no leader or lags it: writes made
            elsewhere have not reached it.

      - alert: "NatsStreamFilling"
        expr: "nats_stream_bytes / nats_stream_max_bytes > 0.8"
        for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS stream nears its size limit."
          description: "{{ $labels.stream }} on {{ $labels.instance_name }} is {{ $value | humanizePercentage }} full: at the limit its writes fail."

      - alert: "NatsMetricsStale"
        expr: "time() - nats_metrics_timestamp_seconds > 120"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "NATS metrics stopped."
          description: "NATS metrics on {{ $labels.instance_name }} are {{ $value | humanizeDuration }} old: see `systemctl status nats-metrics.timer` there."
