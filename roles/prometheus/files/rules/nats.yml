groups:
  - name: "nats"
    rules:
      - alert: "NatsDown"
        expr: "nats_up == 0"
        for: "1m"
        labels:
          severity: "critical"
          category: "services"
        annotations:
          summary: "A NATS server is down or has no JetStream."
          description: "NATS on {{ $labels.instance_name }} is down or has no JetStream: see `journalctl -u nats` there."

      - alert: "NatsRouteMissing"
        expr: "nats_routes < nats_routes_expected"
        for: "2m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS server lost a route to a peer."
          description: "NATS on {{ $labels.instance_name }} reaches {{ $value }} of its peers: one more lost and JetStream has no quorum."

      - alert: "NatsPeerBehind"
        expr: "nats_jetstream_peer_current == 0"
        for: "2m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS server is not current with the cluster."
          description: "NATS meta leader {{ $labels.instance_name }} sees {{ $labels.peer }} offline or behind."

      - alert: "NatsStreamReplicaBehind"
        expr: "nats_stream_replica_current == 0"
        for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS stream replica is behind."
          description: "The {{ $labels.stream }} replica on {{ $labels.peer }} is offline or behind its leader {{ $labels.instance_name }}."

      - alert: "NatsStreamFilling"
        expr: "nats_stream_bytes / nats_stream_max_bytes > 0.8"
        for: "5m"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A NATS stream nears its size limit."
          description: "{{ $labels.stream }} on {{ $labels.instance_name }} is {{ $value | humanizePercentage }} full: at the limit its writes fail."

      - alert: "NatsMetricsStale"
        expr: "time() - nats_metrics_timestamp_seconds > 120"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "NATS metrics stopped."
          description: "NATS metrics on {{ $labels.instance_name }} are {{ $value | humanizeDuration }} old: see `systemctl status nats-metrics.timer` there."
