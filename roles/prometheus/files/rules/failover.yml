groups:
  - name: "failover"
    rules:
      # Per agent: a Prometheus may scrape only some of the nodes, and the leader's own metrics may be missing.
      - alert: "FailoverNoLeader"
        expr: "failover_has_leader == 0"
        for: "2m"
        labels:
          severity: "critical"
          category: "services"
        annotations:
          summary: "No node holds a failover service's lease."
          description: "The {{ $labels.service }} failover agent on {{ $labels.instance_name }} sees no leader: see the agents' journals and `failover state`."

      - alert: "FailoverLeaderChanged"
        expr: "failover_leader == 1 and changes(failover_leader[5m]) > 0"
        labels:
          severity: "info"
          category: "services"
        annotations:
          summary: "Failover leadership moved."
          description: "{{ $labels.service }} moved to {{ $labels.instance_name }}."

      - alert: "FailoverError"
        expr: "min_over_time(failover_error[5m]) > 0"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A failover agent keeps failing."
          description: "The {{ $labels.service }} failover agent on {{ $labels.instance_name }} keeps failing; see its journal."

      - alert: "FailoverStale"
        expr: "time() - failover_last_tick_timestamp_seconds > 120"
        labels:
          severity: "warning"
          category: "services"
        annotations:
          summary: "A failover agent stopped running."
          description: "The {{ $labels.service }} failover agent on {{ $labels.instance_name }} has not run for {{ $value | humanizeDuration }}."
