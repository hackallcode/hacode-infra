rule_files:
  - ../instances.yml

evaluation_interval: 30s

tests:
  # up == 0 в течение 1 мин и больше → срабатывает InstanceDown
  - interval: 30s
    input_series:
      - series: 'up{job="node",instance_name="testhost"}'
        values: "0x20"
      - series: 'up{job="node",instance_name="other"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "Instance down."
              description: "node on testhost does not answer."
      - eval_time: 2m
        alertname: PrometheusIsolated
        exp_alerts: []

  # up == 1 → не срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="node",instance_name="testhost"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts: []

  # headscale на резервном сервере остановлен → не срабатывает, node того же сервера → срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="headscale",instance_name="standby"}'
        values: "0x20"
      - series: 'up{job="node",instance_name="standby"}'
        values: "0x20"
      - series: 'failover_leader{job="node",instance_name="standby",service="headscale"}'
        values: "0x20"
      - series: 'up{job="node",instance_name="other"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: node
              instance_name: standby
            exp_annotations:
              summary: "Instance down."
              description: "node on standby does not answer."

  # headscale остановлен на обслуживающем сервере → срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="headscale",instance_name="leader"}'
        values: "0x20"
      - series: 'failover_leader{job="node",instance_name="leader",service="headscale"}'
        values: "1x20"
      - series: 'up{job="node",instance_name="leader"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: headscale
              instance_name: leader
            exp_annotations:
              summary: "Instance down."
              description: "headscale on leader does not answer."

  # ни один наблюдаемый хост не отвечает → один PrometheusIsolated вместо InstanceDown по каждому
  - interval: 30s
    external_labels:
      environment: "observer"
    input_series:
      - series: 'up{job="node",instance_name="a"}'
        values: "0x20"
      - series: 'up{job="tailscale",instance_name="a"}'
        values: "0x20"
      - series: 'up{job="node",instance_name="b"}'
        values: "0x20"
      - series: 'up{job="prometheus"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts: []
      - eval_time: 2m
        alertname: PrometheusIsolated
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
            exp_annotations:
              summary: "Prometheus reaches none of the hosts it watches."
              description: >-
                observer reaches none of the hosts it watches: it is cut off itself, or they are all down. Its
                alerts about them and its probes are held back.

  # хост на канале с потерями то отвечает, то нет → один InstanceDown, гаснет через 5 мин без сбоев
  - interval: 30s
    input_series:
      - series: 'up{job="tailscale",instance_name="flaky"}'
        values: "0x3 1 0 1 0 0 1 0 1x30"
      - series: 'up{job="node",instance_name="other"}'
        values: "1x45"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: tailscale
              instance_name: flaky
            exp_annotations:
              summary: "Instance down."
              description: "tailscale on flaky does not answer."
      - eval_time: 9m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: tailscale
              instance_name: flaky
            exp_annotations:
              summary: "Instance down."
              description: "tailscale on flaky does not answer."
      - eval_time: 11m
        alertname: InstanceDown
        exp_alerts: []

  # хост снова отвечает → InstanceDown по остальным возвращается, PrometheusIsolated гаснет
  - interval: 30s
    input_series:
      - series: 'up{job="node",instance_name="a"}'
        values: "0x4 1x16"
      - series: 'up{job="node",instance_name="b"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 1m30s
        alertname: PrometheusIsolated
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
            exp_annotations:
              summary: "Prometheus reaches none of the hosts it watches."
              description: >-
                Prometheus reaches none of the hosts it watches: it is cut off itself, or they are all down. Its
                alerts about them and its probes are held back.
      - eval_time: 8m
        alertname: PrometheusIsolated
        exp_alerts: []
      - eval_time: 8m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: node
              instance_name: b
            exp_annotations:
              summary: "Instance down."
              description: "node on b does not answer."
