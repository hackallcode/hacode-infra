rule_files:
  - ../instances.yml

evaluation_interval: 30s

tests:
  # up == 0 в течение 1 мин и больше → срабатывает InstanceDown
  - interval: 30s
    input_series:
      - series: 'up{job="node",instance_name="testhost"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "Instance down."
              description: "node on testhost does not answer."

  # up == 1 → не срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="node",instance_name="testhost"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts: []

  # headscale на резервном сервере остановлен → не срабатывает, node того же сервера → срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="headscale",instance_name="standby"}'
        values: "0x20"
      - series: 'up{job="node",instance_name="standby"}'
        values: "0x20"
      - series: 'headscale_failover_serving{job="node",instance_name="standby"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: node
              instance_name: standby
            exp_annotations:
              summary: "Instance down."
              description: "node on standby does not answer."

  # headscale остановлен на обслуживающем сервере → срабатывает
  - interval: 30s
    input_series:
      - series: 'up{job="headscale",instance_name="leader"}'
        values: "0x20"
      - series: 'headscale_failover_serving{job="node",instance_name="leader"}'
        values: "1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: host
              job: headscale
              instance_name: leader
            exp_annotations:
              summary: "Instance down."
              description: "headscale on leader does not answer."
