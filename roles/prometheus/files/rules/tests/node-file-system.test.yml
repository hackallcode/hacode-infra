rule_files:
  - ../node-file-system.yml

evaluation_interval: 1m

tests:
  # 100GB диск, свободные байты падают с 40GB до 10GB за 6ч.
  # На момент 6ч10м: 10/100 = 10% свободно (< 40 и < 20 →
  # оба warning и critical срабатывают).
  # predict_linear отрицательный на 24ч и 4ч.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x400"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        # 40GB -> 10GB линейно за 360 минут (≈83886080 байт/мин)
        values: "42949672960-83886080x360 10737418240x40"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x400"

    alert_rule_test:
      - eval_time: 6h10m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 24 hours."
              description: "/ on testhost has 10% of its space free and fills up within a day."
          - exp_labels:
              severity: critical
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 4 hours."
              description: "/ on testhost has 10% of its space free and fills up within 4 hours."

  # Диск занят на 50% и стабилен → ни один FillingUp не срабатывает.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x400"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "53687091200x400"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x400"

    alert_rule_test:
      - eval_time: 6h10m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts: []

  # Стабильно 34% свободно, дважды по 25 минут занято ещё 30GB, потом место
  # вернулось. predict_linear за 6ч ещё отрицательный, но свободного места
  # больше среднего за 6ч → warning закрывается сразу после очистки.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x400"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "36507222016x289 4294967296x24 36507222016x24 4294967296x24 36507222016x40"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x400"

    alert_rule_test:
      - eval_time: 5h55m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem is predicted to run out of space within the next 24 hours."
              description: "/ on testhost has 4% of its space free and fills up within a day."
      - eval_time: 6h10m
        alertname: NodeFilesystemSpaceFillingUp
        exp_alerts: []

  # Стабильно 8% свободно (8GB из 100GB) → warning срабатывает, critical нет.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x20"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "8589934592x20"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 10m
        alertname: NodeFilesystemAlmostOutOfSpace
        exp_alerts:
          - exp_labels:
              severity: warning
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem has less than 10% space left."
              description: "/ on testhost has 8% of its space free."

  # Стабильно 3% свободно → срабатывают оба: warning и critical.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x20"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "3221225472x20"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 10m
        alertname: NodeFilesystemAlmostOutOfSpace
        exp_alerts:
          - exp_labels:
              severity: warning
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem has less than 10% space left."
              description: "/ on testhost has 3% of its space free."
          - exp_labels:
              severity: critical
              category: disk
              job: node
              fstype: ext4
              device: /dev/sda1
              mountpoint: /
              instance_name: testhost
            exp_annotations:
              summary: "Filesystem has less than 5% space left."
              description: "/ on testhost has 3% of its space free."

  # Стабильно 50% свободно → ни один AlmostOutOfSpace не срабатывает.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "107374182400x20"
      - series: 'node_filesystem_avail_bytes{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "53687091200x20"
      - series: 'node_filesystem_readonly{job="node",fstype="ext4",device="/dev/sda1",mountpoint="/",instance_name="testhost"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 10m
        alertname: NodeFilesystemAlmostOutOfSpace
        exp_alerts: []
