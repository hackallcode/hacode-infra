rule_files:
  - ../nats.yml

evaluation_interval: 1m

tests:
  # сервер не отвечает дольше минуты → NatsDown
  - interval: 1m
    input_series:
      - series: 'nats_up{job="node",instance_name="a"}'
        values: "1 0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: NatsDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: services
              job: node
              instance_name: a
            exp_annotations:
              summary: "A NATS server is down or has no JetStream."
              description: "NATS on a is down or has no JetStream: see `journalctl -u nats` there."

  # маршрутов меньше ожидаемого дольше 2 мин → NatsRouteMissing
  - interval: 1m
    input_series:
      - series: 'nats_routes{job="node",instance_name="a"}'
        values: "2 1x5"
      - series: 'nats_routes_expected{job="node",instance_name="a"}'
        values: "2x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: NatsRouteMissing
        exp_alerts: []
      - eval_time: 4m
        alertname: NatsRouteMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
            exp_annotations:
              summary: "A NATS server lost a route to a peer."
              description: "NATS on a has routes to 1 of its 2 peers: with none left it drops out of the cluster."

  # маршрут то пропадает, то возвращается → один NatsRouteMissing, гаснет через 5 мин без сбоев
  - interval: 1m
    input_series:
      - series: 'nats_routes{job="node",instance_name="a"}'
        values: "1 1 1 2 1 2 1 1 2x15"
      - series: 'nats_routes_expected{job="node",instance_name="a"}'
        values: "2x22"
    alert_rule_test:
      - eval_time: 5m
        alertname: NatsRouteMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
            exp_annotations:
              summary: "A NATS server lost a route to a peer."
              description: "NATS on a has routes to 1 of its 2 peers: with none left it drops out of the cluster."
      - eval_time: 14m
        alertname: NatsRouteMissing
        exp_alerts: []

  # сервер не видит лидера JetStream дольше 2 мин → NatsJetStreamBehind
  - interval: 1m
    input_series:
      - series: 'nats_jetstream_current{job="node",instance_name="a"}'
        values: "1 0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: NatsJetStreamBehind
        exp_alerts: []
      - eval_time: 4m
        alertname: NatsJetStreamBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
            exp_annotations:
              summary: "A NATS server is out of sync with the JetStream cluster."
              description: "NATS on a does not reach the JetStream cluster leader or lags it: see `/healthz?details=true` on its monitoring port."

  # копия потока отстаёт 5 мин → NatsStreamBehind по хосту с этой копией
  - interval: 1m
    input_series:
      - series: 'nats_stream_current{job="node",instance_name="a",stream="KV_x"}'
        values: "0x10"
      - series: 'nats_stream_current{job="node",instance_name="b",stream="KV_x"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: NatsStreamBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
              stream: KV_x
            exp_annotations:
              summary: "A NATS stream copy is behind."
              description: "The KV_x copy on a has no leader or lags it: writes made elsewhere have not reached it."

  # поток заполнен на 90% → NatsStreamFilling; поток без лимита - тишина
  - interval: 1m
    input_series:
      - series: 'nats_stream_bytes{job="node",instance_name="a",stream="OBJ_x"}'
        values: "90x10"
      - series: 'nats_stream_max_bytes{job="node",instance_name="a",stream="OBJ_x"}'
        values: "100x10"
      - series: 'nats_stream_bytes{job="node",instance_name="a",stream="KV_y"}'
        values: "1000x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: NatsStreamFilling
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
              stream: OBJ_x
            exp_annotations:
              summary: "A NATS stream nears its size limit."
              description: "OBJ_x on a is 90% full: at the limit its writes fail."

  # метрики не обновляются → NatsMetricsStale
  - interval: 1m
    input_series:
      - series: 'nats_metrics_timestamp_seconds{job="node",instance_name="a"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NatsMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: services
              job: node
              instance_name: a
            exp_annotations:
              summary: "NATS metrics stopped."
              description: "NATS metrics on a are 5m 0s old: see `systemctl status nats-metrics.timer` there."
