rule_files:
  - ../node-network.yml

evaluation_interval: 30s

tests:
  # conntrack 800/1000 = 80% > 75% → срабатывает
  - interval: 30s
    input_series:
      - series: 'node_nf_conntrack_entries{job="node",instance_name="testhost"}'
        values: "800x10"
      - series: 'node_nf_conntrack_entries_limit{job="node",instance_name="testhost"}'
        values: "1000x10"

    alert_rule_test:
      - eval_time: 2m
        alertname: NodeHighNumberConntrackEntriesUsed
        exp_alerts:
          - exp_labels:
              severity: warning
              category: network
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "The conntrack table is getting full."
              description: "testhost uses 80% of its conntrack entries."

  # conntrack 500/1000 = 50% → не срабатывает
  - interval: 30s
    input_series:
      - series: 'node_nf_conntrack_entries{job="node",instance_name="testhost"}'
        values: "500x10"
      - series: 'node_nf_conntrack_entries_limit{job="node",instance_name="testhost"}'
        values: "1000x10"

    alert_rule_test:
      - eval_time: 2m
        alertname: NodeHighNumberConntrackEntriesUsed
        exp_alerts: []
