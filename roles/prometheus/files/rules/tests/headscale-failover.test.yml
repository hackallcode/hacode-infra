rule_files:
  - ../headscale-failover.yml

evaluation_interval: 1m

tests:
  # etcd отвечает, но в очереди никого → HeadscaleNoLeader через минуту
  - interval: 1m
    input_series:
      - series: 'headscale_failover_etcd_ok{job="node",instance_name="testhost"}'
        values: "1x5"
      - series: 'headscale_failover_has_leader{job="node",instance_name="testhost"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: HeadscaleNoLeader
        exp_alerts: []
      - eval_time: 3m
        alertname: HeadscaleNoLeader
        exp_alerts:
          - exp_labels:
              severity: critical
              category: mesh
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "etcd has no headscale leader."
              description: "testhost sees no headscale leader in etcd: no candidate is queued."

  # без lease дольше минуты → HeadscaleLeaseLost
  - interval: 1m
    input_series:
      - series: 'headscale_failover_lease_ok{job="node",instance_name="testhost"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: HeadscaleLeaseLost
        exp_alerts:
          - exp_labels:
              severity: critical
              category: mesh
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "A server cannot hold its etcd lease."
              description: "testhost cannot hold its etcd lease: it is out of the quorum and stopped headscale."

  # leadership moves to testhost -> it fires there, quiet after 5 min; nothing for otherhost
  - interval: 1m
    input_series:
      - series: 'headscale_failover_leader{job="node",instance_name="testhost"}'
        values: "0 1x30"
      - series: 'headscale_failover_leader{job="node",instance_name="otherhost"}'
        values: "1 0x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: HeadscaleLeaderChanged
        exp_alerts:
          - exp_labels:
              severity: info
              category: mesh
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "headscale leadership moved."
              description: "headscale leadership moved to testhost."
      - eval_time: 10m
        alertname: HeadscaleLeaderChanged
        exp_alerts: []

  # агент перестал писать метрики → HeadscaleFailoverStale
  - interval: 1m
    input_series:
      - series: 'headscale_failover_last_tick_timestamp_seconds{job="node",instance_name="testhost"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: HeadscaleFailoverStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: mesh
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "The headscale failover agent stopped running."
              description: "The headscale failover agent on testhost has not run for 5m 0s."
