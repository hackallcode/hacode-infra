rule_files:
  - ../node-ram.yml

evaluation_interval: 30s

tests:
  # Доступно 50 MB при общем 8 GB → оба алерта должны сработать
  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance_name="testhost"}'
        values: "52428800x20"
      - series: 'node_memory_MemTotal_bytes{job="node",instance_name="testhost"}'
        values: "8589934592x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: LowRamMb
        exp_alerts:
          - exp_labels:
              severity: critical
              category: memory
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "Less than 100 MB of memory available."
              description: "testhost has 50 MB of its memory available, not counting swap."

      - eval_time: 2m
        alertname: LowRamPercent
        exp_alerts:
          - exp_labels:
              severity: critical
              category: memory
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "Less than 10% of memory available."
              description: "testhost has 1% of its memory available, not counting swap."

  # Доступно 4 GB из 8 GB → оба алерта молчат
  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance_name="testhost"}'
        values: "4294967296x20"
      - series: 'node_memory_MemTotal_bytes{job="node",instance_name="testhost"}'
        values: "8589934592x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: LowRamMb
        exp_alerts: []
      - eval_time: 2m
        alertname: LowRamPercent
        exp_alerts: []

  # OOM kill за последнюю минуту → срабатывает OomKillDetected
  - interval: 30s
    input_series:
      - series: 'node_vmstat_oom_kill{job="node",instance_name="testhost"}'
        values: "0+1x20"

    alert_rule_test:
      - eval_time: 2m
        alertname: OomKillDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              category: memory
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "OOM kill detected."
              description: "The OOM killer ran 2 times on testhost in the last minute."

  # Хост пропал после срабатывания → LowRamPercent держится ещё 3 минуты
  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance_name="testhost"}'
        values: "52428800x6 stale"
      - series: 'node_memory_MemTotal_bytes{job="node",instance_name="testhost"}'
        values: "8589934592x6 stale"

    alert_rule_test:
      - eval_time: 5m
        alertname: LowRamPercent
        exp_alerts:
          - exp_labels:
              severity: critical
              category: memory
              job: node
              instance_name: testhost
            exp_annotations:
              summary: "Less than 10% of memory available."
              description: "testhost has 1% of its memory available, not counting swap."
      - eval_time: 8m
        alertname: LowRamPercent
        exp_alerts: []
