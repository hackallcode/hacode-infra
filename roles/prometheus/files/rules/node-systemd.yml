groups:
  - name: "systemd"
    rules:
      - alert: "SystemdServiceCrashed"
        expr: 'node_systemd_unit_state{state="failed", name!="dnf-makecache.service"} == 1'
        labels:
          severity: "critical"
          category: "services"
        annotations:
          summary: 'A systemd service failed.'
          description: '{{ $labels.name }} failed on {{ $labels.instance_name }}.'
