groups:
  - name: "node_clock"
    rules:
      - alert: "NodeClockSkewDetected"
        expr: >-
          (node_timex_offset_seconds > 0.05 and deriv(node_timex_offset_seconds[5m]) >= 0)
          or
          (node_timex_offset_seconds < -0.05 and deriv(node_timex_offset_seconds[5m]) <= 0)
        for: "10m"
        labels:
          severity: "warning"
          category: "clock"
        annotations:
          summary: "Clock skew detected."
          description: "The clock on {{ $labels.instance_name }} is off by {{ printf \"%.3f\" $value }}s; check NTP."

      - alert: "NodeClockNotSynchronising"
        expr: "min_over_time(node_timex_sync_status[5m]) == 0"
        for: "10m"
        labels:
          severity: "warning"
          category: "clock"
        annotations:
          summary: "Clock not synchronising."
          description: "The clock on {{ $labels.instance_name }} is not synchronising; check NTP."
