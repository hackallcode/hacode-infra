groups:
  - name: "node_file_system_files"
    rules:
      - alert: "NodeFilesystemFilesFillingUp"
        expr: >-
          (
            node_filesystem_files_free{job="node",fstype!=""} / node_filesystem_files{job="node",fstype!=""} * 100 < 40
            and
            predict_linear(node_filesystem_files_free{job="node",fstype!=""}[6h], 24*60*60) < 0
            and
            node_filesystem_readonly{job="node",fstype!=""} == 0
          )
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: 'Filesystem is predicted to run out of inodes within the next 24 hours.'
          description: 'Filesystem on {{ $labels.device }} at {{ $labels.instance_name }} has only {{ printf "%.2f" $value }}% available inodes left and is filling up.'

      - alert: "NodeFilesystemFilesFillingUp"
        expr: >-
          (
            node_filesystem_files_free{job="node",fstype!=""} / node_filesystem_files{job="node",fstype!=""} * 100 < 20
            and
            predict_linear(node_filesystem_files_free{job="node",fstype!=""}[6h], 4*60*60) < 0
            and
            node_filesystem_readonly{job="node",fstype!=""} == 0
          )
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: 'Filesystem is predicted to run out of inodes within the next 4 hours.'
          description: 'Filesystem on {{ $labels.device }} at {{ $labels.instance_name }} has only {{ printf "%.2f" $value }}% available inodes left and is filling up fast.'

      - alert: "NodeFilesystemAlmostOutOfFiles"
        expr: >-
          node_filesystem_files_free{job="node",fstype!=""} / node_filesystem_files{job="node",fstype!=""} * 100 < 10
          and node_filesystem_readonly{job="node",fstype!=""} == 0
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: 'Filesystem has less than 10% inodes left.'
          description: 'Filesystem on {{ $labels.device }} at {{ $labels.instance_name }} has only {{ printf "%.2f" $value }}% available inodes left.'

      - alert: "NodeFilesystemAlmostOutOfFiles"
        expr: >-
          node_filesystem_files_free{job="node",fstype!=""} / node_filesystem_files{job="node",fstype!=""} * 100 < 5
          and node_filesystem_readonly{job="node",fstype!=""} == 0
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: 'Filesystem has less than 5% inodes left.'
          description: 'Filesystem on {{ $labels.device }} at {{ $labels.instance_name }} has only {{ printf "%.2f" $value }}% available inodes left.'
