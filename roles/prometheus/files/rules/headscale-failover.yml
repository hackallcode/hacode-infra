groups:
  - name: "headscale_failover"
    rules:
      - alert: "HeadscaleNoLeader"
        expr: "headscale_failover_etcd_ok == 1 and headscale_failover_has_leader == 0"
        for: "1m"
        labels:
          severity: "critical"
          category: "mesh"
        annotations:
          summary: "etcd has no headscale leader."
          description: "{{ $labels.instance_name }} sees no headscale leader in etcd: no candidate is queued."

      - alert: "HeadscaleLeaseLost"
        expr: "headscale_failover_lease_ok == 0"
        for: "1m"
        labels:
          severity: "critical"
          category: "mesh"
        annotations:
          summary: "A server cannot hold its etcd lease."
          description: "{{ $labels.instance_name }} cannot hold its etcd lease: it is out of the quorum and stopped headscale."

      - alert: "HeadscaleLeaderChanged"
        expr: "headscale_failover_leader == 1 and changes(headscale_failover_leader[5m]) > 0"
        labels:
          severity: "info"
          category: "mesh"
        annotations:
          summary: "headscale leadership moved."
          description: "headscale leadership moved to {{ $labels.instance_name }}."

      - alert: "HeadscaleFailoverError"
        expr: "headscale_failover_error > 0"
        for: "5m"
        labels:
          severity: "warning"
          category: "mesh"
        annotations:
          summary: "The headscale failover agent keeps failing."
          description: "The headscale failover agent on {{ $labels.instance_name }} keeps failing; see its journal."

      - alert: "HeadscaleSnapshotLarge"
        expr: "headscale_failover_snapshot_bytes > 400000"
        labels:
          severity: "warning"
          category: "mesh"
        annotations:
          summary: "The headscale database snapshot in etcd nears its limit."
          description: "{{ $labels.instance_name }} keeps a {{ $value | humanize1024 }}B headscale snapshot in etcd; plan another replication channel."

      - alert: "HeadscaleFailoverStale"
        expr: "time() - headscale_failover_last_tick_timestamp_seconds > 120"
        labels:
          severity: "warning"
          category: "mesh"
        annotations:
          summary: "The headscale failover agent stopped running."
          description: "The headscale failover agent on {{ $labels.instance_name }} has not run for {{ $value | humanizeDuration }}."
