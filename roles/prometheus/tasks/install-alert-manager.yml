- ansible.builtin.import_tasks: "_facts.yml"
  vars:
    _prom_facts_subset: ["network"]
    _prom_needed_facts:
      - "architecture"
      - "default_ipv4"
      - "distribution"
      - "os_family"
      - "pkg_mgr"
      - "python_version"
      - "selinux"
      - "service_mgr"
      - "system"

# Resolved here: inside the included role `role_path` is that role's.
- name: "Resolve Alertmanager template files"
  tags: ["install"]
  ansible.builtin.set_fact:
    _am_template_files: >-
      {{ ([role_path ~ '/templates/*.tmpl'] if alertmanager_bundled_templates_enabled else [])
         + alertmanager_extra_template_files }}
    _am_inhibit_rules: >-
      {{ ([{'source_matchers': ['severity="critical"'],
            'target_matchers': ['severity="warning"'],
            'equal': ['alertname', 'instance_name', 'mountpoint']}]
          if alertmanager_severity_inhibit_enabled else [])
         + (alertmanager_inhibit_rules | default([])) }}

# The upstream role restarts Alertmanager on a template change, and a restart drops the alerts it holds: they
# come back from Prometheus one by one and each set is notified again. Copied first, the upstream copy finds them
# current, and a reload keeps the alerts. On a first install the upstream role creates the user and the dir.
- name: "Check the Alertmanager templates dir"
  tags: ["install"]
  ansible.builtin.stat:
    path: "/etc/alertmanager/templates"
  register: "_am_templates_dir"

- name: "Install Alertmanager templates ahead of the upstream role"
  tags: ["install"]
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/alertmanager/templates/"
    owner: "alertmanager"
    group: "alertmanager"
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', *_am_template_files) }}"
  when: "_am_templates_dir.stat.pw_name | default('') == 'alertmanager'"
  register: "_am_templates"

- name: "Install Alert Manager"
  tags: ["install"]
  vars:
    alertmanager_version: "0.32.0"
    alertmanager_web_listen_address: "{{ alertmanager_web_listen_ip }}:{{ alertmanager_web_listen_port }}"
    alertmanager_template_files: "{{ _am_template_files }}"
    alertmanager_inhibit_rules: "{{ _am_inhibit_rules }}"
  ansible.builtin.include_role:
    name: "prometheus.prometheus.alertmanager"
    apply:
      tags: ["install"]
      diff: false

# Rendered on the host: the upstream role copies templates verbatim.
- name: "Install Alertmanager instance emojis template"
  tags: ["install"]
  ansible.builtin.template:
    src: "instance-emojis.tmpl.j2"
    dest: "/etc/alertmanager/templates/instance-emojis.tmpl"
    variable_start_string: "[["
    variable_end_string: "]]"
    block_start_string: "[%"
    block_end_string: "%]"
    owner: "root"
    group: "root"
    mode: "0644"
  register: "instance_emojis_template"

# Every `*.tmpl` there is loaded, so a leftover one can redefine a bundled template.
- name: "List Alertmanager template files on host"
  tags: ["install"]
  ansible.builtin.find:
    paths: "/etc/alertmanager/templates"
    patterns: ["*.tmpl"]
  register: "host_template_files"

- name: "Remove stale Alertmanager template files"
  tags: ["install"]
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: >-
    {{
      host_template_files.files
      | map(attribute='path')
      | reject('in',
          query('ansible.builtin.fileglob', *_am_template_files)
          | map('basename')
          | map('regex_replace', '^', '/etc/alertmanager/templates/')
          | list
        )
      | reject('eq', '/etc/alertmanager/templates/instance-emojis.tmpl')
      | list
    }}
  register: "stale_templates_cleanup"

- name: "Reload Alertmanager after template changes"  # noqa: no-handler
  tags: ["install"]
  ansible.builtin.systemd:
    name: "alertmanager"
    state: "reloaded"
  when: "_am_templates is changed or stale_templates_cleanup is changed or instance_emojis_template is changed"
