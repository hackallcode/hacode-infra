# The prometheus.prometheus role below reads these facts and never gathers
# them. Keyed on every one of them, not just `architecture`: a fact cache
# filled by another role's `min` gathering has that one and lacks, say,
# `processor_count`, which then failed the unit template. `min` (always
# collected) covers the rest.
- name: "Gather the facts prometheus.prometheus reads"
  tags: ["install"]
  vars:
    _prom_needed_facts:
      - "architecture"
      - "default_ipv4"
      - "distribution"
      - "os_family"
      - "pkg_mgr"
      - "python_version"
      - "selinux"
      - "service_mgr"
      - "system"
  ansible.builtin.setup:
    gather_subset: ["network"]
  when: "_prom_needed_facts | reject('in', ansible_facts) | list | length > 0"

# Resolved here: inside the included role `role_path` is that role's.
- name: "Resolve Alertmanager template files"
  tags: ["install"]
  ansible.builtin.set_fact:
    _am_template_files: >-
      {{ ([role_path ~ '/templates/*.tmpl'] if alertmanager_bundled_templates_enabled else [])
         + alertmanager_extra_template_files }}

- name: "Install Alert Manager"
  tags: ["install"]
  vars:
    alertmanager_version: "0.32.0"
    alertmanager_web_listen_address: "{{ alertmanager_web_listen_ip }}:{{ alertmanager_web_listen_port }}"
    alertmanager_template_files: "{{ _am_template_files }}"
  ansible.builtin.include_role:
    name: "prometheus.prometheus.alertmanager"
    apply:
      tags: ["install"]
