# The prometheus.prometheus role below reads these facts and never gathers
# them. Keyed on every one of them, not just `architecture`: a fact cache
# filled by another role's `min` gathering has that one and lacks, say,
# `processor_count`, which then failed the unit template. `min` (always
# collected) covers the rest.
- name: "Gather the facts prometheus.prometheus reads"
  tags: ["install"]
  vars:
    _prom_needed_facts:
      - "architecture"
      - "distribution"
      - "fqdn"
      - "os_family"
      - "pkg_mgr"
      - "processor_count"
      - "processor_vcpus"
      - "python_version"
      - "selinux"
      - "service_mgr"
      - "system"
  ansible.builtin.setup:
    gather_subset: ["hardware"]
  when: "_prom_needed_facts | reject('in', ansible_facts) | list | length > 0"

- name: "List managed rule files"
  tags: ["install"]
  ansible.builtin.find:
    paths: >-
      {{ ([role_path ~ '/files/rules'] if prometheus_bundled_rules_enabled else [])
         + prometheus_extra_rule_dirs }}
    patterns: "*.yml"
  delegate_to: "localhost"
  become: false
  register: "managed_rule_files"

- name: "List rule files on host"
  tags: ["install"]
  ansible.builtin.find:
    paths: "/etc/prometheus/rules"
    patterns: "*.yml"
  register: "host_rule_files"

- name: "Remove stale rule files"
  tags: ["install"]
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: >-
    {{
      host_rule_files.files
      | map(attribute='path')
      | reject('in',
          managed_rule_files.files
          | map(attribute='path')
          | map('basename')
          | map('regex_replace', '^', '/etc/prometheus/rules/')
          | list
        )
      | list
    }}
  register: "stale_rules_cleanup"

- name: "Reload Prometheus after stale rules cleanup"  # noqa: no-handler
  tags: ["install"]
  ansible.builtin.systemd:
    name: "prometheus"
    state: "reloaded"
  when: "stale_rules_cleanup.changed"

# Resolved here: inside the included role `role_path` is that role's.
- name: "Resolve Prometheus rule and target files"
  tags: ["install"]
  ansible.builtin.set_fact:
    _prom_rule_files: >-
      {{ ([role_path ~ '/files/rules/*.yml'] if prometheus_bundled_rules_enabled else [])
         + (prometheus_extra_rule_dirs | map('regex_replace', '/?$', '/*.yml') | list) }}
    _prom_target_files: >-
      {{ [role_path ~ '/files/targets/*.yml']
         + (prometheus_extra_target_dirs | map('regex_replace', '/?$', '/*.yml') | list) }}

- name: "Install Prometheus"
  tags: ["install"]
  vars:
    prometheus_version: "3.4.0"
    prometheus_web_listen_address: "{{ prometheus_web_listen_ip }}:{{ prometheus_web_listen_port }}"
    prometheus_scrape_configs: "{{ prometheus_scrape_default_configs + prometheus_scrape_custom_configs }}"
    prometheus_alertmanager_config: "{{ prometheus_am_default_configs + prometheus_am_custom_configs }}"
    prometheus_alert_rules: []
    prometheus_alert_rules_files: "{{ _prom_rule_files }}"
    prometheus_static_targets_files: "{{ _prom_target_files }}"
  ansible.builtin.include_role:
    name: "prometheus.prometheus.prometheus"
    apply:
      tags: ["install"]
