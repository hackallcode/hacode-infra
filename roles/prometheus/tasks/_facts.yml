# prometheus.prometheus reads these facts but never gathers them; a partial
# cache (`min` only) must still be completed.
#
# Inputs: `_prom_needed_facts` (fact names without `ansible_`) and
# `_prom_facts_subset` (the extra `gather_subset` that yields them).
- name: "Gather the facts prometheus.prometheus reads"
  tags: ["install"]
  ansible.builtin.setup:
    gather_subset: "{{ _prom_facts_subset }}"
  when: "_prom_needed_facts | reject('in', ansible_facts) | list | length > 0"
