galaxy_info:
  role_name: "machine"
  namespace: "hacode"
  author: "Vladimir Severov"
  description: >-
    Baseline configuration of a Linux host: users, SSH, firewall, DNS, journald,
    fail2ban, SELinux, swap, packages, ZSH, optional Docker, Cockpit, NVIDIA/CUDA
    and Raspberry Pi tweaks.
  license: "Apache-2.0"
  min_ansible_version: "2.16"
  platforms:
    - name: "EL"
      versions: ["9", "10"]
    - name: "Fedora"
      versions: ["all"]
    - name: "Ubuntu"
      versions: ["focal", "jammy", "noble"]
    - name: "Debian"
      versions: ["bullseye", "bookworm"]
  galaxy_tags:
    - "system"
    - "bootstrap"
    - "baseline"
    - "linux"
    - "users"
    - "ssh"
    - "firewall"

dependencies: []
