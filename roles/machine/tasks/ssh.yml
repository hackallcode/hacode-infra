- name: "Gather os_family (sshd unit name differs Debian/RHEL)"
  tags: ["ssh"]
  ansible.builtin.setup:
    gather_subset: ["min"]
    filter: ["ansible_os_family"]
  when: "ansible_os_family is not defined"

# `sshd -t -f %s` (the validator we attach to every lineinfile below)
# refuses to run without the privilege-separation directory. On hosts
# where sshd has never been started (fresh cloud images, CI containers)
# the directory does not exist yet. Create it eagerly so the validate
# stage always succeeds.
- name: "Ensure sshd privsep dir exists (needed by `sshd -t`)"
  tags: ["ssh"]
  ansible.builtin.file:
    path: "/run/sshd"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Disable root SSH login"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^PermitRootLogin"
    line: "PermitRootLogin no"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_root"

- name: "Disable password SSH login"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_password"

- name: "SSH config: ClientAliveInterval"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^ClientAliveInterval"
    line: "ClientAliveInterval 30"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_alive_interval"

- name: "SSH config: ClientAliveCountMax"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^ClientAliveCountMax"
    line: "ClientAliveCountMax 3"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_alive_count"

- name: "SSH config: MaxSessions"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^#?MaxSessions"
    line: "MaxSessions {{ machine_ssh_max_sessions }}"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_max_sessions"

- name: "SSH config: MaxStartups"
  tags: ["ssh"]
  ansible.builtin.lineinfile:
    dest: "/etc/ssh/sshd_config"
    regexp: "^#?MaxStartups"
    line: "MaxStartups {{ machine_ssh_max_startups }}"
    state: "present"
    validate: "/usr/sbin/sshd -t -f %s"
  register: "ssh_config_max_startups"

- name: "Validate sshd drop-in entries"
  tags: ["ssh"]
  ansible.builtin.assert:
    that:
      - "item.name is defined and (item.name | string) is match('^[A-Za-z0-9_.-]+$')"
      - "(item.state | default('present')) in ['present', 'absent']"
      - "(item.state | default('present')) == 'absent' or (item.content | default('') | length > 0)"
    fail_msg: >-
      Invalid machine_ssh_dropins entry {{ item.name | default('(unnamed)') }}:
      `name` must match [A-Za-z0-9_.-]+, `state` is present|absent, and a
      present fragment needs a non-empty `content`.
    quiet: true
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

# An unincluded `Match User` fragment would silently leave its account unrestricted.
- name: "Check that sshd_config includes sshd_config.d"
  tags: ["ssh"]
  ansible.builtin.command:
    cmd: "grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\\.d/\\*\\.conf' /etc/ssh/sshd_config"
  register: "ssh_dropins_include"
  changed_when: false
  failed_when: "ssh_dropins_include.rc != 0"
  check_mode: false
  when: >-
    machine_ssh_dropins | map(attribute='state', default='present')
    | select('equalto', 'present') | list | length > 0

- name: "SSH config: drop-ins from machine_ssh_dropins"
  tags: ["ssh"]
  ansible.builtin.copy:
    dest: "/etc/ssh/sshd_config.d/{{ item.name }}.conf"
    content: "{{ item.content }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name }}"
  register: "ssh_config_dropins"
  when: "(item.state | default('present')) == 'present'"

- name: "SSH config: remove absent drop-ins"
  tags: ["ssh"]
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/{{ item.name }}.conf"
    state: "absent"
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name }}"
  register: "ssh_config_dropins_absent"
  when: "(item.state | default('present')) == 'absent'"

# Fragments that only break in combination must fail here, not on the restart below.
- name: "Check the full sshd config"
  tags: ["ssh"]
  ansible.builtin.command:
    cmd: "/usr/sbin/sshd -t"
  changed_when: false
  when: "ssh_config_dropins is changed or ssh_config_dropins_absent is changed"

- name: "Restart SSH daemon"
  tags: ["ssh"]
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: "restarted"
  when: >-
    ssh_config_root is changed or
    ssh_config_password is changed or
    ssh_config_alive_interval is changed or
    ssh_config_alive_count is changed or
    ssh_config_max_sessions is changed or
    ssh_config_max_startups is changed or
    ssh_config_dropins is changed or
    ssh_config_dropins_absent is changed or
    (force | default(false) | bool)
