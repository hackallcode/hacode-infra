- name: "Gather os_family (sshd unit name differs Debian/RHEL)"
  tags: ["ssh"]
  ansible.builtin.setup:
    gather_subset: ["min"]
    filter: ["ansible_os_family"]
  when: "ansible_os_family is not defined"

# `sshd -t -f %s` (the validator we attach to every config write below)
# refuses to run without the privilege-separation directory. On hosts
# where sshd has never been started (fresh cloud images, CI containers)
# the directory does not exist yet. Create it eagerly so the validate
# stage always succeeds.
- name: "Ensure sshd privsep dir exists (needed by `sshd -t`)"
  tags: ["ssh"]
  ansible.builtin.file:
    path: "/run/sshd"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

# The role's settings live in a drop-in sorting first: sshd keeps the first
# value it reads, and image fragments would win otherwise.
- name: "Harden sshd through 00-hacode.conf"
  tags: ["ssh"]
  vars:
    _settings:
      PermitRootLogin: "no"
      PasswordAuthentication: "no"
      ClientAliveInterval: 30
      ClientAliveCountMax: 3
      MaxSessions: "{{ machine_ssh_max_sessions }}"
      MaxStartups: "{{ machine_ssh_max_startups }}"
    # Up to the first `Match` line; inside a Match block the same keywords
    # are per-user exceptions, not the global values the role replaces.
    _global_part: '(?s)\A.*?(?=^[ \t]*Match[ \t]|\Z)'
    _setting_line: '^([ \t]*(?:{{ _settings.keys() | join("|") }})[ \t=])'
  block:
    - name: "Ensure /etc/ssh/sshd_config.d exists"
      ansible.builtin.file:
        path: "/etc/ssh/sshd_config.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "SSH config: the role's settings in 00-hacode.conf"
      ansible.builtin.copy:
        dest: "/etc/ssh/sshd_config.d/00-hacode.conf"
        content: |
          {% for key, value in _settings.items() %}
          {{ key }} {{ value }}
          {% endfor %}
        owner: "root"
        group: "root"
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"
      register: "ssh_config_role"

    # EL8 and older Debian/Ubuntu ship no Include. Added before the settings are
    # commented out, so an interrupted run never leaves them unread.
    - name: "SSH config: include sshd_config.d ahead of everything else"
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config"
        regexp: '^[ \t]*Include[ \t]+/etc/ssh/sshd_config\.d/\*\.conf'
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertbefore: "BOF"
        validate: "/usr/sbin/sshd -t -f %s"
      register: "ssh_config_include"

    - name: "Read sshd_config"
      ansible.builtin.slurp:
        src: "/etc/ssh/sshd_config"
      register: "ssh_config_main_src"

    # Commented out, not deleted: shows the setting is managed elsewhere.
    - name: "SSH config: comment the same settings out of sshd_config"
      vars:
        _text: "{{ ssh_config_main_src.content | b64decode }}"
        _global: "{{ _text | regex_search(_global_part, multiline=True, ignorecase=True) | default('', true) }}"
      ansible.builtin.copy:
        dest: "/etc/ssh/sshd_config"
        content: >-
          {{ (_global | regex_replace(_setting_line, '#\1', multiline=True, ignorecase=True))
             ~ _text[_global | length:] }}
        owner: "root"
        group: "root"
        mode: "0600"
        validate: "/usr/sbin/sshd -t -f %s"
      register: "ssh_config_main"

- name: "Validate sshd drop-in entries"
  tags: ["ssh"]
  ansible.builtin.assert:
    that:
      - "item.name is defined and (item.name | string) is match('^[A-Za-z0-9_.-]+$')"
      - "item.name != '00-hacode'"
      - "(item.state | default('present')) in ['present', 'absent']"
      - "(item.state | default('present')) == 'absent' or (item.content | default('') | length > 0)"
    fail_msg: >-
      Invalid machine_ssh_dropins entry {{ item.name | default('(unnamed)') }}:
      `name` must match [A-Za-z0-9_.-]+ and can't be `00-hacode` (the role's
      own), `state` is present|absent, and a present fragment needs a
      non-empty `content`.
    quiet: true
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

- name: "SSH config: drop-ins from machine_ssh_dropins"
  tags: ["ssh"]
  ansible.builtin.copy:
    dest: "/etc/ssh/sshd_config.d/{{ item.name }}.conf"
    content: "{{ item.content }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name }}"
  register: "ssh_config_dropins"
  when: "(item.state | default('present')) == 'present'"

- name: "SSH config: remove absent drop-ins"
  tags: ["ssh"]
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/{{ item.name }}.conf"
    state: "absent"
  loop: "{{ machine_ssh_dropins }}"
  loop_control:
    label: "{{ item.name }}"
  register: "ssh_config_dropins_absent"
  when: "(item.state | default('present')) == 'absent'"

# Fragments that only break in combination must fail here, not on the restart below.
- name: "Check the full sshd config"
  tags: ["ssh"]
  ansible.builtin.command:
    cmd: "/usr/sbin/sshd -t"
  changed_when: false
  when: >-
    ssh_config_role is changed or
    ssh_config_main is changed or
    ssh_config_include is changed or
    ssh_config_dropins is changed or
    ssh_config_dropins_absent is changed

# Sorting first is only a name (an image may ship `00-a…`), so check what
# sshd applies. A managed drop-in sorting earlier — by file name, as sshd
# sorts — is the deliberate override and skips this.
- name: "Check sshd applies the role's root and password login settings"
  tags: ["ssh"]
  ansible.builtin.command:
    argv: ["/usr/sbin/sshd", "-T"]
  register: "ssh_effective"
  changed_when: false
  failed_when: >-
    ssh_effective.rc != 0
    or 'permitrootlogin no' not in ssh_effective.stdout_lines
    or 'passwordauthentication no' not in ssh_effective.stdout_lines
  when:
    - "not ansible_check_mode"
    - >-
      (machine_ssh_dropins | selectattr('state', 'undefined') | list
       + machine_ssh_dropins | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list)
      | map(attribute='name') | map('regex_replace', '$', '.conf')
      | select('lt', '00-hacode.conf') | list | length == 0

- name: "Restart SSH daemon"
  tags: ["ssh"]
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: "restarted"
  when: >-
    ssh_config_role is changed or
    ssh_config_main is changed or
    ssh_config_include is changed or
    ssh_config_dropins is changed or
    ssh_config_dropins_absent is changed or
    (force | default(false) | bool)
