- name: "Start and enable firewalld"
  tags: ["firewall"]
  ansible.builtin.systemd:
    name: "firewalld"
    state: "started"
    enabled: true

- name: "Read firewalld default zone"
  tags: ["firewall"]
  ansible.builtin.command: "firewall-cmd --get-default-zone"
  register: "fw_default_zone"
  changed_when: false

- name: "Converge firewalld default zone"
  tags: ["firewall"]
  when: "fw_default_zone.stdout != firewall_default_zone"
  block:
    # --set-default-zone is a stand-alone option: firewalld refuses it
    # combined with --permanent ("Can't use stand-alone options with other
    # options."), and it writes firewalld.conf — i.e. persists — by itself.
    - name: "Set firewalld default zone"
      ansible.builtin.command: "firewall-cmd --set-default-zone={{ firewall_default_zone }}"
      changed_when: true
      notify: "Reload firewalld"

    # The role commonly runs with gather_facts: false, so ask the kernel
    # for the default-route interface instead of ansible_default_ipv4.
    - name: "Find interface carrying the default route"
      ansible.builtin.shell:
        cmd: "set -o pipefail; ip -o -4 route show to default | awk '{print $5; exit}'"
        executable: "/bin/bash"
      register: "fw_default_iface"
      changed_when: false

    - name: "Bind default-route interface to the default zone"
      ansible.builtin.command: >-
        firewall-cmd --permanent
        --zone={{ firewall_default_zone }}
        --change-interface={{ fw_default_iface.stdout }}
      when: "fw_default_iface.stdout | length > 0"
      changed_when: true
      notify: "Reload firewalld"

- name: "Enable services in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: "enabled"
  loop: "{{ firewall_services }}"
  notify: "Reload firewalld"

- name: "Enable ports in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: "enabled"
  loop: "{{ firewall_ports }}"
  notify: "Reload firewalld"

- name: "Disable services in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: "disabled"
  loop: "{{ disabled_firewall_services }}"
  notify: "Reload firewalld"

- name: "Disable ports in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: "disabled"
  loop: "{{ disabled_firewall_ports }}"
  notify: "Reload firewalld"

- name: "Configure public DNS firewall (accept + per-source-IP hashlimit)"
  ansible.builtin.import_tasks: "firewall_dns.yml"
  when: "machine_dns_public | bool"

- name: "Forward user routes"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    port_forward:
      - proto: "{{ item.proto | default('tcp') }}"
        port: "{{ item.from_port }}"
        toaddr: "{{ item.to_ip | default(omit) }}"
        toport: "{{ item.to_port }}"
    state: "{{ item.state | default('enabled') }}"
    permanent: true
  loop: "{{ firewall_routes }}"
  notify: "Reload firewalld"
  when: "firewall_routes | length > 0"

- name: "Enable masquerade"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    masquerade: true
    state: "enabled"
    permanent: true
  notify: "Reload firewalld"
  when: "firewall_masquerade | bool"

- name: "Enable masquerade in extra zones"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ item }}"
    masquerade: true
    state: "enabled"
    permanent: true
  loop: "{{ firewall_masquerade_zones }}"
  notify: "Reload firewalld"

- name: "Force firewall reload when `force` is set"
  tags: ["firewall"]
  ansible.builtin.systemd:
    name: "firewalld"
    state: "reloaded"
  when: "force | default(false) | bool"
