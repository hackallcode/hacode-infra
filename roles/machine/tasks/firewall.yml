- name: "Start and enable firewalld"
  tags: ["firewall"]
  ansible.builtin.systemd:
    name: "firewalld"
    state: "started"
    enabled: true

- name: "Read firewalld default zone"
  tags: ["firewall"]
  ansible.builtin.command: "firewall-cmd --get-default-zone"
  register: _firewall_default_zone
  changed_when: false
  check_mode: false

# --set-default-zone updates both runtime and permanent configuration;
# firewalld rejects combining this standalone option with --permanent.
- name: "Set firewalld default zone"
  tags: ["firewall"]
  ansible.builtin.command:
    argv: ["firewall-cmd", "--set-default-zone={{ firewall_default_zone }}"]
  changed_when: true
  when: "_firewall_default_zone.stdout != firewall_default_zone"

# Bootstrap may disable fact gathering, so read the route rather than relying
# on ansible_default_ipv4; `ip -j` also yields `dev` when the route has no
# gateway. iproute2 lists default routes in preference order, so the first is
# the primary one.
- name: "Find interfaces carrying a default route"
  tags: ["firewall"]
  ansible.builtin.command: "ip -j route show default"
  register: _firewall_default_route
  changed_when: false
  check_mode: false

- name: "Read the zone each interface to bind is already in"
  tags: ["firewall"]
  vars:
    _firewall_default_devs: >-
      {{ _firewall_default_route.stdout | from_json | map(attribute='dev') | list }}
    _firewall_bind_interfaces: >-
      {{ firewall_zone_interfaces | list
         if firewall_zone_interfaces | length > 0
         else _firewall_default_devs[:1] }}
  ansible.builtin.command: "firewall-cmd --get-zone-of-interface={{ item }}"
  register: _firewall_interface_zones
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ _firewall_bind_interfaces }}"

# `ansible.posix.firewalld` cannot read back the zone of a NetworkManager-
# controlled interface and so reports a change on every run; the probe above
# is what makes this task idempotent.
- name: "Bind interfaces to the default zone"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    interface: "{{ item.item }}"
    state: "enabled"
    permanent: true
    immediate: true
  loop: "{{ _firewall_interface_zones.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "item.stdout | default('') != firewall_default_zone"
  notify: "Reload firewalld"

- name: "Enable services in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    service: "{{ item }}"
    permanent: true
    state: "enabled"
  loop: "{{ firewall_services }}"
  notify: "Reload firewalld"

- name: "Enable ports in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    port: "{{ item }}"
    permanent: true
    state: "enabled"
  loop: "{{ firewall_ports }}"
  notify: "Reload firewalld"

- name: "Disable services in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    service: "{{ item }}"
    permanent: true
    state: "disabled"
  loop: "{{ disabled_firewall_services }}"
  notify: "Reload firewalld"

- name: "Disable ports in firewall"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    port: "{{ item }}"
    permanent: true
    state: "disabled"
  loop: "{{ disabled_firewall_ports }}"
  notify: "Reload firewalld"

- name: "Configure public DNS firewall (accept + per-source-IP hashlimit)"
  ansible.builtin.import_tasks: "firewall_dns.yml"
  when: "machine_dns_public | bool"

- name: "Forward user routes"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    port_forward:
      - proto: "{{ item.proto | default('tcp') }}"
        port: "{{ item.from_port }}"
        toaddr: "{{ item.to_ip | default(omit) }}"
        toport: "{{ item.to_port }}"
    state: "{{ item.state | default('enabled') }}"
    permanent: true
  loop: "{{ firewall_routes }}"
  notify: "Reload firewalld"
  when: "firewall_routes | length > 0"

- name: "Enable masquerade"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ firewall_default_zone }}"
    masquerade: true
    state: "enabled"
    permanent: true
  notify: "Reload firewalld"
  when: "firewall_masquerade | bool"

- name: "Enable masquerade in extra zones"
  tags: ["firewall"]
  ansible.posix.firewalld:
    zone: "{{ item }}"
    masquerade: true
    state: "enabled"
    permanent: true
  loop: "{{ firewall_masquerade_zones }}"
  notify: "Reload firewalld"

- name: "Force firewall reload when `force` is set"
  tags: ["firewall"]
  ansible.builtin.systemd:
    name: "firewalld"
    state: "reloaded"
  when: "force | default(false) | bool"
