- name: "Gather facts needed by NVIDIA tasks (architecture)"
  tags: ["nvidia"]
  ansible.builtin.setup:
    gather_subset: ["hardware"]
    filter: ["ansible_architecture"]
  when: "ansible_architecture is not defined"

- name: "Fail if NVIDIA role is run on non-RedHat host"
  tags: ["nvidia"]
  ansible.builtin.fail:
    msg: "NVIDIA CUDA install in this role currently supports only RHEL-family hosts."
  when: "ansible_os_family != 'RedHat'"

- name: "Add NVIDIA CUDA repo"
  tags: ["nvidia"]
  vars:
    _cuda_repo_base: "https://developer.download.nvidia.com/compute/cuda/repos"
    _cuda_rhel_ver: "rhel{{ ansible_distribution_major_version }}"
  ansible.builtin.get_url:
    url: "{{ _cuda_repo_base }}/{{ _cuda_rhel_ver }}/{{ ansible_architecture }}/cuda-{{ _cuda_rhel_ver }}.repo"
    dest: "/etc/yum.repos.d/cuda-{{ _cuda_rhel_ver }}.repo"
    mode: "0644"

- name: "Disable CUDA repo for routine upgrades"
  tags: ["nvidia"]
  vars:
    _cuda_rhel_ver: "rhel{{ ansible_distribution_major_version }}"
  community.general.ini_file:
    path: "/etc/yum.repos.d/cuda-{{ _cuda_rhel_ver }}.repo"
    section: "cuda-{{ _cuda_rhel_ver }}-{{ ansible_architecture }}"
    option: "enabled"
    value: "0"
    mode: "0644"
  when: "not ansible_check_mode"

- name: "Add nvidia-container-toolkit repo"
  tags: ["nvidia"]
  ansible.builtin.get_url:
    url: "https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo"
    dest: "/etc/yum.repos.d/nvidia-container-toolkit.repo"
    mode: "0644"

- name: "Strip orphan libnvidia-container sections (legacy)"
  tags: ["nvidia"]
  ansible.builtin.replace:
    path: "/etc/yum.repos.d/nvidia-container-toolkit.repo"
    regexp: '(?m)^\[libnvidia-container(?:-experimental)?\][^\[]*'
    replace: ''
  when: "not ansible_check_mode"

- name: "Disable nvidia-container-toolkit repos for routine upgrades"
  tags: ["nvidia"]
  community.general.ini_file:
    path: "/etc/yum.repos.d/nvidia-container-toolkit.repo"
    section: "{{ item }}"
    option: "enabled"
    value: "0"
    mode: "0644"
  loop:
    - "nvidia-container-toolkit"
    - "nvidia-container-toolkit-experimental"
  when: "not ansible_check_mode"

# dnf modular filtering hides the cuda-rhelN repo's driver packages until
# the owning `nvidia-driver` stream is *enabled* (reset/disable both leave
# the stream un-enabled, which keeps the filter on). Enable it before the
# install so `cuda-<ver>` can resolve its `nvidia-driver-cuda` →
# `nvidia-kmod` chain. `module_stream_switch=1` makes the task converge
# from any prior module state — including a different stream already
# enabled — without a manual `module reset`.
- name: "Enable nvidia-driver dnf module stream (un-filter cuda driver packages)"
  tags: ["nvidia"]
  vars:
    _cuda_rhel_ver: "rhel{{ ansible_distribution_major_version }}"
  ansible.builtin.command:
    cmd: >-
      dnf -y --enablerepo=cuda-{{ _cuda_rhel_ver }}-{{ ansible_architecture }}
      --setopt=module_stream_switch=1
      module enable nvidia-driver:{{ nvidia_driver_module_stream }}
  register: _nvidia_module_enable
  changed_when: "'Nothing to do' not in (_nvidia_module_enable.stdout | default(''))"
  when: "not ansible_check_mode"

# `allowerasing` lets dnf swap a stale cross-channel driver (e.g. elrepo's
# `kmod-nvidia` built for an older kernel ABI) for the cuda-repo's
# `nvidia-kmod` that matches the running kernel, instead of aborting the
# depsolve on the conflict.
- name: "Install CUDA {{ cuda_version }} (with driver)"
  tags: ["nvidia"]
  vars:
    _cuda_rhel_ver: "rhel{{ ansible_distribution_major_version }}"
  ansible.builtin.dnf:
    name:
      - "cuda-{{ cuda_version.replace('.', '-') }}"
      - "nvidia-container-toolkit-{{ nvidia_container_toolkit_version }}-1"
      - "libnvidia-container-tools-{{ nvidia_container_toolkit_version }}-1"
    state: "present"
    allowerasing: true
    enablerepo:
      - "cuda-{{ _cuda_rhel_ver }}-{{ ansible_architecture }}"
      - "nvidia-container-toolkit"
  notify: "Reboot after driver install"
  when: "not ansible_check_mode"

# On a fresh host dnf lands the kmod, `dkms` and `kernel-devel` in one
# transaction, and the kmod's %post only gets as far as `dkms add`: the
# build is driven by kernel-install's 40-dkms hook, which fires only when
# the kernel itself is (re)installed in that same transaction. Left to
# itself the module stays `added`, no `nvidia.ko` exists for the running
# kernel, and no reboot can fix what was never built. The stream gate keeps
# prebuilt streams (`560`, `latest-open`, ...) out — they ship no dkms tree
# and their hosts often lack the binary.
- name: "Build NVIDIA DKMS module for the running kernel"
  tags: ["nvidia"]
  ansible.builtin.shell:
    # `$(uname -r)` needs a shell — `command` passes it literally and dkms
    # rejects it with `Error! Unknown option: -r)`.
    cmd: "dkms autoinstall -k $(uname -r)"
  register: _nvidia_dkms_build
  # On a kernel whose module is already built, autoinstall exits 0 with
  # empty stdout — any output means it built something.
  changed_when: "_nvidia_dkms_build.stdout | length > 0"
  when:
    - "not ansible_check_mode"
    - "nvidia_driver_module_stream is search('dkms')"

# `nvidia-container-cli` probes the *loaded* driver — a module that is
# built but not in still fails GPU passthrough with `nvml error: driver not
# loaded`. Of the three, only `nvidia` carries a PCI modalias the kernel
# autoloads on; `nvidia_uvm` (CUDA's allocator) and `nvidia_modeset` need
# this explicit load.
- name: "Load NVIDIA kernel modules"
  tags: ["nvidia"]
  community.general.modprobe:
    name: "{{ item }}"
    state: "present"
  loop:
    - "nvidia"
    - "nvidia_uvm"
    - "nvidia_modeset"
  when: "not ansible_check_mode"

# Self-heal a host left running a stale in-kernel `nvidia` module when the
# installed package version has moved past it — out-of-band upgrade,
# interrupted converge, or the kernel outran the prebuilt kmod after an
# OS bump. The build + load above fix a module that is missing entirely;
# what is left for a reboot is a module already loaded from an older
# driver, which cannot be unloaded in place. Compares the loaded module
# version against the installed `nvidia-kmod-common` and re-notifies the
# reboot handler on mismatch.
- name: "Request reboot if loaded nvidia driver does not match installed package"
  tags: ["nvidia"]
  ansible.builtin.shell:
    # Prints "reboot ..." (drives `changed_when` below, which fires the reboot
    # handler) when the loaded `nvidia` module version differs from the
    # installed `nvidia-kmod-common` — an older module in use that only a
    # reboot replaces. Otherwise prints "ok ...".
    cmd: >-
      set -o pipefail;
      loaded="$(cat /sys/module/nvidia/version 2>/dev/null || true)";
      installed="$(rpm -q --qf '%{VERSION}' nvidia-kmod-common 2>/dev/null || true)";
      if [ -n "$installed" ] && [ "$loaded" != "$installed" ]; then
        echo "reboot loaded=${loaded:-none} installed=${installed}";
      else
        echo "ok loaded=${loaded:-none} installed=${installed:-none}";
      fi
  register: _nvidia_driver_state
  changed_when: "(_nvidia_driver_state.stdout | default('')) is search('^reboot')"
  failed_when: false
  notify: "Reboot after driver install"
  when: "not ansible_check_mode"
