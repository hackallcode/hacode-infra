- name: "Verify: nginx role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Nginx binary is installed"
      ansible.builtin.stat:
        path: "/usr/sbin/nginx"
      register: "nginx_bin"
      failed_when: "not nginx_bin.stat.exists"

    - name: "Nginx service is enabled"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled nginx.service"
      register: "nginx_enabled"
      changed_when: false
      failed_when: "nginx_enabled.stdout.strip() != 'enabled'"

    - name: "Www directory exists"
      ansible.builtin.stat:
        path: "/var/www"
      register: "www_dir"
      failed_when: "not www_dir.stat.isdir"

    - name: "Vhost config is uploaded as is by default"
      ansible.builtin.slurp:
        src: "/etc/nginx/conf.d/verbatim.example.test.conf"
      register: "nginx_verbatim"
      failed_when: "'value-from-vars' in (nginx_verbatim.content | b64decode)"

    - name: "Vhost config is rendered with nginx_config_template"
      ansible.builtin.slurp:
        src: "/etc/nginx/conf.d/template.example.test.conf"
      register: "nginx_rendered"
      failed_when: "'value-from-vars' not in (nginx_rendered.content | b64decode)"
