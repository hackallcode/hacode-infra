- name: "Verify: etcd role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "The member is healthy over TLS"
      ansible.builtin.command:
        argv: ["/usr/local/sbin/etcdctl-local", "endpoint", "health"]
      changed_when: false

    - name: "The member does not answer without a client certificate"
      ansible.builtin.uri:
        url: "https://127.0.0.1:2379/health"
        validate_certs: false
        status_code: [-1, 400, 401, 403]
      register: "anonymous"
      failed_when: "anonymous.status == 200"

    - name: "The cluster has exactly this member"
      ansible.builtin.command:
        argv: ["/usr/local/sbin/etcdctl-local", "member", "list", "-w", "json"]
      register: "members"
      changed_when: false
      failed_when: >-
        (members.stdout | from_json).members | map(attribute='name') | list != ['molecule']

    - name: "The config carries the etcd_config_extra override"
      ansible.builtin.slurp:
        src: "/etc/etcd/etcd.conf.yml"
      register: "config"
      failed_when: "'heartbeat-interval: 200' not in (config.content | b64decode)"

    - name: "Read the maintenance timers"
      ansible.builtin.systemd:
        name: "etcd-{{ item }}.timer"
      loop: ["defrag", "backup"]
      register: "timers"
      changed_when: false
      failed_when: false

    - name: "The maintenance timers are on"
      ansible.builtin.assert:
        that: "item.status.ActiveState == 'active'"
        quiet: true
      loop: "{{ timers.results }}"
      loop_control:
        label: "{{ item.item }}"
