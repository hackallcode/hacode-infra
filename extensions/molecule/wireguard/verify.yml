- name: "Verify: wireguard role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Wg binary is installed"
      ansible.builtin.stat:
        path: "/usr/bin/wg"
      register: "wg_bin"
      failed_when: "not wg_bin.stat.exists"

    - name: "IPv4 forwarding sysctl is set"
      ansible.builtin.command: "sysctl -n net.ipv4.ip_forward"
      register: "ip_forward"
      changed_when: false
      failed_when: "ip_forward.stdout.strip() != '1'"

    - name: "Server private key was generated"
      ansible.builtin.stat:
        path: "/etc/wireguard/keys/server"
      register: "server_key"
      failed_when: "not server_key.stat.exists"

    - name: "Wg0.conf contains the server block"
      ansible.builtin.command: "grep -q 'server config begin' /etc/wireguard/wg0.conf"
      changed_when: false

- name: "Verify: wireguard key backup round trip"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    wg_backup_local_dir: "/tmp/molecule-wg-backups"

  tasks:
    - name: "Read the server key before the round trip"
      ansible.builtin.slurp:
        src: "/etc/wireguard/keys/server"
      register: "wg_key_before"

    - name: "Run server-backup"
      ansible.builtin.include_role:
        name: "hacode.infra.wireguard"
        tasks_from: "server-backup"

    - name: "Lose the keys"
      ansible.builtin.file:
        path: "/etc/wireguard/keys"
        state: "absent"

    - name: "Run server-restore"
      ansible.builtin.include_role:
        name: "hacode.infra.wireguard"
        tasks_from: "server-restore"

    - name: "Read the server key after the round trip"
      ansible.builtin.slurp:
        src: "/etc/wireguard/keys/server"
      register: "wg_key_after"

    - name: "Stat the keys directory"
      ansible.builtin.stat:
        path: "/etc/wireguard/keys"
      register: "wg_keys_dir"

    - name: "The same key is back, in a 0700 directory"
      ansible.builtin.assert:
        that:
          - "wg_key_after.content == wg_key_before.content"
          - "wg_keys_dir.stat.mode == '0700'"
