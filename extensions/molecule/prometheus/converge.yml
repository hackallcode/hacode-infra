- name: "Converge: prometheus role"
  hosts: "all"
  become: true
  # `min` only, like a cache another role filled: the installs must gather
  # the rest themselves.
  gather_facts: false

  pre_tasks:
    - name: "Gather the min subset only, like a cache another role filled"
      ansible.builtin.setup:
        gather_subset: ["min"]

  roles:
    - role: "hacode.infra.prometheus"
