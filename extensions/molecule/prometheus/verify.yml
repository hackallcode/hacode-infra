- name: "Verify: prometheus role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Node_exporter service is enabled"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled node_exporter.service"
      register: "ne_enabled"
      changed_when: false
      failed_when: "ne_enabled.stdout.strip() != 'enabled'"

    - name: "Alertmanager service is enabled"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled alertmanager.service"
      register: "am_enabled"
      changed_when: false
      failed_when: "am_enabled.stdout.strip() != 'enabled'"

    - name: "Prometheus service is enabled"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled prometheus.service"
      register: "p_enabled"
      changed_when: false
      failed_when: "p_enabled.stdout.strip() != 'enabled'"

    - name: "Prometheus config exists"
      ansible.builtin.stat:
        path: "/etc/prometheus/prometheus.yml"
      register: "p_config"
      failed_when: "not p_config.stat.exists"

    - name: "Prometheus unit carries the override"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl show -p OOMScoreAdjust -p MemoryMax prometheus.service"
      register: "p_overrides"
      changed_when: false
      failed_when: >-
        'OOMScoreAdjust=-900' not in p_overrides.stdout
        or 'MemoryMax=268435456' not in p_overrides.stdout

    - name: "Gather OS family for the RHEL-only firewall checks"
      ansible.builtin.setup:
        gather_subset: ["!all", "min"]

    - name: "Read the firewalld config node_exporter left behind (RHEL)"
      ansible.builtin.command:
        argv: ["firewall-cmd", "--permanent", "--list-all"]
      register: "ne_fw"
      changed_when: false
      when: "ansible_os_family == 'RedHat'"

    - name: "Node Exporter is fenced to the allowed source only (RHEL)"
      ansible.builtin.assert:
        that:
          - "'source address=\"10.99.0.0/16\"' in ne_fw.stdout"
          - "'port port=\"9100\" protocol=\"tcp\" accept' in ne_fw.stdout"
          - "'9100/tcp' not in ne_fw.stdout"
        fail_msg: >-
          Expected a rich rule opening 9100/tcp to 10.99.0.0/16 and no plain
          9100/tcp port rule. Got: {{ ne_fw.stdout }}
      when: "ansible_os_family == 'RedHat'"

    - name: "Bundled rules reached the host"
      ansible.builtin.stat:
        path: "/etc/prometheus/rules/node-ram.yml"
      register: "p_bundled_rule"
      failed_when: "not p_bundled_rule.stat.exists"

    - name: "Bundled Alertmanager template reached the host"
      ansible.builtin.stat:
        path: "/etc/alertmanager/templates/telegram-alert.tmpl"
      register: "am_bundled_template"
      failed_when: "not am_bundled_template.stat.exists"

    - name: "Project template from alertmanager_extra_template_files landed too"
      ansible.builtin.slurp:
        src: "/etc/alertmanager/templates/molecule-extra.tmpl"
      register: "am_extra_template"
      failed_when: >-
        'molecule.extra.message' not in (am_extra_template.content | b64decode)
