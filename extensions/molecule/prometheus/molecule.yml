# prometheus scenario: installs node_exporter, alertmanager and prometheus
# via the upstream prometheus.prometheus collection (this role delegates
# to those sub-roles). Opens firewall ports for each component.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

provisioner:
  name: "ansible"
  inventory:
    group_vars:
      all:
        # prometheus.prometheus.alertmanager asserts at least one receiver
        # and a route. Noop entries satisfy the assertion without sending
        # traffic anywhere.
        alertmanager_receivers:
          - name: "noop"
        alertmanager_route:
          receiver: "noop"
        prometheus_unit_overrides:
          prometheus:
            OOMScoreAdjust: -900
            MemoryMax: "256M"
        # Exercises the firewalld path on the RHEL platforms: the plain
        # port rule closes and a rich rule opens the port to this source
        # only. Debian platforms skip the whole block.
        node_exporter_allowed_sources:
          - "10.99.0.0/16"
        # A project template alongside the bundled one, so verify can tell
        # that the two globs concatenate rather than one replacing the
        # other. Absolute, because the upstream role resolves the list on
        # the controller and molecule runs from an ephemeral directory.
        alertmanager_extra_template_files:
          - "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/molecule-extra.tmpl"

verifier:
  name: "ansible"
