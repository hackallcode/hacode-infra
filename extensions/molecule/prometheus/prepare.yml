- name: "Prepare: firewalld stack on RHEL; setuptools for pip"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Install EPEL + firewalld + python3-firewall on RHEL family"
      ansible.builtin.package:
        name:
          - "epel-release"
          - "firewalld"
          - "python3-firewall"
        state: "present"
      when: "ansible_os_family == 'RedHat'"

    - name: "Start firewalld on RHEL family"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      when: "ansible_os_family == 'RedHat'"

    - name: "Refresh apt cache on Debian family"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: "ansible_os_family == 'Debian'"

    - name: "Create the rules dir"
      ansible.builtin.file:
        path: "/etc/prometheus/rules"
        state: "directory"
        mode: "0755"

    - name: "Seed a rule file of an older layout the role must remove"
      ansible.builtin.copy:
        dest: "/etc/prometheus/rules/instances.rules"
        content: |
          groups:
            - name: "stale"
              rules:
                - alert: "Stale"
                  expr: "vector(1)"
        mode: "0644"
