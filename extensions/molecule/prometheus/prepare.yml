- name: "Prepare: firewalld stack on RHEL; setuptools for pip"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Install EPEL + firewalld + python3-firewall on RHEL family"
      ansible.builtin.package:
        name:
          - "epel-release"
          - "firewalld"
          - "python3-firewall"
        state: "present"
      when: "ansible_os_family == 'RedHat'"

    - name: "Start firewalld on RHEL family"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      when: "ansible_os_family == 'RedHat'"

    - name: "Refresh apt cache on Debian family"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: "ansible_os_family == 'Debian'"
