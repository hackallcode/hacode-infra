# headscale scenario: prepare installs docker (vfs storage for DinD), converge runs
# headscale with a policy, a user and an extra DERP region; verify checks health,
# the user, preauth keys and pinning a node address.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

provisioner:
  name: "ansible"
  inventory:
    group_vars:
      all:
        headscale_server_url: "http://127.0.0.1:8090"
        headscale_noise_private_key: "{{ '0' * 63 ~ '1' }}"
        headscale_base_domain: "ts.example.com"
        headscale_derp_region_id: 900
        headscale_derp_region_code: "test"
        headscale_derp_region_name: "Test"
        headscale_derp_regions:
          901:
            regionid: 901
            regioncode: "extra"
            regionname: "Extra"
            nodes:
              - name: "901a"
                regionid: 901
                hostname: "derp.example.com"
                stunport: 3478
        headscale_users: ["molecule"]
        headscale_initial_policy:
          tagOwners:
            "tag:server": ["molecule@"]
          acls:
            - {action: "accept", src: ["*"], dst: ["*:*"]}
        # Nothing listens there: headscale has to start without its provider.
        headscale_oidc:
          issuer: "http://127.0.0.1:9/oidc"
          client_id: "headscale"
          client_secret: "molecule"
