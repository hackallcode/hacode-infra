# headscale scenario: prepare installs docker (vfs storage for DinD), converge runs
# headscale with a policy, a user and an extra DERP region; verify checks health,
# the user, preauth keys and pinning a node address.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
