- name: "Verify: app role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Content dir was created on the remote"
      ansible.builtin.stat:
        path: "/opt/molecule-static"
      register: "content_dir"
      failed_when: "not content_dir.stat.isdir"

    - name: "A nested source dir named like a data path was synced"
      ansible.builtin.stat:
        path: "/opt/molecule-static/src/data/keep.txt"
      register: "nested_data_named"
      failed_when: "not nested_data_named.stat.exists"

    - name: "Source files were synced to the remote"
      ansible.builtin.stat:
        path: "/opt/molecule-static/index.html"
      register: "index_html"
      failed_when: "not index_html.stat.exists"

    # Every platform fetches into one dir; match this host's archive.
    - name: "Locate the fetched backup archive on the controller"
      ansible.builtin.find:
        paths: "/tmp/molecule-app-backups"
        patterns: "*_{{ inventory_hostname }}_*.tar.gz"
      register: "app_backup_found"
      delegate_to: "localhost"
      become: false
      failed_when: "app_backup_found.files | length != 1"

    - name: "List what the archive actually contains"
      ansible.builtin.command:
        argv: ["tar", "-tzf", "{{ app_backup_found.files[0].path }}"]
      register: "app_backup_members"
      changed_when: false
      delegate_to: "localhost"
      become: false

    - name: "Excluded names are absent and the wanted data is present"
      ansible.builtin.assert:
        that:
          # present: guards against an exclude list that drops everything
          - "'data/important.db' in _members"
          - "'data/uploads/photo.bin' in _members"
          # app_global_exclude, at the archive root
          - "'data/log/app.log' not in _members"
          - "'data/.git/objects/abc' not in _members"
          # and at any depth below it
          - "'data/deep/nested/log/deep.log' not in _members"
          # app_exclude_paths, a multi-segment path
          - "'data/config/backups/old.tar.gz' not in _members"
        fail_msg: >-
          Archive contents are wrong. Members: {{ _members }}
      vars:
        _members: "{{ app_backup_members.stdout_lines | map('regex_replace', '/$', '') | list }}"

- name: "Verify: app restore"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    app_data_paths: ["data"]
    app_exclude_paths: ["config/backups"]
    app_backup_local_dir: "/tmp/molecule-app-backups"

  tasks:
    - name: "Find the owner ids backup recorded beside the archive"
      ansible.builtin.find:
        paths: "/tmp/molecule-app-backups"
        patterns: "*_{{ inventory_hostname }}_*.owner"
      register: "app_owner_files"
      delegate_to: "localhost"
      become: false
      failed_when: "app_owner_files.files | length != 1"

    # A same-host round trip never remaps: pretend the source owner was 55556.
    - name: "Pretend the archive came from a host where the owner was 55556"
      ansible.builtin.copy:
        dest: "{{ app_owner_files.files[0].path }}"
        content: '{"uid": 55556, "gid": 55556}'
        mode: "0600"
      delegate_to: "localhost"
      become: false

    - name: "Lose the data dir"
      ansible.builtin.file:
        path: "/opt/molecule-static/data"
        state: "absent"

    - name: "Run the restore entrypoint"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "restore.yml"

    - name: "Read a restored file"
      ansible.builtin.slurp:
        src: "/opt/molecule-static/data/uploads/photo.bin"
      register: "restored_photo"

    - name: "The backed up data is back"
      ansible.builtin.assert:
        that:
          - "(restored_photo.content | b64decode) == 'x\n'"

    - name: "Stat the files archived under foreign ids"
      ansible.builtin.stat:
        path: "/opt/molecule-static/data/{{ item }}"
      register: "restored_ids"
      loop: ["container.db", "from-source-owner.txt"]

    - name: "Container data keeps its id, the source owner's file moves"
      ansible.builtin.assert:
        that:
          - "_by_name['container.db'].uid == 55555"
          - "_by_name['container.db'].gid == 55555"
          - "_by_name['from-source-owner.txt'].uid == (app_dir_owner | int)"
          - "_by_name['from-source-owner.txt'].gid == (app_dir_group | int)"
        fail_msg: "Ownership after restore: {{ _by_name }}"
      vars:
        _by_name: >-
          {{ dict(restored_ids.results | map(attribute='item')
                  | zip(restored_ids.results | map(attribute='stat'))) }}

# Restores that skip the ownership fix-up: no recorded ids, no data paths.
- name: "Verify: app restore without recorded ids"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    app_data_paths: ["data"]
    app_exclude_paths: ["config/backups"]
    app_backup_local_dir: "/tmp/molecule-app-backups"

  tasks:
    - name: "Drop the recorded ids, as an older archive has none"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop: "{{ query('ansible.builtin.fileglob', '/tmp/molecule-app-backups/*_' ~ inventory_hostname ~ '_*.owner') }}"
      delegate_to: "localhost"
      become: false

    - name: "Lose the data dir again"
      ansible.builtin.file:
        path: "/opt/molecule-static/data"
        state: "absent"

    - name: "Run the restore entrypoint with no recorded ids"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "restore.yml"

    - name: "Stat the file archived under the source owner's id"
      ansible.builtin.stat:
        path: "/opt/molecule-static/data/from-source-owner.txt"
      register: "unmapped_owner"

    - name: "Its archived id is kept as it is"
      ansible.builtin.assert:
        that:
          - "unmapped_owner.stat.exists"
          - "unmapped_owner.stat.uid == 55556"

    - name: "Run the restore entrypoint for an app with no data paths"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "restore.yml"
      vars:
        app_data_paths: []
