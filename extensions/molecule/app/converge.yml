- name: "Converge: app role (static deployment)"
  hosts: "all"
  become: true
  gather_facts: true

  roles:
    - role: "hacode.infra.app"

# `src/data` in the sources is code, not the app's data path.
- name: "Converge: upload with a data path named like a nested source dir"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    app_data_paths: ["data"]

  tasks:
    - name: "Run the upload entrypoint"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "upload.yml"

# One of each case the backup's exclude lists must drop, plus keepers.
- name: "Converge: back up a data dir that carries junk"
  hosts: "all"
  become: true
  gather_facts: true

  vars:
    app_data_paths: ["data"]
    app_exclude_paths: ["config/backups"]
    app_backup_local_dir: "/tmp/molecule-app-backups"

  tasks:
    - name: "Create the data tree, junk and keepers alike"
      ansible.builtin.file:
        path: "/opt/molecule-static/{{ item }}"
        state: "directory"
        mode: "0755"
      loop:
        - "data/uploads"
        - "data/log"
        - "data/.git/objects"
        - "data/deep/nested/log"
        - "data/config/backups"

    - name: "Fill it"
      ansible.builtin.copy:
        dest: "/opt/molecule-static/{{ item }}"
        content: "x\n"
        mode: "0644"
      loop:
        # kept
        - "data/important.db"
        - "data/uploads/photo.bin"
        # dropped by app_global_exclude, at the archive root and below it
        - "data/log/app.log"
        - "data/.git/objects/abc"
        - "data/deep/nested/log/deep.log"
        # dropped by app_exclude_paths, a multi-segment path
        - "data/config/backups/old.tar.gz"

    # 55555 stands in for container data, 55556 for the source host's app
    # owner; no account has either id.
    - name: "Add files under foreign numeric ids"
      ansible.builtin.copy:
        dest: "/opt/molecule-static/{{ item.path }}"
        content: "x\n"
        owner: "{{ item.id }}"
        group: "{{ item.id }}"
        mode: "0644"
      loop:
        - {path: "data/container.db", id: "55555"}
        - {path: "data/from-source-owner.txt", id: "55556"}
      loop_control:
        label: "{{ item.path }}"

    - name: "Run the backup entrypoint"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "backup.yml"
