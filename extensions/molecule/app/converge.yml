- name: "Converge: app role (static deployment)"
  hosts: "all"
  become: true
  gather_facts: true

  roles:
    - role: "hacode.infra.app"

# `app_data_paths` are excluded from the upload, but only at the content
# dir's root: `src/data` in the sources is code, not the app's data.
- name: "Converge: upload with a data path named like a nested source dir"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    app_data_paths: ["data"]

  tasks:
    - name: "Run the upload entrypoint"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "upload.yml"

# The backup archive's contents are the whole point of `app_exclude_paths`
# and `app_global_exclude`, and nothing exercised them: `exclude_path` alone
# silently matched nothing, so every archive carried caches, `.git` and the
# app's own backups. Plant a data dir that holds one of each, back it up,
# and let verify read the archive.
- name: "Converge: back up a data dir that carries junk"
  hosts: "all"
  become: true
  gather_facts: true

  vars:
    app_data_paths: ["data"]
    app_exclude_paths: ["config/backups"]
    app_backup_local_dir: "/tmp/molecule-app-backups"

  tasks:
    - name: "Create the data tree, junk and keepers alike"
      ansible.builtin.file:
        path: "/opt/molecule-static/{{ item }}"
        state: "directory"
        mode: "0755"
      loop:
        - "data/uploads"
        - "data/log"
        - "data/.git/objects"
        - "data/deep/nested/log"
        - "data/config/backups"

    - name: "Fill it"
      ansible.builtin.copy:
        dest: "/opt/molecule-static/{{ item }}"
        content: "x\n"
        mode: "0644"
      loop:
        # kept
        - "data/important.db"
        - "data/uploads/photo.bin"
        # dropped by app_global_exclude, at the archive root and below it
        - "data/log/app.log"
        - "data/.git/objects/abc"
        - "data/deep/nested/log/deep.log"
        # dropped by app_exclude_paths, a multi-segment path
        - "data/config/backups/old.tar.gz"

    # Two files under ids no account on these images has, so the restore
    # has to tell them apart by the recorded owner and not by whether a
    # user exists: 55555 stands in for container data (mysql's 999 and the
    # like), 55556 for the app's owner on the host the archive came from.
    - name: "Add files under foreign numeric ids"
      ansible.builtin.copy:
        dest: "/opt/molecule-static/{{ item.path }}"
        content: "x\n"
        owner: "{{ item.id }}"
        group: "{{ item.id }}"
        mode: "0644"
      loop:
        - {path: "data/container.db", id: "55555"}
        - {path: "data/from-source-owner.txt", id: "55556"}
      loop_control:
        label: "{{ item.path }}"

    - name: "Run the backup entrypoint"
      ansible.builtin.include_role:
        name: "hacode.infra.app"
        tasks_from: "backup.yml"
