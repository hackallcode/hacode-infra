# docker scenario: full install — adds the upstream docker-ce repository,
# installs docker-ce + containerd + compose plugin, loads kernel modules
# (failures tolerated by the role), applies sysctls, and enables the daemon.
# Daemon-start is best-effort under nested cgroups — converge has a rescue
# block that surfaces journalctl logs if dockerd refuses to come up.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

verifier:
  name: "ansible"
