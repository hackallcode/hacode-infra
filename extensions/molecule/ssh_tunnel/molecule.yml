# ssh_tunnel scenario. The role renders a systemd unit that runs `ssh -N`;
# we don't actually exec ssh to a real remote in CI — the verify step
# checks that the unit file is rendered and is enabled. `enabled: true`
# implies the unit was loaded successfully by systemd, which already
# validates its syntax.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

provisioner:
  name: "ansible"
  inventory:
    group_vars:
      all:
        ssh_tunnels:
          - name: "ci-forward-only"
            remote_user: "ci"
            remote_host: "127.0.0.1"
            forward_port: 18080
          - name: "ci-reverse-only"
            remote_user: "ci"
            remote_host: "127.0.0.1"
            reverse_port: 18081
          - name: "ci-explicit"
            remote_user: "ci"
            remote_host: "127.0.0.1"
            forwards:
              - {type: "local", bind_port: 18082, host: "127.0.0.1", port: 22}
              - {type: "remote", bind_address: "127.0.0.1", bind_port: 18083, host: "127.0.0.1", port: 22}
              - {type: "remote", bind_port: 18084}
              - {type: "dynamic", bind_address: "127.0.0.1", bind_port: 18085}
          - name: "ci-as-user"
            user: "ci-tunnel"
            identity_file: ".ssh/id_ed25519"
            remote_user: "ci"
            remote_host: "127.0.0.1"
            forwards:
              - {type: "remote", bind_address: "127.0.0.1", bind_port: 18086, host: "127.0.0.1", port: 22}

verifier:
  name: "ansible"
