- name: "Verify: ssh_tunnel role"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    expected_units:
      - "ci-forward-only"
      - "ci-reverse-only"
      - "ci-explicit"
      - "ci-as-user"

  tasks:
    - name: "Service unit files are rendered"
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}.service"
      register: "unit_stat"
      failed_when: "not unit_stat.stat.exists"
      loop: "{{ expected_units }}"

    - name: "Forward-only unit binds -D and not -R"
      ansible.builtin.command: "grep '^ExecStart=' /etc/systemd/system/ci-forward-only.service"
      register: "fwd_exec"
      changed_when: false
      failed_when:
        - "'-D 0.0.0.0:18080' not in fwd_exec.stdout"
        - "'-R ' in fwd_exec.stdout"

    - name: "Reverse-only unit binds -R and not -D"
      ansible.builtin.command: "grep '^ExecStart=' /etc/systemd/system/ci-reverse-only.service"
      register: "rev_exec"
      changed_when: false
      failed_when:
        - "'-R 0.0.0.0:18081' not in rev_exec.stdout"
        - "'-D ' in rev_exec.stdout"

    - name: "Explicit forwards render in order with bind address and target"
      ansible.builtin.command: "grep '^ExecStart=' /etc/systemd/system/ci-explicit.service"
      register: "explicit_exec"
      changed_when: false
      failed_when: >-
        ' -L 18082:127.0.0.1:22 -R 127.0.0.1:18083:127.0.0.1:22 -R 18084 -D 127.0.0.1:18085 ci@127.0.0.1'
        not in explicit_exec.stdout

    - name: "Root units keep User=root and root's known_hosts"
      ansible.builtin.command: "grep -E '^(User|ExecStart)=' /etc/systemd/system/ci-explicit.service"
      register: "root_unit"
      changed_when: false
      failed_when: >-
        'User=root' not in root_unit.stdout_lines
        or '-o UserKnownHostsFile=/root/.ssh/known_hosts -o ExitOnForwardFailure=yes' not in root_unit.stdout
        or 'IdentityFile' in root_unit.stdout

    - name: "User unit runs as that user with its home's known_hosts and key"
      ansible.builtin.command: "grep -E '^(User|ExecStart)=' /etc/systemd/system/ci-as-user.service"
      register: "user_unit"
      changed_when: false
      failed_when: >-
        'User=ci-tunnel' not in user_unit.stdout_lines
        or ('-o UserKnownHostsFile=/var/lib/ci-tunnel/.ssh/known_hosts'
            ~ ' -o IdentityFile=/var/lib/ci-tunnel/.ssh/id_ed25519 -o IdentitiesOnly=yes')
           not in user_unit.stdout

    - name: "Units are enabled"  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled {{ item }}.service"
      register: "enabled_check"
      changed_when: false
      failed_when: "enabled_check.stdout.strip() != 'enabled'"
      loop: "{{ expected_units }}"

# Plant a key for root and for the non-root tunnel user, back up, lose both
# ~/.ssh dirs, restore: the keys come back owned by their users, and
# authorized_keys (inbound access, not the tunnel's) stays out of it.
- name: "Verify: ssh_tunnel key backup round trip"
  hosts: "all"
  become: true
  gather_facts: false

  vars:
    ssh_tunnel_backup_local_dir: "/tmp/molecule-ssh-tunnel-backups"
    _homes:
      root: "/root"
      ci-tunnel: "/var/lib/ci-tunnel"

  tasks:
    - name: "Create ~/.ssh for both users"
      ansible.builtin.file:
        path: "{{ item.value }}/.ssh"
        state: "directory"
        owner: "{{ item.key }}"
        mode: "0700"
      loop: "{{ _homes | dict2items }}"

    - name: "Plant a private key and an authorized_keys for both users"
      ansible.builtin.copy:
        dest: "{{ item.0.value }}/.ssh/{{ item.1 }}"
        content: "{{ item.0.key }} {{ item.1 }}\n"
        owner: "{{ item.0.key }}"
        mode: "0600"
      loop: "{{ _homes | dict2items | product(['id_ed25519', 'authorized_keys']) | list }}"

    - name: "Run backup"
      ansible.builtin.include_role:
        name: "hacode.infra.ssh_tunnel"
        tasks_from: "backup"

    - name: "Lose both ~/.ssh dirs"
      ansible.builtin.file:
        path: "{{ item.value }}/.ssh"
        state: "absent"
      loop: "{{ _homes | dict2items }}"

    - name: "Run restore"
      ansible.builtin.include_role:
        name: "hacode.infra.ssh_tunnel"
        tasks_from: "restore"

    - name: "Read the restored keys"
      ansible.builtin.slurp:
        src: "{{ item.value }}/.ssh/id_ed25519"
      loop: "{{ _homes | dict2items }}"
      register: "restored_keys"

    - name: "Stat the restored keys"
      ansible.builtin.stat:
        path: "{{ item.value }}/.ssh/id_ed25519"
      loop: "{{ _homes | dict2items }}"
      register: "restored_stat"

    - name: "Stat authorized_keys"
      ansible.builtin.stat:
        path: "{{ item.value }}/.ssh/authorized_keys"
      loop: "{{ _homes | dict2items }}"
      register: "restored_authorized"

    - name: "Keys are back and owned by their users; authorized_keys is not"
      ansible.builtin.assert:
        that:
          - "(item.0.content | b64decode) == item.0.item.key ~ ' id_ed25519\n'"
          - "item.1.stat.pw_name == item.0.item.key"
          - "not item.2.stat.exists"
      loop: "{{ restored_keys.results | zip(restored_stat.results, restored_authorized.results) | list }}"
      loop_control:
        label: "{{ item.0.item.key }}"
