# Verify runs entirely on the controller: every observable side effect
# of the role lives there (saved token file) or in the cluster reachable
# via the kubeconfig (helm release, namespace, RBAC).

- name: "Verify: k8s_addons role"
  hosts: "localhost"
  connection: "local"
  gather_facts: false

  vars:
    _kubeconfig: "/tmp/molecule-k3s-kubeconfig/almalinux10.yaml"

  tasks:
    - name: "Headlamp admin token file exists next to kubeconfig"
      ansible.builtin.stat:
        path: "/tmp/molecule-k3s-kubeconfig/almalinux10-headlamp-token.txt"
      register: "_token_stat"
      failed_when: >-
        not _token_stat.stat.exists
        or _token_stat.stat.size == 0
        or _token_stat.stat.mode != '0600'

    - name: "Helm release `headlamp` is deployed"
      kubernetes.core.helm_info:
        kubeconfig: "{{ _kubeconfig }}"
        name: "headlamp"
        release_namespace: "headlamp"
      register: "_helm_release"
      failed_when: >-
        (_helm_release.status is not defined)
        or (_helm_release.status.status | default('')) != 'deployed'

    - name: "Namespace `headlamp` exists"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: "v1"
        kind: "Namespace"
        name: "headlamp"
      register: "_ns_info"
      failed_when: "(_ns_info.resources | length) == 0"

    - name: "ClusterRoleBinding `headlamp-admin` points at cluster-admin"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: "rbac.authorization.k8s.io/v1"
        kind: "ClusterRoleBinding"
        name: "headlamp-admin"
      register: "_crb_info"
      failed_when: >-
        (_crb_info.resources | length) == 0
        or _crb_info.resources[0].roleRef.name != 'cluster-admin'

    - name: "Gateway Envoy ConfigMap exists"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: "v1"
        kind: "ConfigMap"
        name: "gateway-envoy-config"
        namespace: "gateway-envoy"
      register: "_gateway_envoy_configmap"
      failed_when: >-
        (_gateway_envoy_configmap.resources | length) == 0
        or 'static_resources' not in
        (_gateway_envoy_configmap.resources[0].data['envoy.yaml'] | default(''))

    - name: "Gateway Envoy Service points at the http target port"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: "v1"
        kind: "Service"
        name: "gateway-envoy"
        namespace: "gateway-envoy"
      register: "_gateway_envoy_service"
      failed_when: >-
        (_gateway_envoy_service.resources | length) == 0
        or (_gateway_envoy_service.resources[0].spec.ports[0].port | int) != 8080
        or _gateway_envoy_service.resources[0].spec.ports[0].targetPort != 'http'

    - name: "Gateway Envoy Deployment is ready"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: "apps/v1"
        kind: "Deployment"
        name: "gateway-envoy"
        namespace: "gateway-envoy"
      register: "_gateway_envoy_deployment"
      failed_when: >-
        (_gateway_envoy_deployment.resources | length) == 0
        or
        (_gateway_envoy_deployment.resources[0].status.readyReplicas
         | default(0) | int) != 1
