# Converge runs in two plays:
# 1. On the target container: bootstrap a single-node k3s cluster and
#    fetch the kubeconfig back to /tmp/molecule-k3s-kubeconfig/ on the
#    controller (k3s role's default behaviour given the group_vars in
#    molecule.yml).
# 2. On the controller: invoke k8s_addons against the fetched
#    kubeconfig. The role itself uses delegate_to: localhost +
#    run_once: true on every task, so it could also be included from
#    the play above - but routing through `hosts: localhost` makes the
#    intent more obvious.

- name: "Converge: bootstrap k3s on target"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Run the k3s role"
      block:
        - ansible.builtin.include_role:
            name: "hacode.infra.k3s"
      rescue:
        - name: "Surface kubelet logs (nested cgroups can break startup)"
          ansible.builtin.command: "journalctl -u k3s --no-pager -n 200"
          register: "k3s_journal"
          changed_when: false
          failed_when: false

        - name: "Print journal tail"
          ansible.builtin.debug:
            var: "k3s_journal.stdout_lines"

- name: "Converge: rewrite kubeconfig server URL for controller access"
  hosts: "localhost"
  connection: "local"
  gather_facts: false

  tasks:
    # The k3s role builds the server URL from `hostvars[primary].ansible_host`,
    # which here is the container name (`almalinux10`). Helm running on the
    # controller can't resolve that; rewrite to localhost (the apiserver
    # port is forwarded via `published_ports` in molecule.yml). k3s's
    # default apiserver TLS SAN already includes 127.0.0.1.
    - name: "Patch kubeconfig server URL → 127.0.0.1"
      ansible.builtin.replace:
        path: "/tmp/molecule-k3s-kubeconfig/almalinux10.yaml"
        regexp: "https://almalinux10:6443"
        replace: "https://127.0.0.1:6443"

# Offline chart smoke-tests for addons that aren't installed into the
# molecule cluster. `helm template` renders the chart against the
# role's default values and surfaces:
#   * stringified-scalar / wrong-key / wrong-nesting regressions when
#     the chart ships a values.schema.json (Cilium does; Longhorn 1.7.x
#     doesn't — see comment on the Longhorn block).
#   * Jinja-template / manifest-structure breakage on any chart.
#   * Sanity-assert mismatches if the rendered output is missing a
#     resource we expect (e.g. the manager DaemonSet).
# Runs entirely on the controller — no cluster contact — so it's cheap
# and version-independent of the Ansible jinja2-native default (which
# on 2.18+ hides the stringified-scalar bug locally).
#
# Runs BEFORE the Headlamp install play: those plays share `hosts:
# localhost`, so if Headlamp ever fails (chart_timeout exhausted on a
# slow CI runner, etc.) Ansible would mark localhost failed and skip
# subsequent plays — losing offline-smoke coverage entirely.
- name: "Converge: smoke-test Cilium chart values offline (helm template)"
  hosts: "localhost"
  connection: "local"
  gather_facts: false

  tasks:
    - name: "Add cilium helm repo on the controller"
      kubernetes.core.helm_repository:
        name: "cilium"
        repo_url: "https://helm.cilium.io"

    - name: "Render Cilium values via the role's shared values task"
      ansible.builtin.import_role:
        name: "hacode.infra.k8s_addons"
        tasks_from: "cilium-values"

    - name: "Write rendered values to a temp file for `helm template`"
      ansible.builtin.copy:
        content: "{{ _cilium_helm_values | to_nice_yaml(indent=2) }}"
        dest: "/tmp/molecule-cilium-values.yml"
        mode: "0644"

    - name: "Render cilium chart offline and validate against values.schema.json"
      ansible.builtin.command:
        argv:
          - "helm"
          - "template"
          - "cilium"
          - "cilium/cilium"
          - "--version"
          - "{{ k8s_addons_cilium_chart_version }}"
          - "--namespace"
          - "{{ k8s_addons_cilium_namespace }}"
          - "--values"
          - "/tmp/molecule-cilium-values.yml"
      register: "_cilium_template"
      changed_when: false

    - name: "Sanity-check: rendered output includes a DaemonSet named `cilium`"
      ansible.builtin.assert:
        that:
          # Parse the multi-doc YAML and look for a document that's
          # explicitly the cilium agent DaemonSet (substring `name: cilium`
          # would also match `name: cilium-config`, `name: cilium-operator`,
          # `app.kubernetes.io/name: cilium-agent`, etc.).
          - >-
            (_cilium_template.stdout
             | from_yaml_all
             | reject('none')
             | selectattr('kind', 'eq', 'DaemonSet')
             | selectattr('metadata.name', 'eq', 'cilium')
             | list | length) > 0
        fail_msg: >-
          `helm template cilium/cilium` ran without error but the output
          doesn't contain a `DaemonSet/cilium` — chart layout may have
          changed in version `{{ k8s_addons_cilium_chart_version }}`.

- name: "Converge: smoke-test Longhorn chart values offline (helm template)"
  hosts: "localhost"
  connection: "local"
  gather_facts: false

  tasks:
    - name: "Add longhorn helm repo on the controller"
      kubernetes.core.helm_repository:
        name: "longhorn"
        repo_url: "https://charts.longhorn.io"

    - name: "Render Longhorn values via the role's shared values task"
      ansible.builtin.import_role:
        name: "hacode.infra.k8s_addons"
        tasks_from: "longhorn-values"

    - name: "Write rendered values to a temp file for `helm template`"
      ansible.builtin.copy:
        content: "{{ _longhorn_helm_values | to_nice_yaml(indent=2) }}"
        dest: "/tmp/molecule-longhorn-values.yml"
        mode: "0644"

    - name: "Render longhorn chart offline"
      ansible.builtin.command:
        argv:
          - "helm"
          - "template"
          - "longhorn"
          - "longhorn/longhorn"
          - "--version"
          - "{{ k8s_addons_longhorn_chart_version }}"
          - "--namespace"
          - "{{ k8s_addons_longhorn_namespace }}"
          - "--values"
          - "/tmp/molecule-longhorn-values.yml"
      register: "_longhorn_template"
      changed_when: false

    - name: "Sanity-check: rendered output reflects role's defaults"
      ansible.builtin.assert:
        that:
          # Parse multi-doc YAML and require an explicit
          # `DaemonSet/longhorn-manager` (substring match for
          # `kind: DaemonSet` + `longhorn-manager` could false-positive
          # on labels / ConfigMap entries / Deployments named alike).
          - >-
            (_longhorn_template.stdout
             | from_yaml_all
             | reject('none')
             | selectattr('kind', 'eq', 'DaemonSet')
             | selectattr('metadata.name', 'eq', 'longhorn-manager')
             | list | length) > 0
          # `defaultClass: true` must reach the StorageClass annotation.
          - >-
            'storageclass.kubernetes.io/is-default-class: "true"'
            in _longhorn_template.stdout
          # `defaultClassReplicaCount: 1` must reach the StorageClass.
          - "'numberOfReplicas: \"1\"' in _longhorn_template.stdout"
        fail_msg: >-
          `helm template longhorn/longhorn` ran without error but the
          rendered output is missing expected resources / values — chart
          layout or value-key mapping may have changed in version
          `{{ k8s_addons_longhorn_chart_version }}`.

- name: "Converge: install Headlamp via k8s_addons"
  hosts: "localhost"
  connection: "local"
  gather_facts: false

  tasks:
    - name: "Include k8s_addons role"
      ansible.builtin.include_role:
        name: "hacode.infra.k8s_addons"
      vars:
        k8s_addons_kubeconfig: "/tmp/molecule-k3s-kubeconfig/almalinux10.yaml"
        k8s_addons_headlamp_enabled: true
        k8s_addons_kube_state_metrics_enabled: true
        k8s_addons_envoy_gateway_enabled: true
        # Fixed NodePort so verify can assert a deterministic value on the
        # controller-provisioned data-plane Service.
        k8s_addons_envoy_gateway_node_ports:
          http: 30080
        # Constrained CI runners need more than the default 5m for the
        # Headlamp/KSM pods and the Envoy Gateway control plane to become Ready.
        k8s_addons_headlamp_chart_timeout: "15m0s"
        k8s_addons_kube_state_metrics_chart_timeout: "15m0s"
        k8s_addons_envoy_gateway_chart_timeout: "15m0s"
