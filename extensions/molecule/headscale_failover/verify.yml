- name: "Verify: etcd and the failover agent"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "The member is healthy over TLS"
      ansible.builtin.command:
        argv: ["/usr/local/sbin/etcdctl-local", "endpoint", "health"]
      changed_when: false

    - name: "The member does not answer without a client certificate"
      ansible.builtin.uri:
        url: "https://127.0.0.1:2379/health"
        validate_certs: false
        status_code: [-1, 400, 401, 403]
      register: "anonymous"
      failed_when: "anonymous.status == 200"

    - name: "The agent config carries the election settings"
      ansible.builtin.slurp:
        src: "/etc/headscale-failover/config.json"
      register: "agent_config"
      failed_when: >-
        (agent_config.content | b64decode | from_json).server_name != 'hs.example.com'
        or (agent_config.content | b64decode | from_json).etcd.endpoints != ['https://127.0.0.1:2379']

    - name: "The agent service is running"
      ansible.builtin.systemd:
        name: "headscale-failover.service"
      register: "agent_service"
      failed_when: "agent_service.status.ActiveState != 'active'"
      changed_when: false

    - name: "Copy the agent tests in"
      ansible.builtin.copy:
        src: "test_agent.py"
        dest: "/root/test_agent.py"
        mode: "0644"

    - name: "The agent passes its tests against etcd"
      ansible.builtin.command: "python3 /root/test_agent.py /usr/local/bin/headscale-failover"
      environment:
        ETCD_BIN: "/usr/local/bin/etcd"
      changed_when: false
