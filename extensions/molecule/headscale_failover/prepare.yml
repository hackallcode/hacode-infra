- name: "Prepare: a CA for etcd"
  hosts: "localhost"
  gather_facts: false

  tasks:
    - name: "Create the CA dir"
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca"
        state: "directory"
        mode: "0700"

    - name: "Create the CA key"
      community.crypto.openssl_privatekey:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca/ca.key"
        type: "ECC"
        curve: "secp256r1"

    - name: "Create the CA request"
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca/ca.key"
        common_name: "molecule etcd CA"
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: ["keyCertSign", "cRLSign"]
        key_usage_critical: true
      register: "ca_csr"

    - name: "Self-sign the CA"
      community.crypto.x509_certificate:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca/ca.crt"
        csr_content: "{{ ca_csr.csr }}"
        privatekey_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca/ca.key"
        provider: "selfsigned"

- name: "Prepare: what the etcd role needs on the host"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Install python3-cryptography (dnf)"
      ansible.builtin.dnf:
        name: "python3-cryptography"
        state: "present"
      when: "ansible_facts.os_family == 'RedHat'"

    - name: "Install python3-cryptography (apt)"
      ansible.builtin.apt:
        name: "python3-cryptography"
        state: "present"
        update_cache: true
      when: "ansible_facts.os_family == 'Debian'"
