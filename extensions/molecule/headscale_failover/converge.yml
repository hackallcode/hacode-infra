- name: "Converge: an etcd member and the failover agent role"
  hosts: "all"
  become: true
  gather_facts: true
  vars:
    ca_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/etcd-ca"

  tasks:
    - name: "Run one etcd member"
      ansible.builtin.import_role:
        name: "hacode.infra.etcd"
      vars:
        etcd_name: "molecule"
        etcd_address: "127.0.0.1"
        etcd_members: [{name: "molecule", address: "127.0.0.1"}]
        etcd_ca_key: "{{ lookup('ansible.builtin.file', ca_dir ~ '/ca.key') }}"
        etcd_ca_cert: "{{ lookup('ansible.builtin.file', ca_dir ~ '/ca.crt') }}"

    # The token and the server name are fakes: the agent leads, finds no snapshot in etcd
    # and keeps headscale down; its Cloudflare error just loops. test_agent.py covers the rest.
    - name: "Run the failover agent role"
      ansible.builtin.import_role:
        name: "hacode.infra.headscale_failover"
      vars:
        headscale_failover_self_ip: "127.0.0.1"
        headscale_failover_server_name: "hs.example.com"
        headscale_failover_zone: "example.com"
        headscale_failover_cloudflare_token: "molecule-token"
        headscale_failover_etcd_endpoints: ["https://127.0.0.1:2379"]
