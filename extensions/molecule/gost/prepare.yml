- name: "Prepare: ensure firewalld is present on RHEL (the role reloads it)"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Install firewalld on RHEL family"
      ansible.builtin.package:
        name: "firewalld"
        state: "present"
      when: "ansible_os_family == 'RedHat'"

    - name: "Start firewalld on RHEL family"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      when: "ansible_os_family == 'RedHat'"
