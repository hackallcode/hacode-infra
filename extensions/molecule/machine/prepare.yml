# Install bare-minimum services the role assumes are already present
# (openssh-server, sudo) on the raw upstream images.
- name: "Prepare RHEL-family hosts"
  hosts: "all"
  become: true
  gather_facts: true
  tasks:
    - name: "Install sshd, sudo and cronie on RHEL family"
      ansible.builtin.dnf:
        name:
          - "openssh-server"
          - "sudo"
          - "cronie" # ships /usr/bin/crontab, which the cron subrole needs
        state: "present"
      when: "ansible_os_family == 'RedHat'"

    - name: "Generate host keys on RHEL family"
      ansible.builtin.command: "ssh-keygen -A"
      args:
        creates: "/etc/ssh/ssh_host_rsa_key"
      when: "ansible_os_family == 'RedHat'"

    - name: "Ensure sshd config exists on RHEL family"
      ansible.builtin.copy:
        dest: "/etc/ssh/sshd_config"
        content: |
          PermitRootLogin yes
          PasswordAuthentication yes
        mode: "0600"
        force: false
      when: "ansible_os_family == 'RedHat'"

    - name: "Install sshd, sudo and cron on Debian family"
      ansible.builtin.apt:
        name:
          - "openssh-server"
          - "sudo"
          - "cron" # ships /usr/bin/crontab, which the cron subrole needs
        state: "present"
        update_cache: true
      when: "ansible_os_family == 'Debian'"

    # `netplan apply` needs a real backend + interfaces the container lacks.
    # Stub it (earlier on sudo's secure_path than any real /usr/sbin/netplan)
    # so it records the call and mimics the NetworkManager backend consuming
    # the source file on apply — the case the netplan subrole's shadow-state
    # idempotency has to survive.
    - name: "Ensure /etc/netplan exists on Debian family"
      ansible.builtin.file:
        path: "/etc/netplan"
        state: "directory"
        mode: "0755"
      when: "ansible_os_family == 'Debian'"

    - name: "Stub netplan on Debian family"
      ansible.builtin.copy:
        dest: "/usr/local/sbin/netplan"
        mode: "0755"
        content: |
          #!/bin/sh
          echo "$@" >> /tmp/netplan-apply.log
          [ "$1" = "apply" ] && rm -f /etc/netplan/95-molecule.yaml
          exit 0
      when: "ansible_os_family == 'Debian'"
