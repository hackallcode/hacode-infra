# Smoke-test scenario for the machine role. Only the lightweight subroles are
# exercised here (users, ssh, system, journald) — the package upgrade, swap,
# selinux, firewall, dns, fail2ban, docker, cockpit, nvidia, raspberry and
# reboot subroles are toggled off because they are either non-deterministic
# (latest-package churn) or require real hardware / kernel features that a CI
# container can't provide. `claude_code` is the one heavier subrole that stays
# on, and only on the EL platforms — see the toggle's comment below.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

provisioner:
  name: "ansible"
  inventory:
    group_vars:
      all:
        # ansible_host is left unset — the community.docker connection plugin
        # uses it to identify the container, so it must equal inventory_hostname.
        # The /etc/hosts line the role writes will read e.g. "almalinux10
        # molecule-test", which is harmless inside the test container.

        machine_users_enabled: true
        machine_ssh_enabled: true
        machine_system_enabled: true
        machine_journald_enabled: true

        machine_swap_enabled: false
        machine_packages_enabled: false
        machine_zsh_enabled: false
        machine_firewall_enabled: false
        machine_selinux_enabled: false
        machine_raspberry_enabled: false
        machine_fail2ban_enabled: false
        machine_dns_enabled: false
        machine_docker_enabled: false
        machine_chrony_enabled: false
        machine_cockpit_enabled: false
        machine_nvidia_enabled: false
        machine_reboot_enabled: false

        # On EL the subrole decides how to get Node.js from the distribution:
        # the `nodejs:20` module stream up to EL9, plain packages on EL10,
        # where enabling a stream fails the play outright. The EL10 platforms
        # here are what keeps that branch honest. Left off on Debian/Ubuntu,
        # whose distro nodejs is older than the CLI's engine requirement, so a
        # global install there would prove nothing. `codex` stays off too — its
        # Node.js steps are the same tasks with a different npm package.
        machine_claude_code_enabled: "{{ ansible_os_family == 'RedHat' }}"

        # tmpfs sidesteps the need for a real block device in the
        # docker driver while still exercising the fstab + mount logic.
        machine_disks_enabled: true
        machine_disks:
          - src: "tmpfs"
            path: "/mnt/molecule-disk"
            fstype: "tmpfs"
            opts: "size=8M,mode=0755"
            passno: 0

        # The subrole is Debian-gated (RHEL platforms skip the whole block
        # via `ansible_os_family == 'Debian'`), so this only exercises on
        # ubuntu2204 / ubuntu2404. Prepare stubs `netplan` there to mimic
        # the NetworkManager backend that consumes the source file on apply
        # — the exact scenario the shadow-state idempotency has to survive.
        machine_netplan_enabled: true
        machine_netplan_files:
          - name: "95-molecule.yaml"
            content: |
              network:
                version: 2
                ethernets:
                  molecule0:
                    dhcp4: true
                    optional: true

        machine_scripts_enabled: true
        machine_scripts:
          - name: "molecule-script"
            completion: "echo complete -W ok molecule-script"
          - name: "molecule-sbin-script"
            dest: "/usr/local/sbin"
          - name: "molecule-template-script"
            template: true

        machine_cron_jobs:
          - name: "molecule cron probe"
            user: "root"
            job: "/bin/true"
            minute: "*/7"

        # systemd-journald.service is present on every platform image
        # (so the "restart changed units" handler doesn't fail on a
        # missing unit) and restarting it just rotates its log buffer.
        machine_systemd_dropins:
          - unit: "systemd-journald.service"
            name: "molecule-dropin"
            content: |
              [Service]
              Environment=MOLECULE_DROPIN=ok

        machine_sudoers:
          - name: "10-molecule-script"
            user: "molecule"
            commands: ["/usr/local/bin/molecule-script"]
            nopassword: true

        setup_user_name: "root"
        machine_users:
          - name: "molecule"
            groups: ["wheel"]
            ssh_authorized_keys: >-
              ssh-ed25519
              AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              molecule@test
          - name: "molecule-tunnel"
            shell: "/usr/sbin/nologin"
            ssh_authorized_keys: >-
              restrict,port-forwarding,permitlisten="127.0.0.1:18022"
              ssh-ed25519
              AAAAC3NzaC1lZDI1NTE5AAAAIBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              molecule-tunnel@test
        machine_ssh_dropins:
          - name: "10-molecule-tunnel"
            content: |
              Match User molecule-tunnel
                  AllowTcpForwarding remote
                  PermitOpen none
                  PermitTTY no
          - name: "10-molecule-stale"
            state: "absent"
        hostname: "molecule-test"
