- name: "Verify: machine role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Custom user exists"
      ansible.builtin.command: "id molecule"
      register: "id_user"
      changed_when: false
      failed_when: "id_user.rc != 0"

    - name: "Custom user is in the wheel group"
      ansible.builtin.command: "id -nG molecule"
      register: "id_groups"
      changed_when: false
      failed_when: "'wheel' not in id_groups.stdout.split()"

    - name: "Custom user has the molecule key in authorized_keys"
      ansible.builtin.slurp:
        src: "/home/molecule/.ssh/authorized_keys"
      register: "user_keys"
      failed_when: >-
        'molecule@test' not in (user_keys.content | b64decode | string)

    - name: "Sshd disallows root login"
      ansible.builtin.command: "grep -E '^PermitRootLogin' /etc/ssh/sshd_config"
      register: "sshd_root"
      changed_when: false
      failed_when: "'no' not in sshd_root.stdout"

    - name: "Sshd disallows password auth"
      ansible.builtin.command: "grep -E '^PasswordAuthentication' /etc/ssh/sshd_config"
      register: "sshd_pw"
      changed_when: false
      failed_when: "'no' not in sshd_pw.stdout"

    - name: "Journald keeps logs on disk"
      ansible.builtin.command: "grep -E '^Storage=' /etc/systemd/journald.conf"
      register: "journald_cfg"
      changed_when: false
      failed_when: "'persistent' not in journald_cfg.stdout"

    - name: "Scripts subrole dropped molecule-script into /usr/local/bin"
      ansible.builtin.stat:
        path: "/usr/local/bin/molecule-script"
      register: "scripts_stat"
      failed_when: >-
        not scripts_stat.stat.exists
        or not scripts_stat.stat.executable
        or scripts_stat.stat.mode != '0755'

    # Use absolute path — ansible's `command:` runs with sudo's minimal PATH
    # on RHEL-family (no /usr/local/bin); the localbin-on-PATH wiring is for
    # interactive login shells, which this isn't.
    - name: "Installed script runs"
      ansible.builtin.command: "/usr/local/bin/molecule-script"
      register: "scripts_run"
      changed_when: false
      failed_when: "scripts_run.stdout != 'molecule-script-ok'"

    - name: "Completion snippet dropped to /etc/profile.d"
      ansible.builtin.slurp:
        src: "/etc/profile.d/molecule-script-completion.sh"
      register: "scripts_completion"
      failed_when: >-
        "complete -W ok molecule-script"
        not in (scripts_completion.content | b64decode)

    - name: "Scripts subrole honours per-entry dest override (sbin)"
      ansible.builtin.stat:
        path: "/usr/local/sbin/molecule-sbin-script"
      register: "scripts_sbin_stat"
      failed_when: >-
        not scripts_sbin_stat.stat.exists
        or scripts_sbin_stat.stat.mode != '0755'

    - name: "Sudoers drop-in from machine_sudoers exists and validates"
      ansible.builtin.slurp:
        src: "/etc/sudoers.d/10-molecule-script"
      register: "sudoers_drop_in"
      failed_when: >-
        "molecule ALL=NOPASSWD: /usr/local/bin/molecule-script"
        not in (sudoers_drop_in.content | b64decode)

    - name: "Disks subrole wrote the fstab entry"
      ansible.builtin.command: "grep -E '^tmpfs[[:space:]]+/mnt/molecule-disk[[:space:]]+tmpfs' /etc/fstab"
      register: "disks_fstab"
      changed_when: false
      failed_when: "disks_fstab.rc != 0"

    - name: "Disks subrole mounted the tmpfs"
      ansible.builtin.command: "findmnt -no FSTYPE /mnt/molecule-disk"
      register: "disks_mounted"
      changed_when: false
      failed_when: "disks_mounted.stdout.strip() != 'tmpfs'"
