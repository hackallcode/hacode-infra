- name: "Verify: machine role"
  hosts: "all"
  become: true
  gather_facts: false

  tasks:
    - name: "Custom user exists"
      ansible.builtin.command: "id molecule"
      register: "id_user"
      changed_when: false
      failed_when: "id_user.rc != 0"

    - name: "Custom user is in the wheel group"
      ansible.builtin.command: "id -nG molecule"
      register: "id_groups"
      changed_when: false
      failed_when: "'wheel' not in id_groups.stdout.split()"

    - name: "Custom user has the molecule key in authorized_keys"
      ansible.builtin.slurp:
        src: "/home/molecule/.ssh/authorized_keys"
      register: "user_keys"
      failed_when: >-
        'molecule@test' not in (user_keys.content | b64decode | string)

    - name: "Sshd disallows root login"
      ansible.builtin.command: "grep -E '^PermitRootLogin' /etc/ssh/sshd_config"
      register: "sshd_root"
      changed_when: false
      failed_when: "'no' not in sshd_root.stdout"

    - name: "Sshd disallows password auth"
      ansible.builtin.command: "grep -E '^PasswordAuthentication' /etc/ssh/sshd_config"
      register: "sshd_pw"
      changed_when: false
      failed_when: "'no' not in sshd_pw.stdout"

    - name: "Forwarding-only user got the requested login shell"
      ansible.builtin.command: "getent passwd molecule-tunnel"
      register: "tunnel_passwd"
      changed_when: false
      failed_when: "not tunnel_passwd.stdout.endswith(':/usr/sbin/nologin')"

    - name: "Sshd drop-in from machine_ssh_dropins is on disk verbatim"
      ansible.builtin.slurp:
        src: "/etc/ssh/sshd_config.d/10-molecule-tunnel.conf"
      register: "sshd_dropin"
      failed_when: >-
        (sshd_dropin.content | b64decode) != 'Match User molecule-tunnel\n    AllowTcpForwarding remote\n    PermitOpen none\n    PermitTTY no\n'

    - name: "Sshd applies the drop-in to its user only"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          /usr/sbin/sshd -T -C user={{ item.user }},host=molecule,addr=127.0.0.1
          | grep -E '^(allowtcpforwarding|permittty) '
        executable: "/bin/bash"
      register: "sshd_effective"
      changed_when: false
      failed_when: "sshd_effective.stdout_lines | sort != item.expect"
      loop:
        - {user: "molecule-tunnel", expect: ["allowtcpforwarding remote", "permittty no"]}
        - {user: "molecule", expect: ["allowtcpforwarding yes", "permittty yes"]}
      loop_control:
        label: "{{ item.user }}"

    - name: "Absent sshd drop-in is not on disk"
      ansible.builtin.stat:
        path: "/etc/ssh/sshd_config.d/10-molecule-stale.conf"
      register: "sshd_stale"
      failed_when: "sshd_stale.stat.exists"

    - name: "Journald keeps logs on disk (via drop-in)"
      ansible.builtin.command: "grep -E '^Storage=' /etc/systemd/journald.conf.d/95-hacode.conf"
      register: "journald_cfg"
      changed_when: false
      failed_when: "'persistent' not in journald_cfg.stdout"

    - name: "Journald persistent directory exists"
      ansible.builtin.stat:
        path: "/var/log/journal"
      register: "journald_dir"
      failed_when: "not journald_dir.stat.isdir | default(false)"

    - name: "Scripts subrole dropped molecule-script into /usr/local/bin"
      ansible.builtin.stat:
        path: "/usr/local/bin/molecule-script"
      register: "scripts_stat"
      failed_when: >-
        not scripts_stat.stat.exists
        or not scripts_stat.stat.executable
        or scripts_stat.stat.mode != '0755'

    # Use absolute path — ansible's `command:` runs with sudo's minimal PATH
    # on RHEL-family (no /usr/local/bin); the localbin-on-PATH wiring is for
    # interactive login shells, which this isn't.
    - name: "Installed script runs"
      ansible.builtin.command: "/usr/local/bin/molecule-script"
      register: "scripts_run"
      changed_when: false
      failed_when: "scripts_run.stdout != 'molecule-script-ok'"

    - name: "Completion snippet dropped to /etc/profile.d"
      ansible.builtin.slurp:
        src: "/etc/profile.d/molecule-script-completion.sh"
      register: "scripts_completion"
      failed_when: >-
        "complete -W ok molecule-script"
        not in (scripts_completion.content | b64decode)

    - name: "Scripts subrole honours per-entry dest override (sbin)"
      ansible.builtin.stat:
        path: "/usr/local/sbin/molecule-sbin-script"
      register: "scripts_sbin_stat"
      failed_when: >-
        not scripts_sbin_stat.stat.exists
        or scripts_sbin_stat.stat.mode != '0755'

    - name: "Sudoers drop-in from machine_sudoers exists and validates"
      ansible.builtin.slurp:
        src: "/etc/sudoers.d/10-molecule-script"
      register: "sudoers_drop_in"
      failed_when: >-
        "molecule ALL=NOPASSWD: /usr/local/bin/molecule-script"
        not in (sudoers_drop_in.content | b64decode)

    - name: "Disks subrole wrote the fstab entry"
      ansible.builtin.command: "grep -E '^tmpfs[[:space:]]+/mnt/molecule-disk[[:space:]]+tmpfs' /etc/fstab"
      register: "disks_fstab"
      changed_when: false
      failed_when: "disks_fstab.rc != 0"

    - name: "Disks subrole mounted the tmpfs"
      ansible.builtin.command: "findmnt -no FSTYPE /mnt/molecule-disk"
      register: "disks_mounted"
      changed_when: false
      failed_when: "disks_mounted.stdout.strip() != 'tmpfs'"

    - name: "Templated script rendered with inventory hostname embedded"
      ansible.builtin.command: "/usr/local/bin/molecule-template-script"
      register: "tpl_script_run"
      changed_when: false
      failed_when: "tpl_script_run.stdout != 'molecule-template-ok host=molecule-test'"

    - name: "Cron subrole installed the crontab entry"
      ansible.builtin.command: "crontab -u root -l"
      register: "cron_list"
      changed_when: false
      failed_when: >-
        '#Ansible: molecule cron probe' not in cron_list.stdout
        or '*/7 * * * * /bin/true' not in cron_list.stdout

    - name: "Systemd drop-in fragment is on disk with the expected body"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/systemd-journald.service.d/molecule-dropin.conf"
      register: "dropin_body"
      failed_when: "'Environment=MOLECULE_DROPIN=ok' not in (dropin_body.content | b64decode)"

    - name: "Gather OS family for the Debian-only netplan checks"
      ansible.builtin.setup:
        gather_subset: ["!all", "min"]

    - name: "Netplan subrole recorded the shadow state (Debian)"
      ansible.builtin.slurp:
        src: "/var/lib/hacode/netplan/95-molecule.yaml"
      register: "netplan_shadow"
      when: "ansible_os_family == 'Debian'"

    - name: "Netplan apply handler fired (Debian)"
      ansible.builtin.stat:
        path: "/tmp/netplan-apply.log"
      register: "netplan_apply_log"
      when: "ansible_os_family == 'Debian'"

    - name: "Netplan shadow carries the fixture and apply ran (Debian)"
      ansible.builtin.assert:
        that:
          - "'molecule0' in (netplan_shadow.content | b64decode)"
          - "netplan_apply_log.stat.exists"
      when: "ansible_os_family == 'Debian'"

    # The claude_code fixture is EL-only (see molecule.yml). The setup above
    # already gathered the family and major version these checks key off.
    - name: "Claude_code subrole got Node.js + npm from the distribution"
      ansible.builtin.command: "npm --version"
      register: "npm_version"
      changed_when: false
      failed_when: "npm_version.rc != 0"
      when: "ansible_os_family == 'RedHat'"

    # EL10 dropped dnf modularity, so the stream step must have been skipped
    # rather than having enabled anything. EL8/EL9 would carry the opposite
    # assertion, but no such platform is in this matrix.
    - name: "No nodejs module stream was enabled on EL10"
      ansible.builtin.stat:
        path: "/etc/dnf/modules.d/nodejs.module"
      register: "nodejs_stream"
      failed_when: "nodejs_stream.stat.exists"
      when:
        - "ansible_os_family == 'RedHat'"
        - "ansible_distribution_major_version | int >= 10"
