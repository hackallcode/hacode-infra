# Certificate role scenario. Trust-store paths and the update-trust command
# are picked from vars/{{ ansible_os_family }}.yml inside the role — RHEL
# uses /etc/pki/ca-trust + update-ca-trust, Debian uses
# /usr/local/share/ca-certificates + update-ca-certificates.

driver:
  name: "docker"

platforms:
  - name: "almalinux10"
    image: "almalinux:10"
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "rocky10"
    image: "geerlingguy/docker-rockylinux10-ansible:latest"
    pre_build_image: true
    command: "/usr/sbin/init"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2204"
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]
  - name: "ubuntu2404"
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: "host"
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/tmp"]
    capabilities: ["SYS_ADMIN"]

provisioner:
  name: "ansible"
  inventory:
    group_vars:
      all:
        # ansible_host is left unset so the community.docker connection
        # plugin can resolve it to inventory_hostname (= container name).
        # The role's default `cert_server_san` skips the IP entry when
        # ansible_host isn't a dotted-quad — the cert ends up DNS-only,
        # which is what we want for tests.
        server_names:
          - name: "test.example.local"
            type: "dns"
        cert_subject_org: "Molecule"
        cert_dir: "/tmp/molecule-certs"
        cert_ca_key_path: "/tmp/molecule-certs/{{ cert_ca_name }}.key"
        cert_keystore_password: "molecule"
