- name: "Prepare: EPEL + firewalld stack on RHEL; cron on Debian"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    # No openssl: the role must install it.
    - name: "Install EPEL + firewalld + python3-firewall on RHEL family"
      ansible.builtin.package:
        name:
          - "epel-release"
          - "firewalld"
          - "python3-firewall"
          - "cronie"
        state: "present"
      when: "ansible_os_family == 'RedHat'"

    # Alma and Rocky leave releasever_minor unset, so EPEL 10 resolves to its newest minor, whose certbot
    # deps need a python3-cryptography the older base OS doesn't ship yet.
    - name: "Pin EPEL to the minor release of the base OS"
      ansible.builtin.replace:
        path: "/etc/yum.repos.d/epel.repo"
        regexp: 'repo=epel\$\{releasever_minor:\+-z\}-\$releasever&'
        replace: "repo=epel-{{ ansible_distribution_version }}&"
      when:
        - "ansible_os_family == 'RedHat'"
        - "ansible_distribution_major_version == '10'"

    - name: "Start firewalld on RHEL family"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      when: "ansible_os_family == 'RedHat'"

    - name: "Refresh apt cache + install cron on Debian"
      ansible.builtin.apt:
        name:
          - "cron"
        state: "present"
        update_cache: true
        cache_valid_time: 600
      when: "ansible_os_family == 'Debian'"

    # The role registers an ACME account against the active server when
    # none is present. A non-empty accounts directory under the matching
    # server hostname short-circuits that step. Cover both the LE prod
    # and LE staging hostnames because the converge below also exercises
    # `certbot_staging: true`.
    - name: "Pre-create fake ACME account directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "0700"
        recurse: true
      loop:
        - "/etc/letsencrypt/accounts/acme-v02.api.letsencrypt.org/directory/molecule"
        - "/etc/letsencrypt/accounts/acme-staging-v02.api.letsencrypt.org/directory/molecule"

    # For the backup round trip in verify.
    - name: "Install rsync, tar and gzip"
      ansible.builtin.package:
        name: ["rsync", "tar", "gzip"]
        state: "present"
