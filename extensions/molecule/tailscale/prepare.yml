- name: "Prepare: firewalld on RHEL (the role configures it)"
  hosts: "all"
  become: true
  gather_facts: true

  tasks:
    - name: "Install firewalld, sysctl and gnupg"
      ansible.builtin.package:
        name: "{{ ['firewalld', 'procps-ng'] if ansible_os_family == 'RedHat' else ['gnupg'] }}"
        state: "present"
        update_cache: true

    - name: "Seed a rich rule the role must remove"
      ansible.posix.firewalld:
        zone: "trusted"
        rich_rule: 'rule family="ipv4" destination address="192.0.2.2" reject'
        state: "enabled"
        permanent: true
      when: "ansible_os_family == 'RedHat'"

    - name: "Start firewalld on RHEL family"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      when: "ansible_os_family == 'RedHat'"

    - name: "Ensure /etc/sysctl.d exists"
      ansible.builtin.file:
        path: "/etc/sysctl.d"
        state: "directory"
        mode: "0755"

    - name: "Create the node_exporter textfile dir"
      ansible.builtin.file:
        path: "/var/lib/node_exporter"
        state: "directory"
        mode: "0755"
