name: "release"

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish to Ansible Galaxy"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Check out collection"
        uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"  # v4.x

      - name: "Set up Python"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"  # v5.x
        with:
          python-version: "3.11"

      - name: "Install ansible-core"
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: "Verify tag matches galaxy.yml version"
        run: |
          tag="${GITHUB_REF##*/}"
          tag="${tag#v}"
          file_version="$(grep '^version:' galaxy.yml | awk '{print $2}' | tr -d '\"')"
          if [ "$tag" != "$file_version" ]; then
            echo "Tag v$tag does not match galaxy.yml version $file_version" >&2
            exit 1
          fi

      - name: "Build collection"
        run: "ansible-galaxy collection build --output-path dist/"

      - name: "Publish to Galaxy"
        env:
          ANSIBLE_GALAXY_TOKEN: "${{ secrets.ANSIBLE_GALAXY_TOKEN }}"
        run: |
          ansible-galaxy collection publish \
            --token "${ANSIBLE_GALAXY_TOKEN}" \
            dist/hacode-infra-*.tar.gz

      - name: "Extract release notes from CHANGELOG"
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi

      - name: "Create GitHub Release"
        uses: "softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65"  # v2.x
        with:
          files: "dist/hacode-infra-*.tar.gz"
          body_path: "release-notes.md"
