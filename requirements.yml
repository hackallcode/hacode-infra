# Galaxy dependencies pulled in by molecule before each scenario runs.
# Mirrors `dependencies` in galaxy.yml; keep the two lists in sync.
collections:
  - name: "ansible.posix"
    version: ">=1.5.0"
  - name: "community.general"
    version: ">=8.0.0"
  - name: "community.docker"
    version: ">=3.10.0"
  - name: "community.mysql"
    version: ">=3.10.0"
  - name: "community.crypto"
    version: ">=2.20.0"
  - name: "kubernetes.core"
    version: ">=3.0.0"
  - name: "prometheus.prometheus"
    # 0.29+ widens its requires_ansible up to core 2.20.99; older 0.27.x
    # capped at 2.18.99, breaking installs on newer ansible.
    version: ">=0.29.0"
